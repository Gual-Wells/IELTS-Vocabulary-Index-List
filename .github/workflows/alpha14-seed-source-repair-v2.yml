name: Alpha14 Seed source repair v2

on:
  push:
    branches: [alpha14-seed-source-repair-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download pinned Chinese reference layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coca /tmp/phrase-ref

          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/Gual-Wells/IELTS-Vocabulary-Index-List/seed9-semantic-review/data/seed-baselines/seed-9-glosses.json' \
            -o /tmp/seed9-glosses.json

          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/skywind3000/ECDICT/bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b/ecdict.csv' \
            -o /tmp/ecdict.csv

          for part in $(seq 1 50); do
            start=$(( (part - 1) * 200 + 1 ))
            end=$(( part * 200 ))
            file=$(printf 'part%03d_%d-%d.md' "$part" "$start" "$end")
            curl -fL --retry 3 \
              "https://raw.githubusercontent.com/llt22/coca-vocabulary-20000/cee58af112e7469261bd52ce5a44d75986ac757b/vocabulary/${file}" \
              -o "/tmp/coca/${file}"
          done

          curl -fL --retry 3 \
            'https://download.freedict.org/generated/eng-zho/eng-zho.tei' \
            -o /tmp/eng-zho.tei

          curl -fL --retry 2 \
            'https://kaikki.org/zhwiktionary/%E8%8B%B1%E8%AF%AD/kaikki.org-dictionary-%E8%8B%B1%E8%AF%AD.jsonl' \
            -o /tmp/kaikki-en.jsonl || rm -f /tmp/kaikki-en.jsonl

          git clone --filter=blob:none --sparse https://github.com/KyleBing/english-vocabulary.git /tmp/cnref
          cd /tmp/cnref
          git checkout 66f4a6db7b61eab3534d7b84f10eed312bca4ed6
          git sparse-checkout set 'full_line_jsonl/simple/正序'
          for book in '四级' '六级' '专四' '专八' '雅思' '考研' '托福' '高中' '商务英语' 'GRE' 'SAT'; do
            file="full_line_jsonl/simple/正序/${book}.jsonl"
            if [ -f "$file" ]; then cp "$file" "/tmp/phrase-ref/${book}.jsonl"; fi
          done
          cd "$GITHUB_WORKSPACE"

          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/Gual-Wells/IELTS-Vocabulary-Index-List/cbe5c2b347233cc2faaeeee5094f4fe6cf586210/tools/apply_alpha14_seed_repair.mjs' \
            -o tools/apply_alpha14_seed_repair.mjs

      - name: Build focused repair stage
        env:
          ECDICT_PATH: /tmp/ecdict.csv
          COCA_DIR: /tmp/coca
          FREEDICT_PATH: /tmp/eng-zho.tei
          KAIKKI_PATH: /tmp/kaikki-en.jsonl
          PHRASE_REF_DIR: /tmp/phrase-ref
          SEED9_REFERENCE: /tmp/seed9-glosses.json
          ALPHA14_REPAIR_STAGE: /tmp/alpha14-seed-repair-stage.json
        run: python tools/repair_alpha14_seed.py

      - name: Apply only damaged Seed fields
        env:
          ALPHA14_REPAIR_STAGE: /tmp/alpha14-seed-repair-stage.json
          SEED_REPAIR_GENERATED_AT: '2026-09-12T09:00:00.000Z'
        run: node tools/apply_alpha14_seed_repair.mjs

      - name: Activate safe Seed8 to Seed9 migration
        shell: python
        run: |
          from pathlib import Path
          db = Path('js/v3-db.js')
          text = db.read_text(encoding='utf-8')
          text = text.replace('export const BUILTIN_SEED_REVISION = 8;', 'export const BUILTIN_SEED_REVISION = 9;')
          old = """async function loadSeedFieldBaseline(revision) {
            if (revision !== 7) return null;
            const raw = await loadSeedFile('seed-baselines/seed-7-glosses.json');
            if (raw?.protocol !== 'vix-seed-field-baseline/1' || Number(raw.seedRevision) !== revision || !Array.isArray(raw.entries)) {
              throw new Error('Seed 7 gloss baseline is invalid');
            }
            return raw;
          }"""
          new = """async function loadSeedFieldBaseline(revision) {
            if (![7, 8].includes(revision)) return null;
            const raw = await loadSeedFile(`seed-baselines/seed-${revision}-glosses.json`);
            if (raw?.protocol !== 'vix-seed-field-baseline/1' || Number(raw.seedRevision) !== revision || !Array.isArray(raw.entries)) {
              throw new Error(`Seed ${revision} gloss baseline is invalid`);
            }
            return raw;
          }"""
          if old not in text: raise SystemExit('expected Seed baseline loader not found')
          db.write_text(text.replace(old, new), encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = 'v5.0.0-alpha.14-shell-20260908-1'
          if old_cache not in sw_text: raise SystemExit('expected alpha14 cache generation not found')
          sw.write_text(sw_text.replace(old_cache, 'v5.0.0-alpha.14-seed9-20260912-2'), encoding='utf-8')

      - name: Focused QA gates
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-db.js
          node --check js/v5-seed-migration.js
          node --check sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('data/seed-baselines/seed-9-alpha14-repair-qa.json').read_text(encoding='utf-8'))
          scope=qa['repairScope']
          assert qa['seedRevision']==9
          assert qa['counts']=={'entries':23917,'memberships':61905,'relationComponents':20793}
          assert scope['generalMissing']==9143 and scope['generalMissingWords']==3051 and scope['generalMissingPhrases']==6092
          assert scope['computerMissing']==0 and scope['usageReviewed']==595
          assert qa['structuredBlankAfter']=={'general':0,'computer':0}
          assert qa['usage']['genericTemplateRemaining']==0
          assert qa['nonTargetEntryDrift']==0 and qa['nonGlossDrift']==0 and qa['canonicalConversionMismatches']==0
          # Diagnostic persistence gate only. Final branch must drive this to zero
          # reviewed-unresolved entries before merge.
          assert qa['aiFallbackCount'] < 2200, qa['aiFallbackCount']
          print('FOCUSED_QA_DIAGNOSTIC_OK', json.dumps({
            'scope':scope,
            'sourceCounts':qa['sourceCounts'],
            'referenceCoverage':qa['referenceCoverage'],
            'evidenceCounts':qa['evidenceCounts'],
            'aiFallbackCount':qa['aiFallbackCount'],
          },ensure_ascii=False))
          PY

      - name: Commit generated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seed5-runtime data/seed-baselines/seed-8-glosses.json data/seed-baselines/seed-9-alpha14-repair-qa.json js/v3-db.js sw.js
          git diff --cached --stat
          git commit -m 'fix(seed): persist alpha14 source-repair review set'
          git push origin HEAD:alpha14-seed-source-repair-v2
