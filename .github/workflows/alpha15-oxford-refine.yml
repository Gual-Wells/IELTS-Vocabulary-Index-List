name: Alpha15 Oxford refine
on:
  push:
    paths:
      - '.github/workflows/alpha15-oxford-refine.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Oxford reference refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('js/v3-ui.js')
          text = ui.read_text(encoding='utf-8')

          old = """  const countText = collection.type === 'normal'\n    ? (contents ? `${contents.toLocaleString()} 内容` : `${words.toLocaleString()} 词`)\n    : (globalSystemView ? (state.projectionUniqueCounts.get(collection.id) || 0) : allEntries.length).toLocaleString();\n  const viewLabel = collection.type === 'normal'\n    ? (currentViewKind === 'content' ? '内容视图' : '词汇视图') : '';\n  const collectionSubtitle = [countText, viewLabel].filter(Boolean).join(' · ');\n  elements['page-subtitle'].textContent = collectionSubtitle;\n  renderLargeTitle({\n    eyebrow: activeMirrorLabel ? 'MIRROR · ' + collection.name : domain?.name || (globalSystemView ? '全局索引' : ''),\n    title: activeMirrorLabel || collection.name,\n    subtitle: collectionSubtitle,\n  });"""
          new = """  elements['page-subtitle'].textContent = '';\n  renderLargeTitle({\n    eyebrow: activeMirrorLabel ? 'MIRROR · ' + collection.name : domain?.name || (globalSystemView ? '全局索引' : ''),\n    title: activeMirrorLabel || collection.name,\n    subtitle: '',\n  });"""
          if old not in text:
              raise SystemExit('collection subtitle block not found')
          text = text.replace(old, new, 1)

          old = """  const searchContent = el('div', { className: 'search-modal-content' }, [el('div', { className: 'search-controls' }, [input, scope, aiButton]), status, results]);\n  activeSearchFrame = openDialog({\n    title: '搜索内容', body: [searchContent], showCancel: false, variant: 'search', kind: 'search',\n  });"""
          new = """  const searchContent = el('div', { className: 'search-modal-content' }, [\n    el('div', { className: 'search-controls' }, [\n      el('div', { className: 'search-query-row' }, [input, aiButton]),\n      el('div', { className: 'search-scope-row' }, [el('span', { className: 'search-scope-label', text: '搜索范围' }), scope]),\n    ]),\n    status, results,\n  ]);\n  activeSearchFrame = openDialog({\n    title: '搜索', body: [searchContent], showCancel: false, variant: 'search', kind: 'search',\n  });"""
          if old not in text:
              raise SystemExit('search content block not found')
          text = text.replace(old, new, 1)

          old = """  openDialog({ title: 'Bridge', variant: 'management', submitText: '保存', body: [\n    field('Bridge URL', url), field('Device Token', token),\n    field('Groq 查询 API Key', queryKey, '用于搜索中的 AI 联想；由 Bridge 保存。'),\n    el('div', { className: 'settings-row' }, [test, removeQueryKey, clear]),\n    el('section', { className: 'bridge-integration-resources' }, [el('h3', { text: '集成资源' }), el('div', { className: 'bridge-download-row' }, [functionLink, instructionLink])]),\n  ], onSubmit: async () => {"""
          new = """  openDialog({ title: 'Bridge', variant: 'management', submitText: '保存', body: [\n    el('div', { className: 'bridge-settings' }, [\n      el('section', { className: 'bridge-section' }, [\n        el('h3', { text: '连接' }),\n        field('Bridge URL', url), field('Device Token', token),\n      ]),\n      el('section', { className: 'bridge-section' }, [\n        el('h3', { text: 'AI 搜索' }),\n        field('Groq 查询 API Key', queryKey, '用于搜索中的 AI 联想；由 Bridge 保存。'),\n      ]),\n      el('section', { className: 'bridge-section bridge-actions-section' }, [\n        el('h3', { text: '操作' }),\n        el('div', { className: 'bridge-action-list' }, [test, removeQueryKey, clear]),\n      ]),\n      el('section', { className: 'bridge-section bridge-integration-resources' }, [\n        el('h3', { text: '集成资源' }),\n        el('div', { className: 'bridge-download-row' }, [functionLink, instructionLink]),\n      ]),\n    ]),\n  ], onSubmit: async () => {"""
          if old not in text:
              raise SystemExit('bridge body block not found')
          text = text.replace(old, new, 1)
          ui.write_text(text, encoding='utf-8')

          css = Path('css/v5.0.0-alpha.15.css')
          base = css.read_text(encoding='utf-8')
          marker = '/* === alpha.15 Oxford screenshot refinement pass === */'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip() + '\n'
          refinement = r'''/* === alpha.15 Oxford screenshot refinement pass === */
/* The supplied Oxford iOS screenshots are the reference, not generic card UI.
   Light: Oxford red + warm paper. Dark: true black + neutral strips; red is action colour.
   UI uses the iOS/PingFang system stack; lexical list text stays clean sans, matching Oxford lists. */
:root {
  --vix-ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  --vix-reading-font: Georgia, "Times New Roman", "Songti SC", serif;
  --ox-red: #eb0030;
  --ox-paper: #f5efdc;
  --ox-paper-line: #cbc7ba;
  --ox-ui-bg: #f2f2f7;
  --ox-ui-surface: #ffffff;
  --ox-ui-strip: #e6e6ea;
  --ox-ui-line: #d1d1d6;
  --ox-ui-muted: #8e8e93;
  --ox-blue: #003866;
  --ox-blue-dark: #0a9ad9;
}
html, body, button, input, select, textarea { font-family: var(--vix-ui-font) !important; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

/* Typography and chrome: the old serif brand/collection styling was the largest mismatch. */
.topbar .brand-block h1,
#page-title,
#large-title-heading,
.large-title-heading,
.scope-heading h3,
.domain-heading h3,
.collection-card h3,
.entry-text,
.letter-title,
.modal-card .dialog-header h2,
.settings-section h3,
.bridge-section h3,
.manager-domain-header strong {
  font-family: var(--vix-ui-font) !important;
}
.topbar .brand-block h1,
#page-title {
  font-size: 20px !important;
  line-height: 1.12 !important;
  font-weight: 700 !important;
  letter-spacing: -.025em !important;
}
#large-title-heading,
.large-title-heading {
  font-size: clamp(34px, 9vw, 43px) !important;
  line-height: 1.04 !important;
  font-weight: 760 !important;
  letter-spacing: -.045em !important;
}
#large-title-eyebrow,
.large-title-eyebrow {
  font: 700 12px/1.25 var(--vix-ui-font) !important;
  letter-spacing: .08em !important;
}

/* Home: Oxford catalogue rhythm — less dead air, vertically centred rows. */
#main-content { background: var(--bg) !important; }
.large-title {
  margin: 0 8px 28px !important;
  padding: 25px 0 24px !important;
  border-bottom: 1px solid var(--line) !important;
}
#home-view { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.index-scope,
.domain-section {
  margin: 0 8px 34px !important;
  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
}
.scope-heading,
.domain-heading {
  min-height: 48px !important;
  display: flex !important;
  align-items: center !important;
  gap: 14px !important;
  margin: 0 !important;
  padding: 0 2px !important;
  border: 0 !important;
  border-bottom: 1px solid var(--line) !important;
  background: transparent !important;
}
.scope-heading h3,
.domain-heading h3 {
  margin: 0 !important;
  color: var(--accent) !important;
  font-size: 17px !important;
  line-height: 1 !important;
  font-weight: 700 !important;
  letter-spacing: -.01em !important;
}
.scope-actions { margin-left: auto; display: flex; align-items: center; }
.home-mirror-button {
  width: 42px !important;
  height: 42px !important;
  min-height: 42px !important;
  color: var(--accent) !important;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}
.collection-grid,
.global-grid { border: 0 !important; background: transparent !important; }
.collection-card,
.global-grid .collection-card {
  min-height: 64px !important;
  height: 64px !important;
  padding: 0 6px !important;
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) 20px !important;
  align-items: center !important;
  border-bottom: 1px solid var(--line) !important;
  background: transparent !important;
}
.collection-card h3,
.global-grid .collection-card h3 {
  align-self: center !important;
  margin: 0 !important;
  font-size: 17px !important;
  line-height: 1.2 !important;
  font-weight: 560 !important;
  letter-spacing: -.015em !important;
}
.collection-card::after,
.global-grid .collection-card::after {
  align-self: center !important;
  color: #b8b5aa !important;
  font-size: 26px !important;
}

/* Collection title: no count/view subtitle; compact editorial heading. */
#collection-view:not(.hidden) ~ * { }
.collection-toolbar {
  min-height: 0 !important;
  margin: 0 8px 12px !important;
  padding: 0 0 10px !important;
  border-bottom: 1px solid var(--line) !important;
}
.collection-context { font-size: 12px !important; line-height: 1.3 !important; }

/* Alphabet rail: Oxford segmented-control proportions, not a large button tray. */
.letter-nav {
  margin: 0 0 8px !important;
  padding: 0 2px 8px !important;
  background: var(--bg) !important;
  border: 0 !important;
}
.letter-nav-track {
  min-height: 48px !important;
  height: 48px !important;
  display: flex !important;
  align-items: stretch !important;
  gap: 0 !important;
  padding: 2px !important;
  border: 1px solid color-mix(in srgb, var(--ox-ui-line) 75%, transparent) !important;
  border-radius: 12px !important;
  background: var(--ox-ui-strip) !important;
  box-shadow: none !important;
}
.letter-nav-track button,
.letter-nav button {
  flex: 0 0 46px !important;
  width: 46px !important;
  height: 42px !important;
  min-height: 42px !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 10px !important;
  background: transparent !important;
  color: #5f5f64 !important;
  font-size: 15px !important;
  line-height: 42px !important;
  font-weight: 650 !important;
  box-shadow: none !important;
}
.letter-nav-track button.active,
.letter-nav button.active {
  color: #111111 !important;
  background: #ffffff !important;
  box-shadow: 0 1px 3px rgb(0 0 0 / 14%) !important;
}
.letter-nav-track button.empty,
.letter-nav button.empty { opacity: .24 !important; }

/* Letter sections and lexical rows: tighter, clearer text hierarchy. */
.entry-list { gap: 8px !important; }
.letter-heading {
  min-height: 44px !important;
  padding: 0 12px !important;
  display: grid !important;
  align-items: center !important;
  border-top: 1px solid var(--line) !important;
  border-bottom: 1px solid var(--line) !important;
  background: transparent !important;
}
.letter-title {
  color: var(--muted) !important;
  font-size: 14px !important;
  line-height: 1 !important;
  font-weight: 700 !important;
}
.letter-count,
.letter-indicator {
  color: var(--muted) !important;
  font-size: 13px !important;
  line-height: 1 !important;
}
.entry-row {
  min-height: 62px !important;
  border-bottom: 1px solid var(--oxford-rule) !important;
  background: var(--bg) !important;
}
.entry-line { min-height: 62px !important; align-items: center !important; }
.entry-text {
  font-size: 17.5px !important;
  line-height: 1.18 !important;
  font-weight: 650 !important;
  letter-spacing: -.018em !important;
}
.entry-gloss {
  margin-top: 3px !important;
  max-height: 2.7em !important;
  color: var(--muted) !important;
  font-size: 13.5px !important;
  line-height: 1.32 !important;
  font-family: var(--vix-ui-font) !important;
}
.entry-actions .icon-button,
.entry-control-main .icon-button,
.entry-pin,
.entry-query,
.entry-study-refresh {
  color: var(--muted) !important;
}
.entry-actions .ui-icon,
.entry-control-main .ui-icon { width: 21px !important; height: 21px !important; }

/* Bottom collection toolbar: opaque stable layer and VIX/Oxford red actions. */
.bottom-toolbar {
  background: var(--bg) !important;
  border-top: 1px solid var(--line) !important;
  box-shadow: 0 -1px 0 rgb(0 0 0 / 2%) !important;
  opacity: 1 !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
.bottom-toolbar::before,
.bottom-toolbar::after { display: none !important; }
.bottom-toolbar > button {
  color: var(--accent) !important;
  opacity: 1 !important;
  background: transparent !important;
  filter: none !important;
}
.bottom-toolbar > button .ui-icon { color: currentColor !important; opacity: 1 !important; }
.bottom-toolbar > button:active,
.bottom-toolbar > button.active,
.bottom-toolbar > button[aria-pressed="true"] {
  color: var(--accent) !important;
  background: var(--accent-soft) !important;
}
#entry-list { padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px)) !important; }

/* Search: compact Oxford search page. Prevent grid/flex stretching that created giant controls. */
.modal-layer[data-variant="search"] { place-items: stretch !important; padding: 0 !important; }
.modal-card-search {
  width: 100% !important;
  max-width: none !important;
  height: var(--visual-height, 100dvh) !important;
  max-height: var(--visual-height, 100dvh) !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  background: var(--bg) !important;
}
.modal-card-search .dialog-header {
  flex: 0 0 auto !important;
  min-height: calc(48px + var(--safe-top)) !important;
  padding: calc(8px + var(--safe-top)) max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left)) !important;
  background: var(--ox-chrome) !important;
  border-bottom: 0 !important;
}
.modal-card-search .dialog-header h2 {
  margin: 0 !important;
  font-size: 18px !important;
  font-weight: 700 !important;
}
.modal-card-search .dialog-body {
  display: block !important;
  flex: 1 1 auto !important;
  min-height: 0 !important;
  padding: 0 !important;
  overflow-y: auto !important;
  background: var(--bg) !important;
}
.search-modal-content {
  display: block !important;
  min-height: 0 !important;
  background: var(--bg) !important;
}
.search-controls {
  display: block !important;
  min-height: 0 !important;
  padding: 4px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left)) !important;
  background: var(--ox-chrome) !important;
  border-bottom: 0 !important;
}
.search-query-row {
  min-height: 44px !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
}
.search-query-row input {
  flex: 1 1 auto !important;
  width: auto !important;
  height: 44px !important;
  min-height: 44px !important;
  max-height: 44px !important;
  margin: 0 !important;
  padding: 0 13px !important;
  border: 0 !important;
  border-radius: 9px !important;
  background: #ffffff !important;
  color: #111111 !important;
  font-size: 17px !important;
  line-height: 44px !important;
  box-shadow: none !important;
}
.search-query-row .secondary-button {
  flex: 0 0 auto !important;
  width: auto !important;
  min-height: 38px !important;
  margin: 0 !important;
  padding: 0 11px !important;
  border: 1px solid rgb(255 255 255 / 74%) !important;
  border-radius: 8px !important;
  background: transparent !important;
  color: #ffffff !important;
  font-size: 13px !important;
}
.search-scope-row {
  min-height: 52px !important;
  display: grid !important;
  grid-template-columns: auto minmax(0, 1fr) !important;
  align-items: center !important;
  gap: 12px !important;
  margin: 10px calc(-1 * max(14px, env(safe-area-inset-right))) -10px calc(-1 * max(14px, env(safe-area-inset-left))) !important;
  padding: 6px max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left)) !important;
  background: var(--ox-ui-bg) !important;
  border-bottom: 1px solid var(--ox-ui-line) !important;
}
.search-scope-label {
  color: var(--ox-ui-muted) !important;
  font-size: 12px !important;
  font-weight: 600 !important;
  white-space: nowrap;
}
.search-scope-row select {
  width: 100% !important;
  height: 38px !important;
  min-height: 38px !important;
  max-height: 38px !important;
  margin: 0 !important;
  padding: 0 31px 0 12px !important;
  border: 0 !important;
  border-radius: 9px !important;
  background: var(--ox-ui-surface) !important;
  color: #202024 !important;
  font-size: 14px !important;
  box-shadow: inset 0 0 0 1px var(--ox-ui-line) !important;
}
.search-status {
  margin: 0 !important;
  padding: 8px 16px !important;
  min-height: 0 !important;
  background: var(--ox-ui-bg) !important;
  color: var(--ox-ui-muted) !important;
  font-size: 12px !important;
}
.search-status:empty { display: none !important; }
.search-results { display: block !important; min-height: 0 !important; background: var(--bg) !important; }
.search-result {
  min-height: 58px !important;
  padding: 0 18px !important;
  border-bottom: 1px solid var(--line) !important;
  background: transparent !important;
}
.search-result strong { font-size: 17px !important; font-weight: 520 !important; }
.search-result span { font-size: 12px !important; color: var(--muted) !important; }

/* Full-screen utility pages: fixed body rhythm, no stretched form fields. */
.modal-layer[data-variant="management"],
.modal-layer[data-variant="file-picker"] { place-items: stretch !important; padding: 0 !important; }
.modal-card-management,
.modal-card-file-picker {
  width: 100% !important;
  max-width: none !important;
  height: var(--visual-height, 100dvh) !important;
  max-height: var(--visual-height, 100dvh) !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}
.modal-card-management .dialog-header,
.modal-card-file-picker .dialog-header {
  flex: 0 0 auto !important;
  min-height: calc(58px + var(--safe-top)) !important;
  padding: calc(12px + var(--safe-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)) !important;
  background: var(--ox-chrome) !important;
  border-bottom: 0 !important;
}
.modal-card-management .dialog-header h2,
.modal-card-file-picker .dialog-header h2 {
  font-size: 20px !important;
  line-height: 1.1 !important;
  font-weight: 700 !important;
}
.modal-card-management .dialog-body,
.modal-card-file-picker .dialog-body {
  display: block !important;
  flex: 1 1 auto !important;
  min-height: 0 !important;
  padding: 0 !important;
  overflow-y: auto !important;
  background: var(--ox-ui-bg) !important;
}
.modal-card-management .dialog-actions,
.modal-card-file-picker .dialog-actions {
  position: sticky !important;
  bottom: 0 !important;
  z-index: 3 !important;
  flex: 0 0 auto !important;
  padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + var(--safe-bottom)) max(16px, env(safe-area-inset-left)) !important;
  background: var(--ox-ui-surface) !important;
  border-top: 1px solid var(--ox-ui-line) !important;
}
.modal-card-management .dialog-actions button {
  min-height: 44px !important;
  border-radius: 10px !important;
}

/* Bridge: grouped utility rows instead of an admin form. */
.bridge-settings { display: block !important; background: var(--ox-ui-bg) !important; }
.bridge-section {
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  background: var(--ox-ui-surface) !important;
}
.bridge-section + .bridge-section { margin-top: 18px !important; }
.bridge-section > h3 {
  margin: 0 !important;
  padding: 10px 16px 7px !important;
  background: var(--ox-ui-bg) !important;
  color: var(--ox-ui-muted) !important;
  font-size: 13px !important;
  line-height: 1.2 !important;
  font-weight: 600 !important;
}
.bridge-section .field {
  display: grid !important;
  gap: 7px !important;
  margin: 0 !important;
  padding: 10px 16px 12px !important;
  border-bottom: 1px solid var(--ox-ui-line) !important;
  background: var(--ox-ui-surface) !important;
}
.bridge-section .field > span {
  color: var(--ox-ui-muted) !important;
  font-size: 12px !important;
  font-weight: 600 !important;
}
.bridge-section .field input {
  width: 100% !important;
  height: 46px !important;
  min-height: 46px !important;
  max-height: 46px !important;
  margin: 0 !important;
  padding: 0 12px !important;
  border: 1px solid var(--ox-ui-line) !important;
  border-radius: 9px !important;
  background: var(--ox-ui-surface) !important;
  color: var(--text) !important;
  font-size: 15px !important;
  line-height: 46px !important;
}
.bridge-section .help-text { margin: 0 !important; font-size: 12px !important; line-height: 1.4 !important; }
.bridge-action-list { display: block !important; background: var(--ox-ui-surface) !important; }
.bridge-action-list .secondary-button {
  position: relative !important;
  width: 100% !important;
  min-height: 54px !important;
  padding: 0 42px 0 16px !important;
  border: 0 !important;
  border-bottom: 1px solid var(--ox-ui-line) !important;
  border-radius: 0 !important;
  background: var(--ox-ui-surface) !important;
  color: var(--text) !important;
  text-align: left !important;
  font-size: 16px !important;
  font-weight: 500 !important;
}
.bridge-action-list .secondary-button::after {
  content: "›";
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #b8b8bd;
  font-size: 25px;
  font-weight: 300;
}
.bridge-integration-resources { margin: 18px 0 0 !important; padding: 0 !important; border: 0 !important; }
.bridge-download-row {
  min-height: 56px !important;
  display: flex !important;
  align-items: center !important;
  gap: 22px !important;
  padding: 0 16px !important;
  background: var(--ox-ui-surface) !important;
  border-bottom: 1px solid var(--ox-ui-line) !important;
}
.integration-resource-link,
.integration-resource-link:visited { min-height: 44px !important; color: var(--accent) !important; font-size: 14px !important; }

/* Mirror: resource browser, not a giant empty table. */
.mirror-explorer {
  min-height: 0 !important;
  height: auto !important;
  display: block !important;
  padding: 16px !important;
  background: var(--ox-ui-bg) !important;
  border: 0 !important;
}
.mirror-explorer-toolbar {
  display: grid !important;
  grid-template-columns: auto minmax(0, 1fr) !important;
  align-items: center !important;
  gap: 10px !important;
  margin: 0 0 14px !important;
}
.mirror-explorer-path {
  min-height: 42px !important;
  height: 42px !important;
  padding: 0 12px !important;
  border: 1px solid var(--ox-ui-line) !important;
  border-radius: 10px !important;
  background: var(--ox-ui-surface) !important;
  color: var(--ox-ui-muted) !important;
  white-space: nowrap;
}
.mirror-explorer-path strong { color: var(--text) !important; }
.mirror-explorer-search {
  width: 100% !important;
  height: 42px !important;
  min-height: 42px !important;
  max-height: 42px !important;
  margin: 0 !important;
  padding: 0 12px !important;
  border: 1px solid var(--ox-ui-line) !important;
  border-radius: 10px !important;
  background: var(--ox-ui-surface) !important;
  color: var(--text) !important;
  font-size: 15px !important;
}
.mirror-explorer-heading {
  min-height: 32px !important;
  height: 32px !important;
  grid-template-columns: minmax(0, 1fr) auto !important;
  padding: 0 12px !important;
  border: 0 !important;
  border-bottom: 1px solid var(--ox-ui-line) !important;
  background: var(--ox-ui-bg) !important;
  color: var(--ox-ui-muted) !important;
  font-size: 11px !important;
}
.mirror-library {
  min-height: 0 !important;
  height: auto !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: var(--ox-ui-surface) !important;
}
.mirror-library-card {
  min-height: 64px !important;
  grid-template-columns: minmax(0, 1fr) auto !important;
  border: 0 !important;
  border-bottom: 1px solid var(--ox-ui-line) !important;
  background: var(--ox-ui-surface) !important;
}
.mirror-library-open { min-height: 64px !important; padding: 8px 12px !important; }
.mirror-library-actions { min-width: 0 !important; padding: 8px 10px !important; gap: 6px !important; }
.mirror-explorer-empty {
  min-height: 124px !important;
  height: auto !important;
  margin: 0 !important;
  padding: 28px 16px !important;
  background: var(--ox-ui-surface) !important;
  color: var(--ox-ui-muted) !important;
  font-size: 14px !important;
}

/* Dark follows Oxford literally: black UI, neutral gray structure, semantic red/blue only. */
@media (prefers-color-scheme: dark) {
  :root {
    --ox-ui-bg: #000000;
    --ox-ui-surface: #000000;
    --ox-ui-strip: #4c4c4c;
    --ox-ui-line: #1c1c1e;
    --ox-ui-muted: #8e8e93;
  }
  html, body, #app, main, #main-content, .navigation-underlay { background: #000000 !important; }
  .topbar { background: #000000 !important; border-bottom: 1px solid #1c1c1e !important; }
  .scope-heading h3,
  .domain-heading h3 { color: #ffffff !important; }
  #large-title-eyebrow,
  .large-title-eyebrow { color: #8e8e93 !important; }
  .collection-card::after,
  .global-grid .collection-card::after { color: #5c5c60 !important; }
  .letter-nav-track {
    background: #4c4c4c !important;
    border-color: #5a5a5e !important;
  }
  .letter-nav-track button,
  .letter-nav button { color: #e4e4e7 !important; }
  .letter-nav-track button.active,
  .letter-nav button.active { color: #111111 !important; background: #ffffff !important; }
  .letter-heading { border-color: #2a2a2c !important; background: #000000 !important; }
  .entry-row { background: #000000 !important; border-bottom-color: #1c1c1e !important; }
  .entry-text { color: #ffffff !important; }
  .entry-gloss { color: #8e8e93 !important; }
  .bottom-toolbar {
    background: #000000 !important;
    border-top-color: #1c1c1e !important;
  }
  .bottom-toolbar > button { color: var(--accent) !important; }
  .modal-card-search .dialog-header,
  .search-controls,
  .modal-card-management .dialog-header,
  .modal-card-file-picker .dialog-header { background: #000000 !important; border-bottom: 1px solid #1c1c1e !important; }
  .search-scope-row,
  .search-status,
  .modal-card-management .dialog-body,
  .modal-card-file-picker .dialog-body,
  .bridge-settings,
  .mirror-explorer { background: #000000 !important; }
  .search-scope-row { border-bottom-color: #1c1c1e !important; }
  .search-scope-row select { background: #4c4c4c !important; color: #ffffff !important; box-shadow: none !important; }
  .search-query-row .secondary-button { color: var(--accent) !important; border-color: #3a3a3c !important; }
  .bridge-section,
  .bridge-section .field,
  .bridge-action-list,
  .bridge-action-list .secondary-button,
  .bridge-download-row,
  .mirror-explorer-path,
  .mirror-library,
  .mirror-library-card,
  .mirror-explorer-empty,
  .modal-card-management .dialog-actions,
  .modal-card-file-picker .dialog-actions { background: #000000 !important; }
  .bridge-section > h3 { background: #1c1c1e !important; color: #8e8e93 !important; }
  .bridge-section .field,
  .bridge-action-list .secondary-button,
  .bridge-download-row,
  .mirror-library-card { border-color: #1c1c1e !important; }
  .bridge-section .field input,
  .mirror-explorer-search,
  .mirror-explorer-path { background: #1c1c1e !important; border-color: #3a3a3c !important; color: #ffffff !important; }
  .mirror-explorer-heading { background: #1c1c1e !important; border-bottom-color: #3a3a3c !important; color: #8e8e93 !important; }
  .modal-card-management .dialog-actions,
  .modal-card-file-picker .dialog-actions { border-top-color: #1c1c1e !important; }
}

@media (max-width: 390px) {
  .letter-nav-track button,
  .letter-nav button { flex-basis: 43px !important; width: 43px !important; }
  .collection-card,
  .global-grid .collection-card { height: 60px !important; min-height: 60px !important; }
}
