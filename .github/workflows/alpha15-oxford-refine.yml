      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/v5.0.0-alpha.15.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          for token in [
            'alpha.15 Oxford screenshot refinement pass',
            '.search-query-row', '.search-scope-row', '.bridge-settings',
            '.bridge-action-list', '.mirror-explorer-toolbar',
            'background: var(--bg) !important;',
            '.bottom-toolbar > button {\n  color: var(--accent) !important;'
          ]:
              assert token in css, token
          ui = Path('js/v3-ui.js').read_text(encoding='utf-8')
          assert "subtitle: ''," in ui
          assert "className: 'search-query-row'" in ui
          assert "className: 'bridge-settings'" in ui
          assert "title: '搜索'" in ui
          assert '词汇视图' not in ui
          assert '内容视图' not in ui
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'v5.0.0-alpha.15-oxford-refine-20260913-4' in sw
          PY
          git diff --check
      - name: Browser geometry smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chrome; static QA passed.'
            exit 0
          fi
          python3 -m http.server 8765 >/tmp/vix-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          npm install --no-save --no-package-lock puppeteer-core@24 >/tmp/npm.log 2>&1
          CHROME_BIN="$chrome" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({executablePath: process.env.CHROME_BIN, headless: true, args:['--no-sandbox','--disable-gpu']});
            const page = await browser.newPage();
            await page.setViewport({width: 402, height: 874, deviceScaleFactor: 1, isMobile: true, hasTouch: true});
            await page.goto('http://127.0.0.1:8765/', {waitUntil:'networkidle0', timeout:45000});
            await page.waitForSelector('#app:not(.hidden)', {timeout:45000});
            await page.screenshot({path:'/tmp/home-light.png', fullPage:false});
            await page.click('#search-button');
            await page.waitForSelector('.modal-card-search');
            const searchGeom = await page.evaluate(() => {
              const r = (s) => { const e=document.querySelector(s); if(!e) return null; const b=e.getBoundingClientRect(); return {x:b.x,y:b.y,w:b.width,h:b.height}; };
              return {input:r('.search-query-row input'), scope:r('.search-scope-row select'), controls:r('.search-controls')};
            });
            if (!searchGeom.input || searchGeom.input.h > 60 || searchGeom.input.h < 38) throw new Error('search input geometry '+JSON.stringify(searchGeom));
            if (!searchGeom.scope || searchGeom.scope.h > 54 || searchGeom.scope.h < 32) throw new Error('search scope geometry '+JSON.stringify(searchGeom));
            await page.screenshot({path:'/tmp/search-light.png', fullPage:false});
            await page.click('.modal-card-search .modal-close');
            await page.waitForFunction(() => !document.querySelector('.modal-card-search'));
            await page.click('#settings-button');
            await page.waitForSelector('.modal-card-management');
            const bridgeClicked = await page.evaluate(() => {
              const btn=[...document.querySelectorAll('.modal-card-management button')].find(b=>b.textContent.trim()==='Bridge');
              if (!btn) return false; btn.click(); return true;
            });
            if (bridgeClicked) {
              await page.waitForFunction(() => [...document.querySelectorAll('.dialog-header h2')].some(h=>h.textContent.trim()==='Bridge'));
              const heights = await page.$$eval('.bridge-section input', els => els.map(e=>e.getBoundingClientRect().height));
              if (heights.some(h => h > 60 || h < 38)) throw new Error('bridge field geometry '+JSON.stringify(heights));
              await page.screenshot({path:'/tmp/bridge-light.png', fullPage:false});
            }
            await browser.close();
            console.log('BROWSER_GEOMETRY_SMOKE_OK', JSON.stringify(searchGeom));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha15-oxford-refine-smoke
          path: |
            /tmp/home-light.png
            /tmp/search-light.png
            /tmp/bridge-light.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/v3-ui.js css/v5.0.0-alpha.15.css sw.js
          git diff --cached --check
          git commit -m 'style: refine alpha.15 against Oxford iOS references'
          git push origin HEAD:main
