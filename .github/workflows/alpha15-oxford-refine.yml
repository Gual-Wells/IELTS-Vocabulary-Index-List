name: Alpha15 Oxford refine
on:
  push:
    paths:
      - '.github/workflows/alpha15-oxford-refine.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply structural refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('js/v3-ui.js')
          text = ui.read_text(encoding='utf-8')

          old = """  const countText = collection.type === 'normal'\n    ? (contents ? `${contents.toLocaleString()} 内容` : `${words.toLocaleString()} 词`)\n    : (globalSystemView ? (state.projectionUniqueCounts.get(collection.id) || 0) : allEntries.length).toLocaleString();\n  const viewLabel = collection.type === 'normal'\n    ? (currentViewKind === 'content' ? '内容视图' : '词汇视图') : '';\n  const collectionSubtitle = [countText, viewLabel].filter(Boolean).join(' · ');\n  elements['page-subtitle'].textContent = collectionSubtitle;\n  renderLargeTitle({\n    eyebrow: activeMirrorLabel ? 'MIRROR · ' + collection.name : domain?.name || (globalSystemView ? '全局索引' : ''),\n    title: activeMirrorLabel || collection.name,\n    subtitle: collectionSubtitle,\n  });"""
          new = """  elements['page-subtitle'].textContent = '';\n  renderLargeTitle({\n    eyebrow: activeMirrorLabel ? 'MIRROR · ' + collection.name : domain?.name || (globalSystemView ? '全局索引' : ''),\n    title: activeMirrorLabel || collection.name,\n    subtitle: '',\n  });"""
          if old not in text:
              raise SystemExit('collection subtitle block not found')
          text = text.replace(old, new, 1)

          old = """  const searchContent = el('div', { className: 'search-modal-content' }, [el('div', { className: 'search-controls' }, [input, scope, aiButton]), status, results]);\n  activeSearchFrame = openDialog({\n    title: '搜索内容', body: [searchContent], showCancel: false, variant: 'search', kind: 'search',\n  });"""
          new = """  const searchContent = el('div', { className: 'search-modal-content' }, [\n    el('div', { className: 'search-controls' }, [\n      el('div', { className: 'search-query-row' }, [input, aiButton]),\n      el('div', { className: 'search-scope-row' }, [el('span', { className: 'search-scope-label', text: '搜索范围' }), scope]),\n    ]),\n    status, results,\n  ]);\n  activeSearchFrame = openDialog({\n    title: '搜索', body: [searchContent], showCancel: false, variant: 'search', kind: 'search',\n  });"""
          if old not in text:
              raise SystemExit('search content block not found')
          text = text.replace(old, new, 1)

          old = """  openDialog({ title: 'Bridge', variant: 'management', submitText: '保存', body: [\n    field('Bridge URL', url), field('Device Token', token),\n    field('Groq 查询 API Key', queryKey, '用于搜索中的 AI 联想；由 Bridge 保存。'),\n    el('div', { className: 'settings-row' }, [test, removeQueryKey, clear]),\n    el('section', { className: 'bridge-integration-resources' }, [el('h3', { text: '集成资源' }), el('div', { className: 'bridge-download-row' }, [functionLink, instructionLink])]),\n  ], onSubmit: async () => {"""
          new = """  openDialog({ title: 'Bridge', variant: 'management', submitText: '保存', body: [\n    el('div', { className: 'bridge-settings' }, [\n      el('section', { className: 'bridge-section' }, [\n        el('h3', { text: '连接' }),\n        field('Bridge URL', url), field('Device Token', token),\n      ]),\n      el('section', { className: 'bridge-section' }, [\n        el('h3', { text: 'AI 搜索' }),\n        field('Groq 查询 API Key', queryKey, '用于搜索中的 AI 联想；由 Bridge 保存。'),\n      ]),\n      el('section', { className: 'bridge-section bridge-actions-section' }, [\n        el('h3', { text: '操作' }),\n        el('div', { className: 'bridge-action-list' }, [test, removeQueryKey, clear]),\n      ]),\n      el('section', { className: 'bridge-section bridge-integration-resources' }, [\n        el('h3', { text: '集成资源' }),\n        el('div', { className: 'bridge-download-row' }, [functionLink, instructionLink]),\n      ]),\n    ]),\n  ], onSubmit: async () => {"""
          if old not in text:
              raise SystemExit('bridge body block not found')
          ui.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          anchor = '  <link rel="stylesheet" href="./css/v5.0.0-alpha.15.css">\n'
          addition = anchor + '  <link rel="stylesheet" href="./css/v5.0.0-alpha.15-oxford-refine.css">\n'
          if 'v5.0.0-alpha.15-oxford-refine.css' not in html:
              if anchor not in html:
                  raise SystemExit('alpha.15 stylesheet link not found')
              html = html.replace(anchor, addition, 1)
          index.write_text(html, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = 'v5.0.0-alpha.15-oxford-reference-20260913-3'
          new_cache = 'v5.0.0-alpha.15-oxford-refine-20260913-4'
          if old_cache not in sw_text:
              raise SystemExit('service worker cache generation not found')
          sw_text = sw_text.replace(old_cache, new_cache, 1)
          old_precache = "'./css/v5.0.0.css', './css/v5.0.0-alpha.15.css',"
          new_precache = "'./css/v5.0.0.css', './css/v5.0.0-alpha.15.css', './css/v5.0.0-alpha.15-oxford-refine.css',"
          if old_precache not in sw_text:
              raise SystemExit('precache stylesheet list not found')
          sw.write_text(sw_text.replace(old_precache, new_precache, 1), encoding='utf-8')
          PY
      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/v5.0.0-alpha.15-oxford-refine.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          for token in ['.search-query-row', '.search-scope-row', '.bridge-settings', '.bridge-action-list', '.mirror-explorer-toolbar', '.bottom-toolbar > button']:
              assert token in css, token
          ui = Path('js/v3-ui.js').read_text(encoding='utf-8')
          assert "title: '搜索'" in ui
          assert "className: 'search-query-row'" in ui
          assert "className: 'bridge-settings'" in ui
          assert '词汇视图' not in ui
          assert '内容视图' not in ui
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'v5.0.0-alpha.15-oxford-refine.css' in html
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'v5.0.0-alpha.15-oxford-refine-20260913-4' in sw
          assert 'v5.0.0-alpha.15-oxford-refine.css' in sw
          PY
          git diff --check
      - name: Browser geometry smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chrome; static QA passed.'
            exit 0
          fi
          python3 -m http.server 8765 >/tmp/vix-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          npm install --no-save --no-package-lock puppeteer-core@24 >/tmp/npm.log 2>&1
          CHROME_BIN="$chrome" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({executablePath: process.env.CHROME_BIN, headless: true, args:['--no-sandbox','--disable-gpu']});
            const page = await browser.newPage();
            await page.setViewport({width: 402, height: 874, deviceScaleFactor: 1, isMobile: true, hasTouch: true});
            await page.goto('http://127.0.0.1:8765/', {waitUntil:'networkidle0', timeout:45000});
            await page.waitForSelector('#app:not(.hidden)', {timeout:45000});
            await page.screenshot({path:'/tmp/home-light.png'});
            await page.click('#search-button');
            await page.waitForSelector('.modal-card-search');
            const geom = await page.evaluate(() => {
              const box = s => { const e=document.querySelector(s); if(!e) return null; const b=e.getBoundingClientRect(); return {w:b.width,h:b.height,y:b.y}; };
              return {input:box('.search-query-row input'), scope:box('.search-scope-row select')};
            });
            if (!geom.input || geom.input.h < 38 || geom.input.h > 60) throw new Error('bad search input geometry '+JSON.stringify(geom));
            if (!geom.scope || geom.scope.h < 32 || geom.scope.h > 54) throw new Error('bad search scope geometry '+JSON.stringify(geom));
            await page.screenshot({path:'/tmp/search-light.png'});
            await page.click('.modal-card-search .modal-close');
            await page.waitForFunction(() => !document.querySelector('.modal-card-search'));
            await page.click('#settings-button');
            await page.waitForSelector('.modal-card-management');
            const clicked = await page.evaluate(() => {
              const btn=[...document.querySelectorAll('.modal-card-management button')].find(b=>b.textContent.trim()==='Bridge');
              if (!btn) return false;
              btn.click(); return true;
            });
            if (clicked) {
              await page.waitForFunction(() => [...document.querySelectorAll('.dialog-header h2')].some(h=>h.textContent.trim()==='Bridge'));
              const heights = await page.$$eval('.bridge-section input', els => els.map(e=>e.getBoundingClientRect().height));
              if (heights.some(h => h < 38 || h > 60)) throw new Error('bad bridge field geometry '+JSON.stringify(heights));
              await page.screenshot({path:'/tmp/bridge-light.png'});
            }
            await browser.close();
            console.log('BROWSER_GEOMETRY_SMOKE_OK', JSON.stringify(geom));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha15-oxford-refine-smoke
          path: |
            /tmp/home-light.png
            /tmp/search-light.png
            /tmp/bridge-light.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/v3-ui.js index.html sw.js
          git diff --cached --check
          git commit -m 'style: refine alpha.15 against Oxford iOS references'
          git push origin HEAD:main
