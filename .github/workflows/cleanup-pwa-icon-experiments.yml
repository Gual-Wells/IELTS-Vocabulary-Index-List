name: Cleanup PWA icon experiments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-pwa-icon-experiments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove experimental icon assets and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            assets/icons/vix-icon-180-v5.png \
            assets/icons/vix-icon-192-v5.png \
            assets/icons/vix-icon-512-v5.png \
            assets/icons/vix-icon-maskable-192-v5.png \
            assets/icons/vix-icon-maskable-512-v5.png \
            assets/icons/vix-icon-180-v6.png \
            assets/icons/vix-icon-192-v6.png \
            assets/icons/vix-icon-512-v6.png \
            assets/icons/vix-icon-maskable-192-v6.png \
            assets/icons/vix-icon-maskable-512-v6.png
          rm -f .github/workflows/cleanup-pwa-icon-experiments.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(pwa): remove experimental icon assets'
          git push origin HEAD:main
