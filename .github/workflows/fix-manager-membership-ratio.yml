name: Fix manager ownership ratio semantics
on:
  push:
    paths:
      - '.github/workflows/fix-manager-membership-ratio.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct ratio and revert unintended Mirror lifecycle change
        shell: bash
        run: |
          set -euo pipefail
          # The previous Mirror persistence change was made only because the ratio
          # requirement was misunderstood. Restore Mirror runtime to the state
          # immediately before that unintended behavior change.
          git show 887481795b02628c6305e95cb6cd5bd88adc1602:js/v5-mirror-runtime.js > js/v5-mirror-runtime.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/v3-ui.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"function managerEntryRatio\(collectionId\) \{[\s\S]*?\n\}", re.M)
          replacement = '''function managerEntryRatio(collectionId) {
            const state = getState();
            // Occupied = the entries this collection wins after collection-priority
            // competition. This projection is structural and deliberately ignores Mirror.
            const occupied = state.structuralProjection?.get(collectionId)?.length || 0;
            const collection = state.collectionById?.get(collectionId);
            let actual = 0;
            if (collectionId === SYSTEM_GLOBAL_WORDS_ID) {
              actual = state.entries.filter((entry) => entry.kind === 'word').length;
            } else if (collection?.type === 'system-domain-words') {
              actual = state.entries.filter((entry) => entry.domainId === collection.domainId && entry.kind === 'word').length;
            } else if (collection?.type === 'system-domain-content') {
              actual = state.entries.filter((entry) => entry.domainId === collection.domainId && entry.kind === 'content').length;
            } else {
              // Actual/raw = every Entry originally carried by this collection's
              // memberships before ownership competition. Mirror is irrelevant here.
              actual = new Set((state.membershipsByCollection?.get(collectionId) || []).map((item) => item.entryId)).size;
            }
            return `${occupied.toLocaleString()} / ${actual.toLocaleString()}`;
          }'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'managerEntryRatio replacement count={n}')
          p.write_text(s2, encoding='utf-8')

          # Force clients off the build that contained the unintended Mirror-persistence change.
          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t2, n = re.subn(r"ui-compact-20260913-2", "ui-compact-20260913-3", t, count=1)
          if n != 1:
              raise SystemExit(f'SW cache replacement count={n}')
          sw.write_text(t2, encoding='utf-8')
          PY
      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check js/v5-mirror-runtime.js
          node --check sw.js
          grep -q "const occupied = state.structuralProjection" js/v3-ui.js
          grep -q "state.membershipsByCollection" js/v3-ui.js
          if grep -q "enabledPreference" js/v5-mirror-runtime.js; then
            echo 'Unintended Mirror persistence logic still present'; exit 1
          fi
          git diff --check
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-manager-membership-ratio.yml
          git add js/v3-ui.js js/v5-mirror-runtime.js sw.js
          git diff --cached --check
          git commit -m 'fix: report collection ownership against raw membership'
          git push origin HEAD:main
