name: Fix Mirror activation persistence
on:
  push:
    paths:
      - '.github/workflows/fix-mirror-enabled-persistence.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Mirror runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label, count=1):
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{label}: expected {count}, found {found}')
              return text.replace(old, new, count)

          p = Path('js/v5-mirror-runtime.js')
          s = p.read_text(encoding='utf-8')
          s = rep(s,
              "let active = null;\n/** @type {Map<string, {record: any, reviewedAt: string}>} */",
              "let active = null;\nlet enabledPreference = false;\n/** @type {Map<string, {record: any, reviewedAt: string}>} */",
              'enabledPreference declaration')
          s = rep(s,
              "    if (row?.key === CURRENT_KEY) {\n      if (typeof row.mirrorId === 'string') currentId = row.mirrorId;\n      else if (row.value) legacyCurrent = row.value;\n      continue;\n    }",
              "    if (row?.key === CURRENT_KEY) {\n      if (typeof row.mirrorId === 'string') {\n        currentId = row.mirrorId;\n        // Existing installs predate persisted enabled state. Preserve the old\n        // selected-Mirror expectation by treating a missing flag as enabled\n        // once, then writing an explicit boolean on the next state change.\n        enabledPreference = row.enabled === undefined ? true : row.enabled === true;\n      } else if (row.value) {\n        legacyCurrent = row.value;\n        enabledPreference = true;\n      }\n      continue;\n    }",
              'current row restore')
          s = rep(s,
              "      await putRow({ key: CURRENT_KEY, mirrorId: record.mirrorId });",
              "      await putRow({ key: CURRENT_KEY, mirrorId: record.mirrorId, enabled: true });",
              'legacy current migration')
          s = rep(s,
              "  current = library.get(currentId)?.record || null;\n  initialized = true;",
              "  current = library.get(currentId)?.record || null;\n  active = enabledPreference && current ? validateMirrorRecord(clone(current)) : null;\n  if (!current) enabledPreference = false;\n  initialized = true;",
              'restore active snapshot')
          s = rep(s,
              "  await putRow({ key: RECORD_PREFIX + validated.mirrorId, ...clone(envelope) });\n  await putRow({ key: CURRENT_KEY, mirrorId: validated.mirrorId });\n  current = validated;",
              "  await putRow({ key: RECORD_PREFIX + validated.mirrorId, ...clone(envelope) });\n  current = validated;\n  if (enabledPreference) {\n    active = validateMirrorRecord(clone(current));\n    setMirrorSuppression(suppression, universe, active.entryIds);\n  }\n  await putRow({ key: CURRENT_KEY, mirrorId: validated.mirrorId, enabled: enabledPreference });",
              'commit current persistence')
          s = rep(s,
              "  if (active && active.mirrorId !== envelope.record.mirrorId) deactivateMirror();\n  current = envelope.record;\n  await putRow({ key: CURRENT_KEY, mirrorId: current.mirrorId });",
              "  if (active && active.mirrorId !== envelope.record.mirrorId) await deactivateMirror();\n  current = envelope.record;\n  await putRow({ key: CURRENT_KEY, mirrorId: current.mirrorId, enabled: enabledPreference });",
              'select current persistence')
          s = rep(s,
              "  active = validateMirrorRecord(clone(current));\n  setMirrorSuppression(suppression, structuralEntryIds, active.entryIds);\n  emit('active');",
              "  active = validateMirrorRecord(clone(current));\n  enabledPreference = true;\n  setMirrorSuppression(suppression, structuralEntryIds, active.entryIds);\n  await putRow({ key: CURRENT_KEY, mirrorId: current.mirrorId, enabled: true });\n  emit('active');",
              'activate persistence')
          s = rep(s,
              "export function deactivateMirror() {\n  active = null;\n  setMirrorSuppression(suppression, [], null);\n  emit('inactive');\n  return getMirrorSnapshot();\n}",
              "export async function deactivateMirror() {\n  active = null;\n  enabledPreference = false;\n  setMirrorSuppression(suppression, [], null);\n  if (current) await putRow({ key: CURRENT_KEY, mirrorId: current.mirrorId, enabled: false });\n  emit('inactive');\n  return getMirrorSnapshot();\n}",
              'async deactivate')
          s = rep(s,
              "  if (active?.mirrorId === id) deactivateMirror();",
              "  if (active?.mirrorId === id) await deactivateMirror();",
              'delete active mirror')
          s = rep(s,
              "export function effectiveProjectionFromMirror(structuralProjection) {\n  return deriveEffectiveProjection(structuralProjection, suppression);\n}",
              "export function effectiveProjectionFromMirror(structuralProjection) {\n  if (active) {\n    const universe = new Set();\n    for (const entries of structuralProjection.values()) {\n      for (const entry of entries) if (entry?.id) universe.add(entry.id);\n    }\n    setMirrorSuppression(suppression, universe, active.entryIds);\n  }\n  return deriveEffectiveProjection(structuralProjection, suppression);\n}",
              'lazy startup suppression')
          s = rep(s,
              "  await deleteRow(CURRENT_KEY);\n  current = null;",
              "  await deleteRow(CURRENT_KEY);\n  current = null;\n  enabledPreference = false;",
              'clear current preference')
          p.write_text(s, encoding='utf-8')

          p = Path('js/v3-store.js')
          s = p.read_text(encoding='utf-8')
          s = rep(s,
              "  if (enabled) await activateMirror(state.entries.map((entry) => entry.id), mirrorId);\n  else deactivateMirror();",
              "  if (enabled) await activateMirror(state.entries.map((entry) => entry.id), mirrorId);\n  else await deactivateMirror();",
              'store awaits deactivate')
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = rep(s,
              "v5.0.0-alpha.14-ui-compact-20260913-1",
              "v5.0.0-alpha.14-ui-compact-20260913-2",
              'service worker generation')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Runtime and syntax QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v5-mirror-runtime.js
          node --check js/v3-store.js
          node --check sw.js
          grep -q "enabledPreference = row.enabled === undefined ? true : row.enabled === true" js/v5-mirror-runtime.js
          grep -q "await putRow({ key: CURRENT_KEY, mirrorId: current.mirrorId, enabled: true })" js/v5-mirror-runtime.js
          grep -q "export async function deactivateMirror()" js/v5-mirror-runtime.js
          grep -q "else await deactivateMirror();" js/v3-store.js
          node --input-type=module <<'NODE'
          const runtime = await import('./js/v5-mirror-runtime.js');
          const record = {
            protocol: 'vix-mirror/3', mirrorId: 'mirror_test', runId: 'test', createdAt: new Date().toISOString(),
            sourceCorpusHash: 'sha256:' + 'a'.repeat(64), mirrorHash: 'sha256:' + 'b'.repeat(64),
            requestSequence: 1, entryIds: ['a', 'c'], material: {label: 'test'}, existingMatches: [], candidateImports: [], matchMode: 'lexical'
          };
          await runtime.commitMirrorCurrent(record, ['a','b','c']);
          await runtime.activateMirror(['a','b','c']);
          const structural = new Map([['x', [{id:'a'}, {id:'b'}, {id:'c'}]]]);
          const effective = runtime.effectiveProjectionFromMirror(structural);
          if (effective.get('x').length !== 2) throw new Error('Mirror suppression did not filter projection');
          if (!runtime.getMirrorSnapshot().enabled) throw new Error('Mirror did not report enabled');
          await runtime.deactivateMirror();
          if (runtime.effectiveProjectionFromMirror(structural).get('x').length !== 3) throw new Error('Mirror disable did not restore projection');
          console.log('MIRROR_RUNTIME_QA_OK');
          NODE
          git diff --check
      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/vix-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No headless Chrome; static QA passed.'
            exit 0
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/ >/tmp/vix-dom.html 2>/tmp/vix-chrome.log || { cat /tmp/vix-chrome.log; exit 1; }
          if grep -q '应用无法安全启动' /tmp/vix-dom.html || grep -q "Can't find variable" /tmp/vix-dom.html; then
            cat /tmp/vix-chrome.log || true
            exit 1
          fi
          echo 'BROWSER_STARTUP_SMOKE_OK'
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-mirror-enabled-persistence.yml
          git add js/v5-mirror-runtime.js js/v3-store.js sw.js .github/workflows/fix-mirror-enabled-persistence.yml
          git diff --cached --check
          git commit -m 'fix: persist Mirror activation across launches'
          git push origin HEAD:main
