name: One-shot Collins dictionary selector

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-collins-dictionary-ui.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Bridge settings UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/v3-ui.js')
          s = path.read_text()

          old_import = "import { deleteCollinsSecret, saveCollinsSecret, validateCollinsSecret } from './v5-collins-bridge.js';"
          new_import = """import {
            COLLINS_DICTIONARY_OPTIONS, deleteCollinsSecret, getCollinsDictionaryPreference,
            saveCollinsSecret, setCollinsDictionaryPreference, validateCollinsSecret,
          } from './v5-collins-bridge.js';"""
          if old_import not in s:
              raise SystemExit('Collins import anchor not found')
          s = s.replace(old_import, new_import, 1)

          test_anchor = "  const test = button('测试', 'secondary-button', async () => {"
          if test_anchor not in s:
              raise SystemExit('Test button anchor not found')
          selector = """  const collinsDictionary = el('select', {
            name: 'vix-collins-dictionary', autocomplete: 'off',
          });
          for (const option of COLLINS_DICTIONARY_OPTIONS) {
            collinsDictionary.append(el('option', { value: option.code, text: option.label }));
          }
          collinsDictionary.value = getCollinsDictionaryPreference();
"""
          s = s.replace(test_anchor, selector + test_anchor, 1)

          candidate_line = "      const candidateCollinsKey = collinsKey.value.trim();"
          if candidate_line not in s:
              raise SystemExit('Collins test candidate anchor not found')
          s = s.replace(candidate_line, candidate_line + "\n      const selectedCollinsDictionary = collinsDictionary.value;", 1)

          test_call = "if (candidateCollinsKey) await validateCollinsSecret(candidateCollinsKey, { config });"
          if test_call not in s:
              raise SystemExit('Collins test call anchor not found')
          s = s.replace(test_call, "if (candidateCollinsKey) await validateCollinsSecret(candidateCollinsKey, { config, dictionaryCode: selectedCollinsDictionary });", 1)

          field_line = "      field('Collins API Key', collinsKey),"
          if field_line not in s:
              raise SystemExit('Collins field anchor not found')
          s = s.replace(field_line, field_line + "\n      field('Collins 目标词典', collinsDictionary, '仅列出当前 Collins API 申请中的两部 American English 词典。'),", 1)

          save_block = "      if (collinsKey.value.trim()) {"
          if save_block not in s:
              raise SystemExit('Collins save block anchor not found')
          s = s.replace(save_block, "      const selectedCollinsDictionary = collinsDictionary.value;\n" + save_block, 1)

          save_call = "await saveCollinsSecret(collinsKey.value, { config: nextConfig });"
          if save_call not in s:
              raise SystemExit('Collins save call anchor not found')
          s = s.replace(save_call, "await saveCollinsSecret(collinsKey.value, { config: nextConfig, dictionaryCode: selectedCollinsDictionary });", 1)

          save_pos = s.index("dictionaryCode: selectedCollinsDictionary", s.index("const selectedCollinsDictionary = collinsDictionary.value;", s.index("onSubmit:")))
          config_anchor = "      setBridgeConfig(nextConfig);"
          config_pos = s.find(config_anchor, save_pos)
          if config_pos < 0:
              raise SystemExit('Bridge config save anchor not found')
          s = s[:config_pos] + "      setCollinsDictionaryPreference(selectedCollinsDictionary);\n" + s[config_pos:]

          path.write_text(s)
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check js/v3-ui.js
          node --check js/v5-collins-bridge.js
          node --check js/v5-query-providers.js
      - name: Commit and retire one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-collins-dictionary-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose Collins dictionary selector"
          git push origin HEAD:main
