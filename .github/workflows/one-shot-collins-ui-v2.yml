name: One-shot Collins selector v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-collins-ui-v2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selector patch
        run: python3 .github/tmp/patch-collins-dictionary-ui.py
      - name: Check JavaScript
        run: |
          node --check js/v3-ui.js
          node --check js/v5-collins-bridge.js
          node --check js/v5-query-providers.js
          node --check sw.js
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-collins-ui-v2.yml
          rm -f .github/workflows/one-shot-collins-dictionary-ui.yml
          rm -f .github/tmp/patch-collins-dictionary-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose Collins dictionary selector"
          git push origin HEAD:main
