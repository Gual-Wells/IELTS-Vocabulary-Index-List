name: PWA name and frameless icon fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-name-icon-fix.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild install metadata and icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          from collections import deque
          import colorsys, json, re

          root = Path('.')
          src_path = root / 'assets/icons/vix-icon-512-v4.png'
          src = Image.open(src_path).convert('RGBA')
          if src.size != (512, 512):
              raise SystemExit(f'unexpected source icon size: {src.size}')

          # Keep the original green V artwork, but remove the baked-in frame/tile.
          # iOS/PWA launchers must receive a full-bleed square and apply their own mask.
          rgb = src.convert('RGB')
          w, h = rgb.size
          px = rgb.load()

          light = []
          seed = [[False] * w for _ in range(h)]
          for y in range(h):
              for x in range(w):
                  r, g, b = px[x, y]
                  rf, gf, bf = r/255, g/255, b/255
                  hh, ss, vv = colorsys.rgb_to_hsv(rf, gf, bf)
                  if ss < 0.12 and vv > 0.72:
                      light.append((r, g, b))
                  # Robust dark/medium green foreground seed.
                  if 0.20 <= hh <= 0.48 and ss >= 0.16 and g >= r * 0.92 and g >= b * 1.05:
                      seed[y][x] = True

          if not light:
              bg = (248, 248, 245)
          else:
              light.sort(key=lambda c: c[0] + c[1] + c[2])
              mid = light[len(light)//2]
              # Neutralize tiny JPEG/PNG color casts while keeping the original warm white character.
              avg = round(sum(mid) / 3)
              bg = tuple(max(238, min(252, round((c + avg) / 2))) for c in mid)

          # Connected components: preserve the main V, discard thin decorative/frame components.
          seen = [[False] * w for _ in range(h)]
          comps = []
          for y in range(h):
              for x in range(w):
                  if not seed[y][x] or seen[y][x]:
                      continue
                  q = deque([(x, y)])
                  seen[y][x] = True
                  comp = []
                  while q:
                      cx, cy = q.popleft(); comp.append((cx, cy))
                      for ny in range(max(0, cy-1), min(h, cy+2)):
                          for nx in range(max(0, cx-1), min(w, cx+2)):
                              if not seen[ny][nx] and seed[ny][nx]:
                                  seen[ny][nx] = True; q.append((nx, ny))
                  comps.append(comp)
          if not comps:
              raise SystemExit('could not find green V foreground')
          comps.sort(key=len, reverse=True)
          main = comps[0]
          if len(main) < 2500:
              raise SystemExit(f'foreground component too small: {len(main)}')

          xs = [p[0] for p in main]; ys = [p[1] for p in main]
          bbox = (min(xs), min(ys), max(xs)+1, max(ys)+1)
          if not (70 <= bbox[0] < bbox[2] <= 442 and 55 <= bbox[1] < bbox[3] <= 465):
              raise SystemExit(f'unexpected V bbox: {bbox}')

          # Grow mask a few pixels to retain antialiasing, then use green saturation as soft alpha.
          base_mask = Image.new('L', (w, h), 0)
          mp = base_mask.load()
          for x, y in main:
              mp[x, y] = 255
          grown = base_mask.filter(ImageFilter.MaxFilter(7)).filter(ImageFilter.GaussianBlur(1.0))
          gp = grown.load()

          clean = Image.new('RGB', (w, h), bg)
          out = clean.load()
          for y in range(h):
              for x in range(w):
                  if gp[x, y] == 0:
                      continue
                  r, g, b = px[x, y]
                  hh, ss, vv = colorsys.rgb_to_hsv(r/255, g/255, b/255)
                  green_hue = 1.0 if 0.20 <= hh <= 0.48 else 0.0
                  # Soft edge retains original antialiasing but rejects low-saturation gray frame pixels.
                  alpha = (gp[x, y] / 255) * max(0.0, min(1.0, (ss - 0.025) / 0.13)) * green_hue
                  if alpha <= 0:
                      continue
                  br, bgc, bb = bg
                  out[x, y] = (
                      round(br*(1-alpha) + r*alpha),
                      round(bgc*(1-alpha) + g*alpha),
                      round(bb*(1-alpha) + b*alpha),
                  )

          def contain_logo(im, scale=1.0):
              if scale == 1.0:
                  return im
              nw = round(im.width * scale); nh = round(im.height * scale)
              scaled = im.resize((nw, nh), Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', im.size, bg)
              canvas.paste(scaled, ((im.width-nw)//2, (im.height-nh)//2))
              return canvas

          icons = root / 'assets/icons'
          clean.resize((512,512), Image.Resampling.LANCZOS).save(icons/'vix-icon-512-v5.png', optimize=True)
          clean.resize((192,192), Image.Resampling.LANCZOS).save(icons/'vix-icon-192-v5.png', optimize=True)
          clean.resize((180,180), Image.Resampling.LANCZOS).save(icons/'vix-icon-180-v5.png', optimize=True)
          maskable = contain_logo(clean, 0.82)
          maskable.resize((512,512), Image.Resampling.LANCZOS).save(icons/'vix-icon-maskable-512-v5.png', optimize=True)
          maskable.resize((192,192), Image.Resampling.LANCZOS).save(icons/'vix-icon-maskable-192-v5.png', optimize=True)

          manifest_path = root/'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'VIX'
          manifest['short_name'] = 'VIX'
          manifest['icons'] = [
              {'src':'./assets/icons/vix-icon-192-v5.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./assets/icons/vix-icon-512-v5.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'./assets/icons/vix-icon-maskable-192-v5.png','sizes':'192x192','type':'image/png','purpose':'maskable'},
              {'src':'./assets/icons/vix-icon-maskable-512-v5.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = root/'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'<meta name="apple-mobile-web-app-title" content="[^"]*">', '<meta name="apple-mobile-web-app-title" content="VIX">', index)
          index = re.sub(r'<title>[^<]*</title>', '<title>VIX</title>', index, count=1)
          index = index.replace('./assets/icons/vix-icon-180-v4.png', './assets/icons/vix-icon-180-v5.png')
          index = index.replace('./assets/icons/vix-icon-192-v4.png', './assets/icons/vix-icon-192-v5.png')
          index_path.write_text(index, encoding='utf-8')

          sw_path = root/'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = `\$\{CACHE_PREFIX\}[^`]+`;", "const CACHE_NAME = `${CACHE_PREFIX}v5.0.0-alpha.14-seed10-pwa-icon-v5-20260912-1`;", sw)
          sw = sw.replace('./assets/icons/vix-icon-180-v4.png', './assets/icons/vix-icon-180-v5.png')
          sw = sw.replace('./assets/icons/vix-icon-192-v4.png', './assets/icons/vix-icon-192-v5.png')
          sw = sw.replace('./assets/icons/vix-icon-512-v4.png', './assets/icons/vix-icon-512-v5.png')
          sw_path.write_text(sw, encoding='utf-8')

          print('PWA_ICON_FIX_OK', {'source': str(src_path), 'v_bbox': bbox, 'component_pixels': len(main), 'background': bg})
          PY
      - name: Validate PWA metadata and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          m=json.loads(Path('manifest.webmanifest').read_text())
          assert m['name']=='VIX' and m['short_name']=='VIX'
          expected={
            'assets/icons/vix-icon-180-v5.png':(180,180),
            'assets/icons/vix-icon-192-v5.png':(192,192),
            'assets/icons/vix-icon-512-v5.png':(512,512),
            'assets/icons/vix-icon-maskable-192-v5.png':(192,192),
            'assets/icons/vix-icon-maskable-512-v5.png':(512,512),
          }
          for p,s in expected.items():
              im=Image.open(p)
              assert im.size==s, (p,im.size)
              # Full-bleed RGB/RGBA assets: no transparent pre-rounded outer tile.
              if im.mode=='RGBA':
                  assert min(im.getchannel('A').getextrema())==255
          html=Path('index.html').read_text()
          assert 'apple-mobile-web-app-title" content="VIX"' in html
          assert '<title>VIX</title>' in html
          assert 'vix-icon-180-v5.png' in html and 'vix-icon-192-v5.png' in html
          print('PWA_METADATA_QA_OK')
          PY
          git diff --check
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pwa-name-icon-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.webmanifest index.html sw.js assets/icons/vix-icon-*-v5.png .github/workflows/pwa-name-icon-fix.yml
          git commit -m 'fix(pwa): name VIX and remove baked-in icon frame'
          git push origin HEAD:main
