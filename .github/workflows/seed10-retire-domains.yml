name: Seed10 retire obsolete domains

on:
  push:
    branches: [main]
    paths:
      - 'tools/remove_retired_domains.mjs'
      - '.github/workflows/seed10-retire-domains.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove computer and collocations domains
        run: node tools/remove_retired_domains.mjs
      - name: Validate Seed10 hard removal
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-db.js
          node --check js/v5-seed-migration.js
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const runtime='data/seed5-runtime';
          const manifest=JSON.parse(fs.readFileSync(path.join(runtime,'manifest.json'),'utf8'));
          const meta=JSON.parse(fs.readFileSync(path.join(runtime,'meta.json'),'utf8'));
          const retired=new Set(['domain_computer_terms','domain_general_collocations']);
          if(manifest.seedRevision!==10) throw new Error(`seed revision ${manifest.seedRevision}`);
          if(meta.settings?.builtInSeedRevision!==10) throw new Error('meta revision is not 10');
          if(meta.domains.some(d=>retired.has(d.id))) throw new Error('retired domain remains in meta');
          if(meta.collections.some(c=>retired.has(c.domainId))) throw new Error('retired collection remains');
          const load=(prefix)=>fs.readdirSync(runtime).filter(n=>new RegExp(`^${prefix}-\\d+\\.json$`).test(n)).sort().flatMap(n=>JSON.parse(fs.readFileSync(path.join(runtime,n),'utf8')));
          const entries=load('entries');
          const memberships=load('memberships');
          const relations=load('relations');
          if(entries.some(e=>retired.has(e.domainId))) throw new Error('retired entry remains');
          const entryIds=new Set(entries.map(e=>e.id));
          const collectionIds=new Set(meta.collections.map(c=>c.id));
          if(memberships.some(m=>!entryIds.has(m.entryId)||!collectionIds.has(m.collectionId))) throw new Error('dangling membership');
          if(relations.some(r=>r.sourceEntryId && !entryIds.has(r.sourceEntryId))) throw new Error('dangling relation');
          if(manifest.counts.entries!==entries.length||manifest.counts.memberships!==memberships.length||manifest.counts.relationComponents!==relations.length) throw new Error('manifest counts mismatch');
          const check=(d)=>{const text=fs.readFileSync(d.path,'utf8'); const hash=crypto.createHash('sha256').update(text).digest('hex'); if(hash!==d.sha256||Buffer.byteLength(text)!==d.bytes) throw new Error(`descriptor mismatch ${d.path}`);};
          check(manifest.meta); [...manifest.entries,...manifest.memberships,...manifest.relationComponents].forEach(check);
          const db=fs.readFileSync('js/v3-db.js','utf8');
          if(!db.includes('BUILTIN_SEED_REVISION = 10')) throw new Error('db revision not 10');
          const migration=fs.readFileSync('js/v5-seed-migration.js','utf8');
          for(const id of retired) if(!migration.includes(id)) throw new Error(`migration missing hard-retire ${id}`);
          console.log('SEED10_RETIRE_QA_OK', JSON.stringify({domains:meta.domains.map(d=>d.id),entries:entries.length,memberships:memberships.length,relations:relations.length}));
          NODE
          git diff --check
      - name: Remove one-shot migration launcher
        run: |
          rm -f .github/workflows/seed10-retire-domains.yml tools/remove_retired_domains.mjs
      - name: Commit Seed10 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(seed): remove computer and collocations domains'
          git push origin HEAD:main
