name: Seed11 runtime phrase cleanup
on:
  push:
    paths:
      - '.github/workflows/seed11-runtime-phrase-cleanup.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove retired phrase runtime paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_all(s, old, new, label, minimum=1):
              n=s.count(old)
              if n < minimum:
                  raise SystemExit(f'{label}: expected at least {minimum}, found {n}')
              return s.replace(old,new)

          # UI is now strictly word/content. Remove every live phrase-system path.
          p=Path('js/v3-ui.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('addEntry, addPhraseForWord,','addEntry,')
          s=s.replace("    if (['word', 'phrase'].includes(requested)) return requested;", "    if (requested === 'word') return 'word';")
          s=s.replace("    if (entry?.kind === 'phrase') return 'phrase';\n", '')
          s=s.replace("  return isPhraseCollection(collection) ? 'phrase' : 'word';", "  return 'word';")
          s=s.replace("  if (entry.kind === 'phrase') return systemPhraseCollectionId(entry.domainId);\n", '')
          s=s.replace("  const kind = ['word', 'phrase'].includes(viewKind) ? viewKind : (['word', 'phrase'].includes(currentViewKind) ? currentViewKind : 'word');\n  return entries.filter((entry) => entry.kind === kind);", "  return entries.filter((entry) => entry.kind === 'word');")
          s=re.sub(r"^\s*if \(collectionId === SYSTEM_GLOBAL_PHRASES_ID\).*\n",'',s,flags=re.M)
          s=s.replace("`${words.toLocaleString()} 词 · ${phrases.toLocaleString()} 短语`", "`${words.toLocaleString()} 词`")
          s=re.sub(r"^\s*\|\| collection\.id === systemPhraseCollectionId\(collection\.domainId\)\n",'',s,flags=re.M)
          s=s.replace("|| collection.type === 'system-phrases' || collection.type === 'system-domain-content'", "|| collection.type === 'system-domain-content'")
          s=re.sub(r"^\s*const phraseCollection = state\.collectionById\.get\(systemPhraseCollectionId\(domain\.id\)\);\n",'',s,flags=re.M)
          s=re.sub(r"\s*el\('div', \{ className: 'manager-row fixed' \}, \[\n\s*el\('span', \{ className: 'manager-lock', text: '2' \}\),\n\s*el\('span', \{ className: 'manager-name', text: phraseCollection\?\.name \|\| '短语' \}\),\n\s*el\('span', \{ className: 'manager-count', text: phraseCollection \? getVisibleEntries\(phraseCollection\.id\)\.length\.toLocaleString\(\) : '0' \}\),\n\s*\]\),",'',s)
          pair="[collectionCard(state.collectionById.get(SYSTEM_GLOBAL_WORDS_ID)), collectionCard(state.collectionById.get(SYSTEM_GLOBAL_PHRASES_ID))]"
          s=replace_all(s,pair,"[collectionCard(state.collectionById.get(SYSTEM_GLOBAL_WORDS_ID))]",'global phrase cards',2)
          s=s.replace("? (currentViewKind === 'phrase' ? '短语视图' : currentViewKind === 'content' ? '内容视图' : '词汇视图')", "? (currentViewKind === 'content' ? '内容视图' : '词汇视图')")
          s=s.replace("  return entry?.kind === 'phrase' ? 'phrase' : entry?.kind === 'content' ? 'content' : 'word';", "  return entry?.kind === 'content' ? 'content' : 'word';")
          s=re.sub(r"\nfunction isPhraseCollection\(collection\) \{\n\s*return collection\?\.type === 'system-phrases' \|\| collection\?\.type === 'system-global-phrases';\n\}\n",'\n',s)
          s=s.replace("instruction: `${collection.type === 'system-phrases' ? 'Generate multi-word English phrases only. ' : ''}${instruction.value}`", "instruction: instruction.value")
          for forbidden in ['SYSTEM_GLOBAL_PHRASES_ID','systemPhraseCollectionId',"system-global-phrases", "collection.type === 'system-phrases'"]:
              if forbidden in s: raise SystemExit(f'v3-ui stale phrase runtime path: {forbidden}')
          p.write_text(s,encoding='utf-8')

          # Entry-context integration must agree with the two live global system projections.
          p=Path('js/v3-integrations.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('SYSTEM_GLOBAL_CONTENT_ID, SYSTEM_GLOBAL_PHRASES_ID, SYSTEM_GLOBAL_WORDS_ID','SYSTEM_GLOBAL_CONTENT_ID, SYSTEM_GLOBAL_WORDS_ID')
          s=s.replace('[SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_PHRASES_ID, SYSTEM_GLOBAL_CONTENT_ID]','[SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_CONTENT_ID]')
          if 'SYSTEM_GLOBAL_PHRASES_ID' in s: raise SystemExit('integration still references global phrase table')
          p.write_text(s,encoding='utf-8')

          # Exchange may recognize old package vocabulary, but current Seed11 must never recreate phrase tables.
          p=Path('js/v3-exchange.js'); s=p.read_text(encoding='utf-8')
          marker="  const pkg = normalizeVixPackage(rawPackage);\n"
          guard=(marker + "  if (pkg.data.collections.some((item) => item.kind === 'phrases') || pkg.data.entries.some((item) => item.kind === 'phrase')) {\n"
                       "    throw new Error('当前版本已移除短语条目与系统短语表，不能导入旧短语内容');\n"
                       "  }\n")
          if guard not in s:
              if marker not in s: raise SystemExit('exchange import marker missing')
              s=s.replace(marker,guard,1)
          s=re.sub(r"\n  // Structured domains have exactly one phrase total; non-structured domains never persist one\.\n  for \(const domainId of new Set\(domainMap\.values\(\)\)\) \{.*?\n  \}\n\n",'\n',s,count=1,flags=re.S)
          if "collections.push(createCollection({ id: phraseId, domainId, name: '短语总表'" in s:
              raise SystemExit('exchange still synthesizes system phrase table')
          p.write_text(s,encoding='utf-8')

          # Force standalone Safari/PWA to abandon the broken cached module graph.
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if 'seed11-word-only-20260912-2' not in s: raise SystemExit('unexpected service-worker generation')
          p.write_text(s.replace('seed11-word-only-20260912-2','seed11-word-only-20260912-3',1),encoding='utf-8')
          PY
      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check js/v3-store.js
          node --check js/v3-model.js
          node --check js/v3-exchange.js
          node --check js/v3-integrations.js
          node --check js/v3-db.js
          node --check js/v5-seed-migration.js
          node --check sw.js
          ! grep -n 'SYSTEM_GLOBAL_PHRASES_ID\|systemPhraseCollectionId\|system-global-phrases' js/v3-ui.js
          ! grep -n 'SYSTEM_GLOBAL_PHRASES_ID' js/v3-integrations.js
          ! grep -n "collections.push(createCollection({ id: phraseId, domainId, name: '短语总表'" js/v3-exchange.js
          grep -n "HARD_RETIRED_COLLECTION_TYPES.*system-phrases" js/v5-seed-migration.js
          grep -n 'Seed11 no longer requires or creates a phrase system table' js/v3-model.js
          git diff --check
      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/vix-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No headless Chrome available; static runtime QA passed.'
            exit 0
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/ >/tmp/vix-dom.html 2>/tmp/vix-chrome.log || { cat /tmp/vix-chrome.log; exit 1; }
          ! grep -q '应用无法安全启动' /tmp/vix-dom.html
          ! grep -q "Can't find variable" /tmp/vix-dom.html
          echo BROWSER_STARTUP_SMOKE_OK
      - name: Commit runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/v3-ui.js js/v3-integrations.js js/v3-exchange.js sw.js
          git commit -m 'fix: finish Seed11 phrase-system runtime retirement'
          git push origin HEAD:main
