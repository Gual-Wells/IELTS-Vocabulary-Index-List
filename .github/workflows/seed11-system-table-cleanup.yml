name: Seed11 system table cleanup
on:
  push:
    paths:
      - '.github/workflows/seed11-system-table-cleanup.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch word-only system-table invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label, count=None):
              found=text.count(old)
              if found == 0:
                  raise SystemExit(f'missing patch target: {label}')
              if count is not None and found != count:
                  raise SystemExit(f'unexpected target count for {label}: {found}')
              return text.replace(old,new)

          p=Path('js/v3-model.js')
          s=p.read_text(encoding='utf-8')
          old="""  for (const domain of domains) {
            const phraseCollections = collections.filter((item) => item.domainId === domain.id && item.type === 'system-phrases');
            if (domain.contentMode === 'structured') {
              if (phraseCollections.length !== 1) throw new Error(`结构化词域 ${domain.name} 必须恰有一个系统短语表`);
              if (phraseCollections[0].id !== systemPhraseCollectionId(domain.id)) throw new Error('系统短语表 ID 无效');
            } else if (phraseCollections.length) throw new Error(`非结构词域 ${domain.name} 不应持久化系统短语表`);
          }
          """
          new="""  for (const domain of domains) {
            const phraseCollections = collections.filter((item) => item.domainId === domain.id && item.type === 'system-phrases');
            // Seed11 retired phrase tables. One legacy table is accepted only so
            // pre-Seed11 snapshots can be canonicalized and migrated safely.
            if (domain.contentMode === 'structured') {
              if (phraseCollections.length > 1) throw new Error(`结构化词域 ${domain.name} 最多只能保留一个旧系统短语表`);
              if (phraseCollections[0] && phraseCollections[0].id !== systemPhraseCollectionId(domain.id)) throw new Error('旧系统短语表 ID 无效');
            } else if (phraseCollections.length) throw new Error(`非结构词域 ${domain.name} 不应持久化系统短语表`);
          }
          """
          s=replace_required(s,old,new,'phrase-table validation',1)
          old="""  const projection = new Map(collections.map((item) => [item.id, []]));
            projection.set(SYSTEM_GLOBAL_WORDS_ID, []);
            projection.set(SYSTEM_GLOBAL_PHRASES_ID, []);
            projection.set(SYSTEM_GLOBAL_CONTENT_ID, []);
          """
          new="""  const projection = new Map(collections.map((item) => [item.id, []]));
            const hasLegacyPhrases = entries.some((item) => item.kind === 'phrase')
              || collections.some((item) => item.type === 'system-phrases');
            projection.set(SYSTEM_GLOBAL_WORDS_ID, []);
            if (hasLegacyPhrases) projection.set(SYSTEM_GLOBAL_PHRASES_ID, []);
            projection.set(SYSTEM_GLOBAL_CONTENT_ID, []);
          """
          s=replace_required(s,old,new,'projection legacy phrase gate',1)
          old="""  projection.set(SYSTEM_GLOBAL_WORDS_ID, globalWords.sort(globalSorter));
            projection.set(SYSTEM_GLOBAL_PHRASES_ID, globalPhrases.sort(globalSorter));
            projection.set(SYSTEM_GLOBAL_CONTENT_ID, globalContent.sort(globalSorter));
          """
          new="""  projection.set(SYSTEM_GLOBAL_WORDS_ID, globalWords.sort(globalSorter));
            if (hasLegacyPhrases) projection.set(SYSTEM_GLOBAL_PHRASES_ID, globalPhrases.sort(globalSorter));
            projection.set(SYSTEM_GLOBAL_CONTENT_ID, globalContent.sort(globalSorter));
          """
          s=replace_required(s,old,new,'projection legacy phrase output',1)
          old="pin.contextCollectionId === SYSTEM_GLOBAL_WORDS_ID || pin.contextCollectionId === SYSTEM_GLOBAL_PHRASES_ID || pin.contextCollectionId === SYSTEM_GLOBAL_CONTENT_ID"
          new="pin.contextCollectionId === SYSTEM_GLOBAL_WORDS_ID || (entry?.kind === 'phrase' && pin.contextCollectionId === SYSTEM_GLOBAL_PHRASES_ID) || pin.contextCollectionId === SYSTEM_GLOBAL_CONTENT_ID"
          s=replace_required(s,old,new,'legacy phrase pin scope',1)
          p.write_text(s,encoding='utf-8')

          p=Path('js/v3-store.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('systemPhraseCollectionId, ','').replace('SYSTEM_GLOBAL_PHRASES_ID, ','')
          old="""    draft.domains.push(domain);
            if (domain.contentMode === 'structured') draft.collections.push(createCollection({
              domainId: domain.id, name: '短语总表', type: 'system-phrases', order: Number.MAX_SAFE_INTEGER,
            }));
          """
          new="""    draft.domains.push(domain);
          """
          s=replace_required(s,old,new,'new-domain phrase table creation',1)
          s=s.replace("    if (collection.type === 'system-phrases') throw new Error('系统短语表不可重命名');\n",'')
          s=s.replace("    if (collection.type === 'system-phrases') throw new Error('系统短语表不可删除');\n",'')
          old="""  if (collection.type === 'system-phrases' && !isPhraseText(text)) throw new Error(`系统短语表不能导入普通词：${text}`);
            const desiredKind = domain?.contentMode === 'nonStructured' ? 'content' : (isPhraseText(text) ? 'phrase' : 'word');
          """
          new="""  if (domain?.contentMode !== 'nonStructured' && isPhraseText(text)) throw new Error(`当前版本仅接受单词条目：${text}`);
            const desiredKind = domain?.contentMode === 'nonStructured' ? 'content' : 'word';
          """
          s=replace_required(s,old,new,'import word-only classification',1)
          old="""      const desiredKind = domain?.contentMode === 'nonStructured' ? 'content' : (isPhraseText(text) ? 'phrase' : 'word');
              entry = createEntry({
          """
          new="""      if (domain?.contentMode !== 'nonStructured' && isPhraseText(text)) throw new Error(`当前版本仅接受单词条目：${text}`);
              const desiredKind = domain?.contentMode === 'nonStructured' ? 'content' : 'word';
              entry = createEntry({
          """
          s=replace_required(s,old,new,'manual add word-only classification',1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=replace_required(s,'seed11-word-only-20260912-1','seed11-word-only-20260912-2','service-worker cache generation',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate Seed11 and runtime system tables
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-model.js
          node --check js/v3-store.js
          node --check js/v3-db.js
          node --check js/v5-seed-migration.js
          node --check sw.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { canonicalizeBackup, buildProjection, SYSTEM_GLOBAL_PHRASES_ID } from './js/v3-model.js';
          const root='data/seed5-runtime/';
          const manifest=JSON.parse(fs.readFileSync(root+'manifest.json','utf8'));
          const seed=JSON.parse(fs.readFileSync(manifest.meta.path,'utf8'));
          for (const key of ['entries','memberships','relationComponents']) {
            seed[key]=[];
            for (const d of manifest[key]) seed[key].push(...JSON.parse(fs.readFileSync(d.path,'utf8')));
          }
          const canonical=canonicalizeBackup(seed);
          if (canonical.collections.some(x=>x.type==='system-phrases'||String(x.id||'').endsWith('__phrases'))) throw new Error('Seed11 still persists phrase system table');
          if (canonical.entries.some(x=>x.kind==='phrase')) throw new Error('Seed11 still contains phrase entries');
          const projection=buildProjection(canonical);
          if (projection.has(SYSTEM_GLOBAL_PHRASES_ID)) throw new Error('word-only runtime still creates global phrase virtual table');
          if (manifest.counts.entries!==15644 || manifest.counts.relationComponents!==0) throw new Error('unexpected Seed11 counts');
          console.log('SEED11_SYSTEM_TABLE_QA_OK');
          JS
          python - <<'PY'
          from pathlib import Path
          s=Path('js/v3-store.js').read_text(encoding='utf-8')
          forbidden=[
            "name: '短语总表', type: 'system-phrases'",
            "isPhraseText(text) ? 'phrase' : 'word'",
            '系统短语表不能导入普通词',
          ]
          for item in forbidden:
            assert item not in s, item
          print('STORE_WORD_ONLY_QA_OK')
          PY
          git diff --check
      - name: Commit repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/seed11-system-table-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align Seed11 system-table invariants with word-only runtime'
          git push origin HEAD:main
