name: Seed11 system table cleanup
on:
  push:
    paths:
      - '.github/workflows/seed11-system-table-cleanup.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch word-only system-table invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def sub1(s, pattern, repl, label, flags=0):
              out,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n != 1: raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          p=Path('js/v3-model.js'); s=p.read_text(encoding='utf-8')
          pattern=r"  for \(const domain of domains\) \{\n    const phraseCollections = collections\.filter\(\(item\) => item\.domainId === domain\.id && item\.type === 'system-phrases'\);\n    if \(domain\.contentMode === 'structured'\) \{\n      if \(phraseCollections\.length !== 1\) throw new Error\(`结构化词域 \$\{domain\.name\} 必须恰有一个系统短语表`\);\n      if \(phraseCollections\[0\]\.id !== systemPhraseCollectionId\(domain\.id\)\) throw new Error\('系统短语表 ID 无效'\);\n    \} else if \(phraseCollections\.length\) throw new Error\(`非结构词域 \$\{domain\.name\} 不应持久化系统短语表`\);\n  \}"
          repl="""  for (const domain of domains) {
            const phraseCollections = collections.filter((item) => item.domainId === domain.id && item.type === 'system-phrases');
            // Seed11 no longer requires or creates a phrase system table. A single
            // legacy table is tolerated only while pre-Seed11 snapshots migrate.
            if (domain.contentMode === 'structured') {
              if (phraseCollections.length > 1) throw new Error(`结构化词域 ${domain.name} 最多只能保留一个旧系统短语表`);
              if (phraseCollections[0] && phraseCollections[0].id !== systemPhraseCollectionId(domain.id)) throw new Error('旧系统短语表 ID 无效');
            } else if (phraseCollections.length) throw new Error(`非结构词域 ${domain.name} 不应持久化系统短语表`);
          }"""
          s=sub1(s,pattern,repl,'phrase-table validator')
          anchor="  const projection = new Map(collections.map((item) => [item.id, []]));\n"
          if anchor not in s: raise SystemExit('projection anchor missing')
          s=s.replace(anchor,anchor+"  const hasLegacyPhrases = entries.some((item) => item.kind === 'phrase') || collections.some((item) => item.type === 'system-phrases');\n",1)
          if s.count('  projection.set(SYSTEM_GLOBAL_PHRASES_ID, []);') != 1: raise SystemExit('global phrase projection initializer mismatch')
          s=s.replace('  projection.set(SYSTEM_GLOBAL_PHRASES_ID, []);',"  if (hasLegacyPhrases) projection.set(SYSTEM_GLOBAL_PHRASES_ID, []);",1)
          if s.count('  projection.set(SYSTEM_GLOBAL_PHRASES_ID, globalPhrases.sort(globalSorter));') != 1: raise SystemExit('global phrase projection output mismatch')
          s=s.replace('  projection.set(SYSTEM_GLOBAL_PHRASES_ID, globalPhrases.sort(globalSorter));',"  if (hasLegacyPhrases) projection.set(SYSTEM_GLOBAL_PHRASES_ID, globalPhrases.sort(globalSorter));",1)
          old='pin.contextCollectionId === SYSTEM_GLOBAL_WORDS_ID || pin.contextCollectionId === SYSTEM_GLOBAL_PHRASES_ID || pin.contextCollectionId === SYSTEM_GLOBAL_CONTENT_ID'
          if s.count(old) != 1: raise SystemExit('pin virtual scope target mismatch')
          s=s.replace(old,"pin.contextCollectionId === SYSTEM_GLOBAL_WORDS_ID || (entry?.kind === 'phrase' && pin.contextCollectionId === SYSTEM_GLOBAL_PHRASES_ID) || pin.contextCollectionId === SYSTEM_GLOBAL_CONTENT_ID",1)
          p.write_text(s,encoding='utf-8')

          p=Path('js/v3-store.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('systemPhraseCollectionId, ','').replace('SYSTEM_GLOBAL_PHRASES_ID, ','')
          s,n=re.subn(r"\n    if \(domain\.contentMode === 'structured'\) draft\.collections\.push\(createCollection\(\{\n      domainId: domain\.id, name: '短语总表', type: 'system-phrases', order: Number\.MAX_SAFE_INTEGER,\n    \}\)\);",'',s,count=1)
          if n != 1: raise SystemExit(f'new-domain phrase system table removal: {n}')
          s=s.replace("    if (collection.type === 'system-phrases') throw new Error('系统短语表不可重命名');\n",'')
          s=s.replace("    if (collection.type === 'system-phrases') throw new Error('系统短语表不可删除');\n",'')
          s=s.replace("  if (collection.type === 'system-phrases' && !isPhraseText(text)) throw new Error(`系统短语表不能导入普通词：${text}`);\n",'')
          old="const desiredKind = domain?.contentMode === 'nonStructured' ? 'content' : (isPhraseText(text) ? 'phrase' : 'word');"
          count=s.count(old)
          if count != 2: raise SystemExit(f'word/phrase auto classification count: {count}')
          s=s.replace(old,"if (domain?.contentMode !== 'nonStructured' && isPhraseText(text)) throw new Error(`当前版本仅接受单词条目：${text}`);\n    const desiredKind = domain?.contentMode === 'nonStructured' ? 'content' : 'word';")
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if s.count('seed11-word-only-20260912-1') != 1: raise SystemExit('cache generation mismatch')
          p.write_text(s.replace('seed11-word-only-20260912-1','seed11-word-only-20260912-2',1),encoding='utf-8')
          PY
      - name: Validate Seed11 and runtime system tables
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-model.js
          node --check js/v3-store.js
          node --check js/v3-db.js
          node --check js/v5-seed-migration.js
          node --check sw.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { canonicalizeBackup, buildProjection, SYSTEM_GLOBAL_PHRASES_ID } from './js/v3-model.js';
          const manifest=JSON.parse(fs.readFileSync('data/seed5-runtime/manifest.json','utf8'));
          const seed=JSON.parse(fs.readFileSync(manifest.meta.path,'utf8'));
          for (const key of ['entries','memberships','relationComponents']) {
            seed[key]=[];
            for (const d of manifest[key]) seed[key].push(...JSON.parse(fs.readFileSync(d.path,'utf8')));
          }
          const canonical=canonicalizeBackup(seed);
          if (canonical.collections.some(x=>x.type==='system-phrases'||String(x.id||'').endsWith('__phrases'))) throw new Error('Seed11 persists phrase system table');
          if (canonical.entries.some(x=>x.kind==='phrase')) throw new Error('Seed11 contains phrase entries');
          if (buildProjection(canonical).has(SYSTEM_GLOBAL_PHRASES_ID)) throw new Error('word-only runtime creates global phrase virtual table');
          if (manifest.counts.entries!==15644 || manifest.counts.relationComponents!==0) throw new Error('unexpected Seed11 counts');
          console.log('SEED11_SYSTEM_TABLE_QA_OK');
          JS
          python - <<'PY'
          from pathlib import Path
          s=Path('js/v3-store.js').read_text(encoding='utf-8')
          for item in ["name: '短语总表', type: 'system-phrases'","isPhraseText(text) ? 'phrase' : 'word'",'系统短语表不能导入普通词']:
              assert item not in s, item
          print('STORE_WORD_ONLY_QA_OK')
          PY
          git diff --check
      - name: Commit repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/seed11-system-table-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align Seed11 system-table invariants with word-only runtime'
          git push origin HEAD:main
