name: Seed 9 pre-merge cleanup

on:
  push:
    branches: [seed9-semantic-review]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time review artifacts
        run: |
          git rm -rf \
            .github/workflows/seed9-focused-finalize.yml \
            .github/workflows/seed9-rebuild.yml \
            .github/workflows/seed9-semantic-refine.yml \
            .github/workflows/seed9-semantic-review.yml \
            .github/workflows/seed9-user-scope-export.yml \
            .github/workflows/seed9-cleanup.yml \
            data/seed-review \
            data/seed-review-user-scope \
            tools/export_seed9_semantic_review.py \
            tools/export_seed9_user_scope.py \
            tools/apply_seed9.mjs \
            tools/patch_seed9_batch.py \
            tools/patch_seed9_semantics.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(seed): remove one-time Seed 9 review artifacts'
          git push origin HEAD:seed9-semantic-review
