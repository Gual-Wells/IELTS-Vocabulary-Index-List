name: Seed 9 focused final refinement

on:
  push:
    branches: [seed9-semantic-review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet opencc-python-reimplemented==0.1.7
      - name: Download bilingual lexical source
        run: curl -L --fail --retry 4 --silent --show-error -o /tmp/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
      - name: Patch English-driven generator
        run: python tools/patch_seed9_semantics.py
      - name: Rebuild authoritative Simplified layer
        env:
          ECDICT_PATH: /tmp/ecdict.csv
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/rebuild_seed9.py
      - name: Review computer terminology domain
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/refine_seed9_stage.py
      - name: Review all general-usage entries
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/refine_seed9_usage_stage.py
      - name: Normalize final Mainland language
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/refine_seed9_language_stage.py
      - name: Reapply canonical storage and QA
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
          SEED9_GENERATED_AT: '2026-09-11T15:40:00.000Z'
        run: node tools/reapply_seed9_semantics.mjs
      - name: Full language audit
        run: python tools/audit_seed9_language.py
      - name: Focused acceptance gates
        run: |
          python - <<'PY'
          import glob,json
          base=json.load(open('data/seed-baselines/seed-9-glosses.json',encoding='utf-8'))
          qa=json.load(open('data/seed-baselines/seed-9-qa.json',encoding='utf-8'))
          entries=[]
          for p in sorted(glob.glob('data/seed5-runtime/entries-*.json')):
              entries += json.load(open(p,encoding='utf-8'))
          rows={r[0]:r for r in base['entries']}
          assert len(entries)==len(rows)==23917
          assert qa['coverage']=='23917/23917'
          assert qa['nonGlossDrift']==0 and qa['entryOrderDrift']==0
          assert qa['canonicalConversionMismatches']==0 and qa['emptyGlosses']==0
          review=qa['semanticReview']
          assert review['computerReviewed']==1583
          assert review['generalUsageReviewed']==595
          assert review['generalUsageDecisionCoverage']=='595/595'
          assert review['languageCleanupChanged']>0
          usage=[e for e in entries if e['domainId']=='domain_general_collocations']
          assert len(usage)==595
          assert all(rows[e['id']][3]=='VIX-9-USAGE-REVIEWED' for e in usage)
          placeholders={'','-','—','…','……','n/a','na','none','todo','tbd','暂无','无释义','待补充'}
          focused=[e for e in entries if e['domainId'] in {'domain_general_english','domain_computer_terms'}]
          bad=[]
          for e in focused:
              hans=str(rows[e['id']][1]).strip()
              if hans.casefold() in placeholders:
                  bad.append((e['text'],hans))
          assert not bad,bad[:20]
          by={(e['domainId'],e['text'].strip().casefold()):rows[e['id']][1] for e in entries}
          expected={
            ('domain_general_collocations','cannot help [doing] ...'):'忍不住[做]……',
            ('domain_general_collocations','be due to do'):'预定做……；预计将做……',
            ('domain_general_collocations','find it ... to do'):'认为做……是……的',
            ('domain_general_collocations','it is [adjective] to [verb] ...'):'[动词]……是[形容词]的',
            ('domain_general_collocations','only when ... can [someone] ...'):'只有当……时，[某人]才能……',
            ('domain_general_collocations','so ... that ...'):'如此……以至于……',
            ('domain_general_collocations','think it ... to do'):'认为做……是……的',
            ('domain_general_collocations','what makes [something] [adjective] is ...'):'使[某事物]显得[形容词]的是……',
            ('domain_general_collocations','used to do'):'过去常常做……',
            ('domain_general_collocations','thanks to ...'):'由于；多亏……',
            ('domain_computer_terms','serviceworker'):'在后台拦截网络请求的浏览器工作线程',
            ('domain_general_english','hmm'):'嗯；唔（表示思考或犹豫）',
            ('domain_general_english','imagination'):'想象；想象力',
          }
          for k,v in expected.items(): assert by.get(k)==v,(k,by.get(k),v)
          print('FOCUSED_SEED9_GATES_OK',json.dumps({
              'coverage':qa['coverage'],
              'computerReviewed':review['computerReviewed'],
              'generalUsageReviewed':review['generalUsageReviewed'],
              'generalUsageChanged':review['generalUsageChanged'],
              'languageCleanupChanged':review['languageCleanupChanged'],
              'focusedBlankLike':len(bad),
          },ensure_ascii=False))
          PY
          git diff --check
      - name: Commit final focused Seed 9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/seed5-runtime data/seed-baselines/seed-9-glosses.json data/seed-baselines/seed-9-qa.json tools/rebuild_seed9.py tools/patch_seed9_semantics.py
          if git diff --cached --quiet; then echo 'No Seed 9 data changes'; exit 0; fi
          git commit -m 'feat(seed): finalize focused Seed 9 gloss review'
          git push origin HEAD:seed9-semantic-review
