name: Seed 9 rebuild

on:
  push:
    branches: [seed9-full-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ECDICT and measure coverage
        run: |
          curl -L --fail --retry 3 --silent --show-error -o /tmp/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
          ls -lh /tmp/ecdict.csv
          python - <<'PY'
          import csv,json,glob,collections
          entries=[]
          for p in sorted(glob.glob('data/seed5-runtime/entries-*.json')):
              entries.extend(json.load(open(p,encoding='utf-8')))
          terms={}
          with open('/tmp/ecdict.csv',encoding='utf-8',errors='replace',newline='') as f:
              for r in csv.DictReader(f):
                  w=(r.get('word') or '').strip().lower()
                  if w and w not in terms: terms[w]=r
          for d in sorted(set(e['domainId'] for e in entries)):
              pool=[e for e in entries if e['domainId']==d]
              hit=[e for e in pool if e['normalizedText'] in terms and (terms[e['normalizedText']].get('translation') or '').strip()]
              print('COVERAGE',d,len(hit),'/',len(pool),round(len(hit)/len(pool)*100,2))
          samples=['trample','compel','commitment','abstract data type','be entitled to','be responsible for','give one\'s attention','discriminate between...and']
          for s in samples:
              r=terms.get(s.lower())
              print('ECDICT',s,repr((r or {}).get('translation')), 'DEF',repr((r or {}).get('definition')))
          PY
      - name: Verify Google translate fallback
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          tests=[
            'abstract data type','batch inference','agent','hallucination',
            'be entitled to','give one\'s attention','There is no point in [doing] ...',
            'account for differences','require someone to do','versatile people'
          ]
          for t in tests:
              q=urllib.parse.urlencode({'client':'gtx','sl':'en','tl':'zh-CN','dt':'t','q':t})
              req=urllib.request.Request('https://translate.googleapis.com/translate_a/single?'+q,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
                  out=''.join(seg[0] for seg in data[0] if seg and seg[0])
                  print('GT',repr(t),'=>',repr(out))
              except Exception as ex:
                  print('GTERR',repr(t),type(ex).__name__,str(ex))
          PY
