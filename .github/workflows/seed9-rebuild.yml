name: Seed 9 rebuild

on:
  push:
    branches: [seed9-full-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-seed9:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --quiet opencc-python-reimplemented==0.1.7
      - name: Download bilingual lexical source
        run: curl -L --fail --retry 4 --silent --show-error -o /tmp/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
      - name: Preserve structured placeholders in generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rebuild_seed9.py')
          s=p.read_text(encoding='utf-8')
          marker='BRACKET_RE = re.compile(r"\\[[^\\]]{1,12}\\]\\s*")\n'
          insertion=marker + 'DOMAIN_TAG_RE = re.compile(r"\\[(?:法|医|化|计|机|電|电|通信|语|经|贸|数|物|生|农|商|测|地|矿|纺|冶|航|建|军)\\]\\s*")\n'
          if 'DOMAIN_TAG_RE = ' not in s:
              assert marker in s
              s=s.replace(marker,insertion,1)
          old='    text = BRACKET_RE.sub("", text)\n    text = text.replace("\\\\n", "；").replace("\\n", "；")'
          new='    text = DOMAIN_TAG_RE.sub("", text)\n    text = text.replace("\\\\n", "；").replace("\\n", "；")'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Enable batched fallback translation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rebuild_seed9.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    # Fallback is used only where the bilingual lexicon / curated context rules do not resolve')
          end=s.index('\n    errors = []', start)
          replacement=r'''    # Batch unresolved entries so the public fallback is not rate-limited by thousands
    # of tiny requests. Strong sentinels preserve one-to-one entry boundaries; any malformed
    # batch recursively splits until every entry has an individually validated result.
    def translate_batch(batch):
        if not batch:
            return []
        tagged = "\n".join(f"<<<VIX:{i:03d}>>>{entry['text']}" for i, entry in enumerate(batch))
        raw = google_translate(tagged)
        pattern = re.compile(r"<<<VIX:(\d{3})>>>(.*?)(?=(?:\n?<<<VIX:\d{3}>>>)|\Z)", re.S)
        matches = pattern.findall(raw)
        parsed = {}
        for idx, value in matches:
            parsed[int(idx)] = value.strip()
        if len(parsed) == len(batch) and all(i in parsed for i in range(len(batch))):
            return [parsed[i] for i in range(len(batch))]
        if len(batch) == 1:
            # A single-item batch has no ambiguity even if Google removed the sentinel.
            stripped = re.sub(r"^<<<VIX:\d{3}>>>", "", raw).strip()
            return [stripped]
        mid = len(batch) // 2
        return translate_batch(batch[:mid]) + translate_batch(batch[mid:])

    batch_size = 12
    batches = [pending[i:i + batch_size] for i in range(0, len(pending), batch_size)]
    print(f"FALLBACK_BATCHES {len(batches)} SIZE {batch_size}", flush=True)
    with ThreadPoolExecutor(max_workers=6) as pool:
        future_to_batch = {pool.submit(translate_batch, batch): batch for batch in batches}
        done = 0
        for fut in as_completed(future_to_batch):
            batch = future_to_batch[fut]
            translations = fut.result()
            if len(translations) != len(batch):
                raise RuntimeError(f"batch translation cardinality mismatch: {len(translations)} != {len(batch)}")
            for entry, raw in zip(batch, translations):
                gloss = postprocess_translation(entry, raw)
                results[entry["id"]] = gloss
                sources[entry["id"]] = "VIX-9-MT"
            done += len(batch)
            if done % 240 < len(batch) or done == len(pending):
                print(f"FALLBACK_PROGRESS {done}/{len(pending)}", flush=True)
'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Generate authoritative Mainland Simplified glosses
        env:
          ECDICT_PATH: /tmp/ecdict.csv
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/rebuild_seed9.py
      - name: Encode canonical glosses and rebuild runtime
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
          SEED9_GENERATED_AT: '2026-09-11T00:00:00.000Z'
        run: node tools/apply_seed9.mjs
      - name: Final repository-level gates
        run: |
          python - <<'PY'
          import json,glob,hashlib,pathlib,re
          root=pathlib.Path('.')
          manifest=json.load(open('data/seed5-runtime/manifest.json',encoding='utf-8'))
          qa=json.load(open('data/seed-baselines/seed-9-qa.json',encoding='utf-8'))
          baseline=json.load(open('data/seed-baselines/seed-9-glosses.json',encoding='utf-8'))
          assert manifest['seedRevision']==9
          assert manifest['counts']=={'entries':23917,'memberships':61905,'relationComponents':20793}
          assert qa['coverage']=='23917/23917' and qa['nonGlossDrift']==0 and qa['canonicalConversionMismatches']==0 and qa['emptyGlosses']==0
          assert len(baseline['entries'])==23917 and baseline['fields']==['glossHans','glossHant','glossSource']
          assert all(row[1] and row[2] and row[3] for row in baseline['entries'])
          assert 'export const BUILTIN_SEED_REVISION = 9;' in pathlib.Path('js/v3-db.js').read_text(encoding='utf-8')
          for section in ('entries','memberships','relationComponents'):
              for d in manifest[section]:
                  b=(root/d['path']).read_bytes()
                  assert len(b)==d['bytes']
                  assert hashlib.sha256(b).hexdigest()==d['sha256']
          print('FINAL_GATES_OK',json.dumps({k:qa[k] for k in ('coverage','nonGlossDrift','canonicalConversionMismatches','emptyGlosses','sourceCounts','fallbackCount')},ensure_ascii=False))
          PY
          git diff --check
      - name: Show semantic audit sample
        run: |
          python - <<'PY'
          import json,random
          b=json.load(open('data/seed-baselines/seed-9-glosses.json',encoding='utf-8'))
          rows={r[0]:r for r in b['entries']}
          entries=[]
          for f in sorted(__import__('glob').glob('data/seed5-runtime/entries-*.json')):
              entries += json.load(open(f,encoding='utf-8'))
          rng=random.Random(51011)
          for domain in ('domain_computer_terms','domain_general_collocations','domain_general_english'):
              pool=[e for e in entries if e['domainId']==domain]
              print('\nAUDIT',domain)
              for e in rng.sample(pool,min(40,len(pool))):
                  r=rows[e['id']]
                  print(json.dumps({'text':e['text'],'hans':r[1],'canonical':r[2],'source':r[3]},ensure_ascii=False))
          PY
      - name: Commit generated Seed 9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/seed5-runtime data/seed-baselines/seed-9-glosses.json data/seed-baselines/seed-9-qa.json js/v3-db.js tools/rebuild_seed9.py tools/apply_seed9.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 1
          fi
          git commit -m 'feat(seed): rebuild Seed 9 Mainland Chinese glosses'
          git push origin HEAD:seed9-full-rebuild
