name: Seed 9 rebuild

on:
  push:
    branches: [seed9-full-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Seed 7 baseline format
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/seed-baselines/seed-7-glosses.json')
          x=json.load(p.open(encoding='utf-8'))
          print('TYPE',type(x).__name__,'LEN',len(x) if hasattr(x,'__len__') else None)
          if isinstance(x,dict):
              print('TOP_KEYS',list(x)[:20])
              for k in list(x)[:5]:
                  v=x[k]
                  print('ITEM',repr(k),repr(v)[:3000])
          elif isinstance(x,list):
              for v in x[:5]: print('ITEM',repr(v)[:3000])
          print('HEAD',p.read_text(encoding='utf-8')[:2500])
          PY
      - name: Locate seed revision references
        run: |
          grep -RIn --exclude='entries-*.json' --exclude='memberships-*.json' --exclude='relations-*.json' --exclude='seed-7-glosses.json' -E 'BUILTIN_SEED_REVISION|seedRevision|builtInSeedRevision|seed8-vix|seed-8|Seed 8' js data *.html *.md 2>/dev/null | head -n 300 || true
