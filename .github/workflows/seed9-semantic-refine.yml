name: Seed 9 semantic refinement

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet opencc-python-reimplemented==0.1.7
      - name: Download bilingual lexical source
        run: curl -L --fail --retry 4 --silent --show-error -o /tmp/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
      - name: Patch English-driven generator for semantic pass
        run: python tools/patch_seed9_semantics.py
      - name: Regenerate authoritative Simplified layer
        env:
          ECDICT_PATH: /tmp/ecdict.csv
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/rebuild_seed9.py
      - name: Apply domain-aware semantic review
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
        run: python tools/refine_seed9_stage.py
      - name: Reapply canonical storage and QA
        env:
          SEED9_HANS_OUT: /tmp/seed9-hans.json
          SEED9_GENERATED_AT: '2026-09-11T14:35:00.000Z'
        run: node tools/reapply_seed9_semantics.mjs
      - name: Semantic regression gates
        run: |
          python - <<'PY'
          import glob,json
          base=json.load(open('data/seed-baselines/seed-9-glosses.json',encoding='utf-8'))
          qa=json.load(open('data/seed-baselines/seed-9-qa.json',encoding='utf-8'))
          entries=[]
          for p in sorted(glob.glob('data/seed5-runtime/entries-*.json')): entries+=json.load(open(p,encoding='utf-8'))
          rows={r[0]:r for r in base['entries']}
          by={(e['domainId'],e['normalizedText']):rows[e['id']][1] for e in entries}
          expected={
            ('domain_computer_terms','deduplication'):'去重',
            ('domain_computer_terms','memoization'):'记忆化',
            ('domain_computer_terms','html'):'超文本标记语言',
            ('domain_computer_terms','xml'):'可扩展标记语言',
            ('domain_computer_terms','https'):'超文本传输安全协议',
            ('domain_computer_terms','promise'):'Promise 对象',
          }
          for k,v in expected.items(): assert by.get(k)==v,(k,by.get(k),v)
          assert qa['coverage']=='23917/23917'
          assert qa['nonGlossDrift']==0 and qa['canonicalConversionMismatches']==0 and qa['emptyGlosses']==0
          assert qa['semanticReview']['computerReviewed']==1583
          print('SEMANTIC_GATES_OK')
          PY
          git diff --check
