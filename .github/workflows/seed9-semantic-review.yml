name: Seed 9 semantic review export

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export review targets
        run: python tools/export_seed9_semantic_review.py
