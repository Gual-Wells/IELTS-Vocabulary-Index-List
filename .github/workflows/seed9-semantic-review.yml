name: Seed 9 semantic review export

on:
  push:
    branches: [seed9-semantic-review]
    paths-ignore:
      - 'data/seed-review/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export review targets
        run: python tools/export_seed9_semantic_review.py
      - name: Commit review batches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seed-review
          git commit -m 'chore(seed9): export semantic review targets'
          git push origin HEAD:seed9-semantic-review
