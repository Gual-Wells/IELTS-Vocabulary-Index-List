name: Seed 9 focused user scope export

on:
  push:
    branches: [seed9-semantic-review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export focused review queue
        run: python tools/export_seed9_user_scope.py
      - name: Commit focused review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seed-review-user-scope
          if git diff --cached --quiet; then echo 'No focused review changes'; exit 0; fi
          git commit -m 'test(seed9): materialize focused user review scope'
          git push origin HEAD:seed9-semantic-review
