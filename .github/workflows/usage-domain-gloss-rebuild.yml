name: Usage domain gloss rebuild

on:
  push:
    branches: [fix/usage-domain-gloss-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild all 595 usage glosses from English entries
        run: node tools/rebuild_usage_glosses.mjs
      - name: Validate usage-only mutation
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/rebuild_usage_glosses.mjs
          node --check js/v3-model.js
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const runtime='data/seed5-runtime';
          const files=fs.readdirSync(runtime).filter(n=>/^entries-\d+\.json$/.test(n)).sort();
          const entries=files.flatMap(n=>JSON.parse(fs.readFileSync(path.join(runtime,n),'utf8')));
          const usage=entries.filter(e=>e.domainId==='domain_general_collocations');
          if(entries.length!==23917) throw new Error(`entry count ${entries.length}`);
          if(usage.length!==595) throw new Error(`usage count ${usage.length}`);
          if(usage.some(e=>!e.glossHans||!e.glossHant||e.glossSource!=='VIX-A14-USAGE-REBUILT')) throw new Error('usage coverage/source failed');
          const generic=new Set(['常用英语句型；方括号或省略号部分需结合语境替换。','常用语法框架；使用时需根据句法和语境补全。','常用表达模板；适合在写作或口语中按语境改写。','语篇连接表达；用于组织信息和标明逻辑关系。','常用英语表达。']);
          if(usage.some(e=>generic.has(String(e.glossHans).trim()))) throw new Error('generic template remains');
          const qa=JSON.parse(fs.readFileSync('data/seed-baselines/seed-9-alpha14-repair-qa.json','utf8'));
          if(qa?.usageRebuild?.sourceEntries!==595||qa?.usageRebuild?.nonUsageEntryDrift!==0) throw new Error('QA usage rebuild gate failed');
          console.log('USAGE_DOMAIN_QA_OK', JSON.stringify({usage:usage.length, source:usage[0]?.glossSource, changed:qa.usageRebuild.changedEntries, overrides:qa.usageRebuild.exactSemanticOverrides}));
          NODE
          git diff --check
      - name: Commit rebuilt Seed runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seed5-runtime/entries-*.json data/seed5-runtime/manifest.json data/seed-baselines/seed-9-alpha14-repair-qa.json
          git diff --cached --stat
          git commit -m 'fix(seed): rebuild all usage-domain glosses' || exit 0
          git push origin HEAD:fix/usage-domain-gloss-rebuild
