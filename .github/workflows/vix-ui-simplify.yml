name: VIX UI simplification
on:
  push:
    paths:
      - '.github/workflows/vix-ui-simplify.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply UI and provider cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label, count=1):
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{label}: expected {count}, found {found}')
              return text.replace(old, new)

          def remove_import_module(text, module, required=True):
              pat = re.compile(r"^import\s+\{[\s\S]*?\}\s+from\s+['\"]" + re.escape(module) + r"['\"];\n", re.M)
              out, n = pat.subn('', text, count=1)
              if required and n != 1:
                  raise SystemExit(f'import {module}: expected 1, found {n}')
              return out

          def top_function_span(text, name):
              pat = re.compile(r"^(?:export\s+)?(?:async\s+)?function\s+" + re.escape(name) + r"\s*\(", re.M)
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'function {name} not found')
              nxt = re.compile(r"^(?:export\s+)?(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(", re.M).search(text, m.end())
              end = nxt.start() if nxt else len(text)
              return m.start(), end

          def remove_top_function(text, name):
              a,b = top_function_span(text,name)
              return text[:a] + text[b:]

          def replace_top_function(text, name, code):
              a,b = top_function_span(text,name)
              return text[:a] + code.rstrip() + '\n\n' + text[b:]

          def remove_listener_block(text, prefix, label):
              start = text.find(prefix)
              if start < 0:
                  raise SystemExit(f'{label}: prefix not found')
              i = start
              depth = 0
              quote = None
              esc = False
              line_comment = False
              block_comment = False
              seen_brace = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i+1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in "'\"`": quote = c; i += 1; continue
                  if c == '{': depth += 1; seen_brace = True
                  elif c == '}':
                      depth -= 1
                      if seen_brace and depth == 0:
                          j = text.find(');', i)
                          if j < 0: raise SystemExit(f'{label}: closing ); not found')
                          j += 2
                          if j < len(text) and text[j] == '\n': j += 1
                          return text[:start] + text[j:]
                  i += 1
              raise SystemExit(f'{label}: unterminated block')

          # --- UI ---
          p = Path('js/v3-ui.js')
          s = p.read_text(encoding='utf-8')
          s = remove_import_module(s, './v3-ai.js')
          s = remove_import_module(s, './v3-provider-runtime.js')
          s = remove_import_module(s, './v3-provider-views.js')
          s = must_replace(s,
              "import { normalizeEnglish, positionScopeDomainId, systemDomainContentCollectionId, systemDomainWordsCollectionId, SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_CONTENT_ID } from './v3-model.js';\n",
              "import { normalizeEnglish, positionScopeDomainId, systemDomainContentCollectionId, systemDomainWordsCollectionId, SYSTEM_GLOBAL_WORDS_ID } from './v3-model.js';\n",
              'ui model imports')
          s = must_replace(s,
              "import { buildOxfordLookupUrl, createEntryContext } from './v3-integrations.js';\n",
              "import { buildOxfordLookupUrl } from './v3-integrations.js';\n",
              'ui integration import')
          old_bridge = "import {\n  acknowledgeMirrorRun, bridgeConfigured, cacheMirrorFileCatalog, clearBridgeConfig, deleteGroqSecret, deleteMirrorFile, getBridgeConfig,\n  getCachedMirrorFileCatalog, getMirrorFile, getMirrorInbox, listMirrorFiles, saveGroqSecret, saveMirrorFileRecord, setBridgeConfig, testBridgeConfig, uploadMirrorContext, validateGroqSecret,\n} from './v5-bridge.js';\n"
          new_bridge = "import {\n  acknowledgeMirrorRun, bridgeConfigured, cacheMirrorFileCatalog, clearBridgeConfig, deleteMirrorFile, getBridgeConfig,\n  getCachedMirrorFileCatalog, getMirrorFile, getMirrorInbox, listMirrorFiles, saveMirrorFileRecord, setBridgeConfig, testBridgeConfig, uploadMirrorContext,\n} from './v5-bridge.js';\n"
          s = must_replace(s, old_bridge, new_bridge, 'ui bridge imports')
          s = must_replace(s,
              "import { deleteGroqSpeechApiKey, requestGroqSpeech, saveGroqSpeechApiKey, speakWithSystemTts, validateGroqSpeechApiKey } from './v5-speech.js';\n",
              '',
              'remove speech provider import')
          s = s.replace("let homeGlobalMode = 'structured';\n", '')
          s = s.replace("let activeProviderQuery = null;\n", '')
          s = s.replace("let providerQuerySequence = 0;\n", '')
          # Keep query-menu plumbing as inert compatibility, but eliminate provider execution.
          s = remove_top_function(s, 'createLazySpeechSession')
          s = remove_top_function(s, 'startProviderQuery')
          s = remove_top_function(s, 'openAiAddDialog')
          s = remove_top_function(s, 'openAiCheckDialog')
          s = remove_top_function(s, 'startAiCheck')
          s = remove_top_function(s, 'switchHomeGlobalMode')
          s = replace_top_function(s, 'openQueryMenu', """function openQueryMenu(entry, _collection, _source) {
            try { openOxfordLookup(entry); } catch (error) { displayError(error); }
          }""")
          s = replace_top_function(s, 'toggleHomeMirror', """async function toggleHomeMirror(sourceButton) {
            const before = getMirrorState();
            if (!before.current || sourceButton?.dataset.committing === 'true') return;
            sourceButton.dataset.committing = 'true';
            sourceButton.disabled = true;
            try {
              await setMirrorEnabled(!before.enabled);
              showToast(before.enabled ? 'Mirror 已关闭' : 'Mirror 已开启');
            } finally {
              if (sourceButton?.isConnected) {
                const enabled = Boolean(getMirrorState().enabled);
                sourceButton.disabled = false;
                delete sourceButton.dataset.committing;
                sourceButton.classList.toggle('active', enabled);
                sourceButton.setAttribute('aria-pressed', enabled ? 'true' : 'false');
                sourceButton.title = enabled ? '关闭当前 Mirror' : '开启当前 Mirror';
              }
            }
          }""")
          # Settings are provider-free; Bridge is retained for Mirror transport only.
          s = replace_top_function(s, 'openBridgeDialog', """function openBridgeDialog({ onConfigured = null } = {}) {
            const saved = getBridgeConfig();
            const url = el('input', { type: 'url', value: saved.url, placeholder: 'https://vix-bridge.example.workers.dev', autocomplete: 'url', spellcheck: false, autocorrect: 'off', autocapitalize: 'none' });
            const token = bindCredentialMask(el('input', { type: 'text', className: 'credential-input', value: saved.deviceToken, placeholder: 'Device Token', name: 'vix-opaque-credential', autocomplete: 'off', spellcheck: false, autocorrect: 'off', autocapitalize: 'none' }));
            const test = button('测试', 'secondary-button', async () => {
              const oldText = test.textContent; test.disabled = true; test.textContent = '测试中…';
              try {
                let config = { url: url.value, deviceToken: token.value };
                const result = await testBridgeConfig(config);
                config = applyRecoveredBridgeCredential(config, result, token);
                showToast('Bridge 配置可用');
              } finally { test.disabled = false; test.textContent = oldText; }
            });
            const clear = button('清除配置', 'secondary-button', () => {
              clearBridgeConfig(); url.value=''; token.value=''; syncCredentialMask(token); showToast('Bridge 配置已清除');
            });
            const functionLink = el('a', { className: 'integration-resource-link', href: './integration/vix-function/VIX-Function.ps1', download: 'VIX-Function.ps1', text: 'VIX Function' });
            const instructionLink = el('a', { className: 'integration-resource-link', href: './integration/vix-function/VIX_PERSONALIZED_INSTRUCTIONS.md', download: 'VIX_PERSONALIZED_INSTRUCTIONS.md', text: '个性化指令' });
            openDialog({ title: 'Bridge', variant: 'management', submitText: '保存', body: [
              field('Bridge URL', url), field('Device Token', token),
              el('div', { className: 'settings-row' }, [test, clear]),
              el('section', { className: 'bridge-integration-resources' }, [el('h3', { text: '集成资源' }), el('div', { className: 'bridge-download-row' }, [functionLink, instructionLink])]),
            ], onSubmit: async () => {
              let nextConfig = { url: url.value, deviceToken: token.value };
              const probe = await testBridgeConfig(nextConfig); nextConfig = applyRecoveredBridgeCredential(nextConfig, probe, token); setBridgeConfig(nextConfig);
              onConfigured?.(); showToast('Bridge 已保存');
            }});
          }""")
          s = replace_top_function(s, 'openSettingsDialog', """function openSettingsDialog() {
            const state = getState();
            const numberMode = el('select', {}, [
              el('option', { value: 'none', text: '无序号', selected: state.settings.numberMode === 'none' }),
              el('option', { value: 'group', text: '小标题内编号', selected: state.settings.numberMode === 'group' }),
              el('option', { value: 'global', text: '连续编号', selected: !['none', 'group'].includes(state.settings.numberMode) }),
            ]);
            const body = [
              el('section', { className: 'settings-section' }, [el('h3', { text: '显示' }), field('序号', numberMode)]),
              el('section', { className: 'settings-section' }, [el('h3', { text: '词库' }), el('div', { className: 'settings-row' }, [button('管理词库', 'secondary-button', openLibraryManager)])]),
              el('section', { className: 'settings-section' }, [el('h3', { text: '数据' }), el('div', { className: 'settings-row' }, [button('数据交换', 'secondary-button', openDataExchangeDialog)])]),
              el('section', { className: 'settings-section' }, [el('h3', { text: 'Bridge' }), el('div', { className: 'settings-row' }, [button('打开 Bridge', 'secondary-button', () => openBridgeDialog())])]),
              el('section', { className: 'settings-section' }, [el('h3', { text: 'Mirror' }), el('div', { className: 'settings-row' }, [button('选择文件', 'secondary-button', openMirrorDialog)])]),
              el('section', { className: 'settings-section settings-version' }, [el('span', { text: 'Vocabulary Index ' + APP_VERSION })]),
            ];
            openDialog({ title: '设置', body, variant: 'management', submitText: '保存', onSubmit: async () => {
              await setNumberMode(numberMode.value);
              showToast('设置已保存');
            }});
          }""")
          # Global home has one aggregate: words. No non-structured global projection or home management shortcut.
          s = must_replace(s,
              "function isGlobalCollection(collectionOrId) {\n  const id = typeof collectionOrId === 'string' ? collectionOrId : collectionOrId?.id;\n  return [SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_CONTENT_ID].includes(id);\n}\n",
              "function isGlobalCollection(collectionOrId) {\n  const id = typeof collectionOrId === 'string' ? collectionOrId : collectionOrId?.id;\n  return id === SYSTEM_GLOBAL_WORDS_ID;\n}\n",
              'global collection predicate')
          s = s.replace("  const globalSystem = [SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_CONTENT_ID].includes(collection.id);\n", "  const globalSystem = collection.id === SYSTEM_GLOBAL_WORDS_ID;\n")
          s = s.replace("  const globalSystemView = [SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_CONTENT_ID].includes(collection.id);\n", "  const globalSystemView = collection.id === SYSTEM_GLOBAL_WORDS_ID;\n")
          s = s.replace("  scope.append(el('option', { value: 'global:content', text: '全局非结构总表' }));\n", '')
          s = s.replace("  else if (current.id === SYSTEM_GLOBAL_CONTENT_ID) scope.value = 'global:content';\n", '')
          s = s.replace("    else if (value === 'global:content') allowedIds = new Set(getVisibleEntries(SYSTEM_GLOBAL_CONTENT_ID).map((entry)=>entry.id));\n", '')
          # Local search remains fully local; remove the Groq-backed Chinese association action.
          s = s.replace("  const aiButton = button('AI 联想', 'secondary-button hidden', async () => {});\n", '')
          s = s.replace("    aiButton.classList.toggle('hidden', !isChineseQuery(query));\n", '')
          s = remove_listener_block(s, "  aiButton.addEventListener('click', async () => {", 'AI search listener')
          s = must_replace(s,
              "  const searchContent = el('div', { className: 'search-modal-content' }, [el('div', { className: 'search-controls' }, [input, scope, aiButton]), status, results]);\n",
              "  const searchContent = el('div', { className: 'search-modal-content' }, [el('div', { className: 'search-controls' }, [input, scope]), status, results]);\n",
              'search controls')
          # Collection menus: remove provider-backed AI additions/checks.
          s = re.sub(r"^.*action === 'ai-(?:add|check)'.*\n", '', s, flags=re.M)
          s = re.sub(r"^.*button\('AI 新增'.*\n", '', s, flags=re.M)
          s = re.sub(r"^.*button\('AI 核查'.*\n", '', s, flags=re.M)
          # Row actions: one search icon now opens Oxford directly; remove dedicated Oxford + overflow buttons.
          s = must_replace(s,
              "  const query = iconButton('query', 'entry-query', '查询', () => startProviderQuery('Groq', entry, collection).catch(displayError));\n  const more = iconButton('more', 'entry-more', '更多', () => openEntryActions(entry.id, collection.id));\n  return { refresh, pin, query, more };\n",
              "  const query = iconButton('query', 'entry-query', `在牛津英汉辞书中查询 ${entry.text}`, () => openOxfordLookup(entry));\n  return { refresh, pin, query };\n",
              'entry action buttons')
          s = must_replace(s,
              "  const actionItems = [];\n  const oxford = iconButton('dictionary', 'entry-relations', '词典查询', () => openOxfordLookup(entry));\n  actionItems.push(oxford, actions.refresh, actions.pin, actions.query, actions.more);\n",
              "  const actionItems = [actions.refresh, actions.pin, actions.query];\n",
              'entry row actions')
          # Mirror is a theme-native icon control rather than text.
          groq_icon = re.compile(r"^\s*groq:\s*'.*?',\n", re.M)
          s, n = groq_icon.subn('', s, count=1)
          if n != 1: raise SystemExit(f'Groq icon removal: found {n}')
          anchor = "  multi: '<circle cx=\"5.2\" cy=\"12\" r=\"2.2\"></circle>"
          idx = s.find(anchor)
          if idx < 0: raise SystemExit('icon insertion anchor missing')
          s = s[:idx] + "  mirror: '<path d=\"M5.2 5.2h5.1v13.6H5.2zM13.7 5.2h5.1v13.6h-5.1z\"></path><path d=\"M12 3.8v16.4\"></path>',\n" + s[idx:]
          # Replace the entire home action/toggle setup with one Mirror icon.
          home_start = s.find("  const mirrorSnapshot = getMirrorState();\n  const homeActions = [")
          home_end_marker = "  const sections = [el('section', { className: 'index-scope global-scope'"
          home_end = s.find(home_end_marker, home_start)
          if home_start < 0 or home_end < 0: raise SystemExit('home controls block not found')
          new_home = """  const mirrorSnapshot = getMirrorState();
            const mirrorButton = iconButton('mirror', `icon-button compact home-mirror-button${mirrorSnapshot.enabled ? ' active' : ''}`, mirrorSnapshot.enabled ? '关闭当前 Mirror' : '开启当前 Mirror', (event) => toggleHomeMirror(event.currentTarget), {
              disabled: !mirrorSnapshot.current,
              title: mirrorSnapshot.current ? (mirrorSnapshot.enabled ? '关闭当前 Mirror' : '开启当前 Mirror') : '请先在设置中选择 Mirror 文件',
            });
            mirrorButton.setAttribute('aria-pressed', mirrorSnapshot.enabled ? 'true' : 'false');
            const globalCards = [collectionCard(state.collectionById.get(SYSTEM_GLOBAL_WORDS_ID))];
"""
          s = s[:home_start] + new_home + s[home_end:]
          s = must_replace(s,
              "  const sections = [el('section', { className: 'index-scope global-scope', dataset: { mode: homeGlobalMode } }, [\n    el('header', { className: 'scope-heading' }, [\n      el('h3', { text: '全局' }),\n      el('div', { className: 'scope-actions' }, [toggleGlobal, ...homeActions]),\n    ]),\n",
              "  const sections = [el('section', { className: 'index-scope global-scope' }, [\n    el('header', { className: 'scope-heading' }, [\n      el('h3', { text: '全局' }),\n      el('div', { className: 'scope-actions' }, [mirrorButton]),\n    ]),\n",
              'home global scope')
          s = s.replace("    homeGlobalMode = 'structured';\n", '')
          # Manager count format: owned structural entries / currently actual entries.
          manager_marker = "function libraryManagerBody(draft) {\n"
          mi = s.find(manager_marker)
          if mi < 0: raise SystemExit('libraryManagerBody not found')
          ratio_fn = """function managerEntryRatio(collectionId) {
            const state = getState();
            const occupied = state.structuralProjection?.get(collectionId)?.length || 0;
            const actual = state.projection?.get(collectionId)?.length || 0;
            return `${occupied.toLocaleString()} / ${actual.toLocaleString()}`;
          }

"""
          s = s[:mi] + ratio_fn + s[mi:]
          s = re.sub(r"text: getVisibleEntries\(systemDomainWordsCollectionId\(domain\.id\)\)\.length\.toLocaleString\(\)", "text: managerEntryRatio(systemDomainWordsCollectionId(domain.id)), title: '占有 Entry / 实际 Entry'", s)
          s = must_replace(s,
              "        el('span', { className: 'manager-count', text: collectionCountSummary(collection.id) }),\n",
              "        el('span', { className: 'manager-count', text: managerEntryRatio(collection.id), title: '占有 Entry / 实际 Entry' }),\n",
              'manager normal count')
          # Eliminate any last global-content UI usage and provider identifiers.
          if 'SYSTEM_GLOBAL_CONTENT_ID' in s: raise SystemExit('v3-ui still references global content table')
          forbidden = ['Groq', 'groq', 'getSelectedModel', 'refreshModels', 'suggestSearchTerms', 'suggestEntries', 'queryVocabularyEntry', 'verifyVocabularyEntry', 'createProviderSession', 'renderGroq']
          for token in forbidden:
              if token in s: raise SystemExit(f'v3-ui still contains provider token: {token}')
          p.write_text(s, encoding='utf-8')

          # --- Model/store: retire global non-structured aggregate, retain per-domain non-structured totals. ---
          p = Path('js/v3-model.js')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s, "  projection.set(SYSTEM_GLOBAL_CONTENT_ID, []);\n", '', 'model global content projection init')
          s = must_replace(s, "  const globalContent = [];\n", '', 'model global content array')
          s = must_replace(s, "      globalContent.push(entry);\n", '', 'model global content collect')
          s = must_replace(s, "  projection.set(SYSTEM_GLOBAL_CONTENT_ID, globalContent.sort(globalSorter));\n", '', 'model global content projection final')
          s = must_replace(s,
              "    if ([SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_PHRASES_ID, SYSTEM_GLOBAL_CONTENT_ID].includes(collectionId)) continue;\n",
              "    if ([SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_PHRASES_ID].includes(collectionId)) continue;\n",
              'model global sort skip')
          s = must_replace(s,
              "    const virtualValid = pin.contextCollectionId === SYSTEM_GLOBAL_WORDS_ID || (entry?.kind === 'phrase' && pin.contextCollectionId === SYSTEM_GLOBAL_PHRASES_ID) || pin.contextCollectionId === SYSTEM_GLOBAL_CONTENT_ID || pin.contextCollectionId === domainTotalId || pin.contextCollectionId === systemDomainContentCollectionId(entry?.domainId || '');\n",
              "    const virtualValid = pin.contextCollectionId === SYSTEM_GLOBAL_WORDS_ID || (entry?.kind === 'phrase' && pin.contextCollectionId === SYSTEM_GLOBAL_PHRASES_ID) || pin.contextCollectionId === domainTotalId || pin.contextCollectionId === systemDomainContentCollectionId(entry?.domainId || '');\n",
              'model pin global content validation')
          # Canonicalize legacy pins that were stored against the retired global-content aggregate.
          pin_anchor = "  const pins = array(input?.pins).map((item, index) => ({\n"
          if pin_anchor not in s: raise SystemExit('model pin canonicalization anchor missing')
          s = s.replace(pin_anchor, "  const entryDomainByIdForPins = new Map(entries.map((item) => [item.id, item.domainId]));\n  const pins = array(input?.pins).map((item, index) => ({\n", 1)
          s = must_replace(s,
              "    contextCollectionId: String(item?.contextCollectionId || ''),\n",
              "    contextCollectionId: String(item?.contextCollectionId || '') === SYSTEM_GLOBAL_CONTENT_ID\n      ? systemDomainContentCollectionId(String(item?.domainId || entryDomainByIdForPins.get(String(item?.entryId || '')) || ''))\n      : String(item?.contextCollectionId || ''),\n",
              'legacy global content pin migration')
          p.write_text(s, encoding='utf-8')

          p = Path('js/v3-store.js')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s,
              "  relationEdgeSuppressed, safeId, searchBackup, systemDomainWordsCollectionId, systemDomainContentCollectionId, SYSTEM_GLOBAL_WORDS_ID, SYSTEM_GLOBAL_CONTENT_ID, tokenizeEnglish, uniqueProjectionCount,\n",
              "  relationEdgeSuppressed, safeId, searchBackup, systemDomainWordsCollectionId, systemDomainContentCollectionId, SYSTEM_GLOBAL_WORDS_ID, tokenizeEnglish, uniqueProjectionCount,\n",
              'store model imports')
          s = must_replace(s,
              "  collectionById.set(SYSTEM_GLOBAL_CONTENT_ID, { id: SYSTEM_GLOBAL_CONTENT_ID, domainId: '', name: '全局非结构总表', label: '', type: 'system-global-content', order: -1, hidden: false, virtual: true, createdAt: '', updatedAt: '' });\n",
              '',
              'store global content virtual collection')
          if 'SYSTEM_GLOBAL_CONTENT_ID' in s: raise SystemExit('v3-store still references global content table')
          p.write_text(s, encoding='utf-8')

          # Oxford integration survives alone; provider context is gone.
          Path('js/v3-integrations.js').write_text("""// @ts-check
          export const OXFORD_LOOKUP_SCHEME = 'hk-com-oupc-oecd-lookup://x-callback-url/s';

          function clean(value) { return String(value ?? '').trim(); }

          export function buildOxfordLookupUrl(text) {
            const query = clean(text);
            if (!query) throw new Error('没有可查询的英文');
            return `${OXFORD_LOOKUP_SCHEME}?q=${encodeURIComponent(query)}`;
          }
          """.replace('          ', ''), encoding='utf-8')

          # Bridge remains Mirror transport. Remove every Groq endpoint/secret/probe.
          p = Path('js/v5-bridge.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  const { probeGroq = true, ...requestOptions } = options;\n  const status = await bridgeRequest('/v1/status', { ...requestOptions, config });\n  if (probeGroq && status?.groqState === 'master_key_mismatch') {\n    throw new BridgeError('master_key_mismatch', 'Bridge Master Key 与已保存的 Groq Key 不匹配，请重新保存 Groq Key', 409);\n  }\n  if (probeGroq && status?.groqState === 'unreadable') {\n    throw new BridgeError('groq_secret_unreadable', 'Groq Key 无法解密，请在 Bridge 中重新保存', 409);\n  }\n", "  const requestOptions = options;\n  const status = await bridgeRequest('/v1/status', { ...requestOptions, config });\n")
          # TTS status remains harmless Bridge capability; remove only provider-specific model probe tail.
          s = must_replace(s,
              "  if (!probeGroq || !status?.groq) return status;\n  const models = await bridgeRequest('/v1/groq/models', { ...requestOptions, config });\n  const groqModels = Array.isArray(models?.data) ? models.data : [];\n  return { ...status, groqReachable: true, groqModelCount: groqModels.length, groqModels };\n",
              "  return status;\n",
              'bridge provider probe tail')
          for name in ['saveGroqSecret','validateGroqSecret','deleteGroqSecret','getGroqModels','requestGroqCompletion']:
              s = remove_top_function(s, name)
          if re.search(r'groq', s, re.I): raise SystemExit('v5-bridge still contains Groq')
          p.write_text(s, encoding='utf-8')

          # Remove provider runtime files completely.
          for file in ['js/v3-ai.js','js/v3-groq-contracts.js','js/v3-provider-runtime.js','js/v3-provider-views.js','js/v5-speech.js','css/provider-runtime.css']:
              Path(file).unlink(missing_ok=True)

          # HTML: provider stylesheet and now-unused query menu/task UI are removed.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <link rel="stylesheet" href="./css/provider-runtime.css">\n', '')
          s = re.sub(r'^\s*<button id="task-capsule".*?</button>\n', '', s, flags=re.M)
          s = re.sub(r'^\s*<div id="task-panel".*?</div>\n', '', s, flags=re.M)
          s = re.sub(r'^\s*<div id="query-menu".*?</div>\n', '', s, flags=re.M)
          p.write_text(s, encoding='utf-8')

          # UI element map/init must tolerate removed inert task/query DOM.
          p = Path('js/v3-ui.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  'bottom-toolbar', 'bottom-last-position', 'back-to-top', 'bottom-mode', 'bottom-view-switch', 'bottom-search', 'task-capsule', 'task-panel', 'toast-region', 'update-banner', 'update-now-button', 'update-later-button',\n",
                        "  'bottom-toolbar', 'bottom-last-position', 'back-to-top', 'bottom-mode', 'bottom-view-switch', 'bottom-search', 'toast-region', 'update-banner', 'update-now-button', 'update-later-button',\n")
          s = s.replace("  'home-annotation-banner', 'home-annotation-icon', 'home-annotation-text', 'clear-all-annotations', 'mirror-status-banner', 'mirror-status-text', 'mirror-status-action', 'query-menu', 'relation-target-menu',\n",
                        "  'home-annotation-banner', 'home-annotation-icon', 'home-annotation-text', 'clear-all-annotations', 'mirror-status-banner', 'mirror-status-text', 'mirror-status-action', 'relation-target-menu',\n")
          # Inert query menu helpers become pure no-ops so ubiquitous close calls stay safe.
          s = replace_top_function(s, 'closeQueryMenu', "function closeQueryMenu() {}")
          s = replace_top_function(s, 'positionQueryMenu', "function positionQueryMenu() {}")
          s = s.replace("  if (activeQueryMenu) positionQueryMenu();\n", '')
          s = s.replace("  if (activeQueryMenu) closeQueryMenu({ immediate: true });\n", '')
          s = s.replace("let activeQueryMenu = null;\n", '')
          # Remove initialization block for the retired task capsule.
          task_start = "  elements['task-capsule'].addEventListener('click', () => {\n"
          if task_start in s:
              s = remove_listener_block(s, task_start, 'task capsule listener')
          if "elements['task-panel']" in s:
              # renderTaskPanel remains dead provider-era code; remove it and any helpers that only touch it.
              for name in ['renderTaskPanel','minimizeTaskPanel']:
                  try: s = remove_top_function(s, name)
                  except SystemExit: pass
          # Any remaining task element references are dead and unsafe after DOM removal; strip their standalone lines.
          s = re.sub(r"^.*elements\['task-(?:capsule|panel)'\].*\n", '', s, flags=re.M)
          # The current openQueryMenu should never touch the removed popover.
          s = replace_top_function(s, 'openQueryMenu', """function openQueryMenu(entry, _collection, _source) {
            try { openOxfordLookup(entry); } catch (error) { displayError(error); }
          }""")
          # Final provider/global assertions.
          for token in ['Groq','groq','SYSTEM_GLOBAL_CONTENT_ID','v3-ai','v3-provider','v3-groq','requestGroq','suggestSearchTerms','getSelectedModel']:
              if token in s: raise SystemExit(f'final v3-ui token remains: {token}')
          p.write_text(s, encoding='utf-8')

          # VIX visual overrides: icon Mirror and wider entry text lane with three right-aligned row controls.
          p = Path('css/v5.0.0.css')
          s = p.read_text(encoding='utf-8')
          s += """

          /* 2026-09-13 compact home + entry controls */
          .home-mirror-button {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 18%, transparent);
            background: color-mix(in srgb, var(--surface) 86%, var(--accent-soft));
          }
          .home-mirror-button.active {
            color: var(--accent-ink);
            background: var(--accent-soft);
            border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
          }
          .home-mirror-button .ui-icon { width: 20px; height: 20px; }
          .entry-line { grid-template-columns: minmax(0, 1fr) 48px 120px; }
          .entry-actions { grid-template-columns: repeat(3, 40px); justify-content: end; }
          .entry-actions > button { width: 40px; }
          .entry-control-main { justify-content: end; }
          @media (max-width: 390px) {
            .entry-line { grid-template-columns: minmax(0, 1fr) 43px 114px; }
            .entry-actions { grid-template-columns: repeat(3, 38px); }
            .entry-actions > button { width: 38px; }
          }
          """
          p.write_text(s, encoding='utf-8')

          # Service worker: remove deleted modules and force a fresh installed graph.
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('seed11-word-only-20260912-3', 'ui-compact-no-groq-20260913-1')
          s = s.replace("  './css/provider-runtime.css', './css/v5.0.0.css', './js/v3-provider-runtime.js', './js/v3-groq-contracts.js', './js/v3-provider-views.js',\n", "  './css/v5.0.0.css',\n")
          s = s.replace("  './js/v3-model.js', './js/v3-import.js', './js/v3-ai.js', './js/v3-exchange.js', './js/v3-integrations.js', './js/v3-data-worker.js',\n", "  './js/v3-model.js', './js/v3-import.js', './js/v3-exchange.js', './js/v3-integrations.js', './js/v3-data-worker.js',\n")
          s = s.replace("  './js/v5-speech.js', './js/v5-version.js'", "  './js/v5-version.js'")
          if re.search(r'groq|provider-runtime|v5-speech|v3-ai', s, re.I): raise SystemExit('sw still precaches retired provider assets')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check js/v3-model.js
          node --check js/v3-store.js
          node --check js/v3-integrations.js
          node --check js/v5-bridge.js
          node --check sw.js
          test ! -e js/v3-ai.js
          test ! -e js/v3-groq-contracts.js
          test ! -e js/v3-provider-runtime.js
          test ! -e js/v3-provider-views.js
          test ! -e js/v5-speech.js
          test ! -e css/provider-runtime.css
          ! grep -RIni --exclude-dir=.git --exclude='vix-ui-simplify.yml' 'groq' js css index.html sw.js
          ! grep -RIn --exclude-dir=.git --exclude='vix-ui-simplify.yml' 'SYSTEM_GLOBAL_CONTENT_ID' js/v3-ui.js js/v3-store.js js/v3-integrations.js
          ! grep -RIn --exclude-dir=.git --exclude='vix-ui-simplify.yml' "system-global-content" js/v3-ui.js js/v3-store.js
          grep -q "managerEntryRatio" js/v3-ui.js
          grep -q "home-mirror-button" js/v3-ui.js
          grep -q "在牛津英汉辞书中查询" js/v3-ui.js

      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/vix-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No headless Chrome; static QA passed.'
            exit 0
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/ >/tmp/vix-dom.html 2>/tmp/vix-chrome.log || { cat /tmp/vix-chrome.log; exit 1; }
          if grep -q '应用无法安全启动' /tmp/vix-dom.html; then
            grep -n -A4 -B4 '应用无法安全启动' /tmp/vix-dom.html || true
            cat /tmp/vix-chrome.log || true
            exit 1
          fi
          if grep -q "Can't find variable" /tmp/vix-dom.html; then
            grep -n "Can't find variable" /tmp/vix-dom.html || true
            exit 1
          fi
          echo 'BROWSER_STARTUP_SMOKE_OK'

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A js css index.html sw.js
          git diff --cached --check
          git commit -m 'refactor: simplify VIX home and entry controls'
          git push origin HEAD:main
