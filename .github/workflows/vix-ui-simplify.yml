name: VIX UI simplification
on:
  push:
    paths:
      - '.github/workflows/vix-ui-simplify.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply requested simplification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/oneoff_vix_ui_simplify.py')
          s = p.read_text(encoding='utf-8')
          old = r'[\s\S]*?'
          new = r'[^;]*?'
          if s.count(old) != 1:
              raise SystemExit(f'import matcher token count={s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace('ui-compact-no-groq-20260913-1', 'ui-compact-20260913-1')
          p.write_text(s, encoding='utf-8')
          PY
          python3 tools/oneoff_vix_ui_simplify.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('css/v4.0.2.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* Query providers use the same dark outline language. */\n.query-menu-option.oxford-option,\n.query-menu-option.groq-option {\n  color: var(--text) !important;\n}\n', '')
          p.write_text(s.rstrip() + '\n', encoding='utf-8')
          p = Path('js/v5-bridge.js')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check js/v3-model.js
          node --check js/v3-store.js
          node --check js/v3-integrations.js
          node --check js/v5-bridge.js
          node --check sw.js
          test ! -e js/v3-ai.js
          test ! -e js/v3-groq-contracts.js
          test ! -e js/v3-provider-runtime.js
          test ! -e js/v3-provider-views.js
          test ! -e js/v5-speech.js
          test ! -e css/provider-runtime.css
          if grep -RIni --exclude-dir=.git --exclude='vix-ui-simplify.yml' --exclude='oneoff_vix_ui_simplify.py' 'groq' js css index.html sw.js; then
            echo 'Groq residue remains'
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude='vix-ui-simplify.yml' --exclude='oneoff_vix_ui_simplify.py' 'SYSTEM_GLOBAL_CONTENT_ID' js/v3-ui.js js/v3-store.js js/v3-integrations.js; then
            echo 'Global content UI residue remains'
            exit 1
          fi
          grep -q 'managerEntryRatio' js/v3-ui.js
          grep -q 'home-mirror-button' js/v3-ui.js
          grep -q '在牛津英汉辞书中查询' js/v3-ui.js
      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/vix-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No headless Chrome; static QA passed.'
            exit 0
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/ >/tmp/vix-dom.html 2>/tmp/vix-chrome.log || { cat /tmp/vix-chrome.log; exit 1; }
          if grep -q '应用无法安全启动' /tmp/vix-dom.html; then
            grep -n -A4 -B4 '应用无法安全启动' /tmp/vix-dom.html || true
            cat /tmp/vix-chrome.log || true
            exit 1
          fi
          if grep -q "Can't find variable" /tmp/vix-dom.html; then
            grep -n "Can't find variable" /tmp/vix-dom.html || true
            exit 1
          fi
          echo 'BROWSER_STARTUP_SMOKE_OK'
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A js css index.html sw.js
          git diff --cached --check
          git commit -m 'refactor: simplify VIX home and entry controls'
          git push origin HEAD:main
