          text=replace_function(text,'openBridgeDialog',bridge_dialog)

          # Replace speech session wholesale: Groq speech first, native TTS fallback.
          speech_session=r'''function createLazySpeechSession() {
  const controller = new AbortController();
  const buffers = new Map();
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  let context = null;
  let source = null;
  let activeControl = null;
  const resetControl = () => {
    if (!activeControl) return;
    activeControl.disabled = false;
    delete activeControl.dataset.state;
    activeControl = null;
  };
  const stop = () => {
    try { source?.stop(); } catch {}
    source = null;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    resetControl();
  };
  const speak = async (text, control) => {
    stop(); activeControl = control; control.disabled = true; control.dataset.state = 'loading';
    try {
      let buffer = buffers.get(text);
      if (!buffer) {
        try {
          const audio = await requestGroqSpeech(text, { signal: controller.signal });
          if (!AudioContextClass) throw new Error('当前浏览器不能解码 Groq 语音');
          context ||= new AudioContextClass();
          await context.resume();
          buffer = await context.decodeAudioData(audio.slice(0));
          buffers.set(text, buffer);
        } catch (error) {
          if (controller.signal.aborted) throw error;
          control.dataset.state = 'native';
          await speakWithSystemTts(text, { signal: controller.signal });
          resetControl();
          return;
        }
      }
      if (controller.signal.aborted || activeControl !== control) return;
      context ||= new AudioContextClass(); await context.resume();
      source = context.createBufferSource(); source.buffer = buffer; source.connect(context.destination);
      source.onended = () => { source = null; resetControl(); };
      control.dataset.state = 'playing'; source.start();
    } catch (error) {
      resetControl();
      if (error?.name !== 'AbortError' && error?.code !== 'cancelled') displayError(error);
    }
  };
  return {
    speak,
    stop,
    dispose: () => { controller.abort(); stop(); buffers.clear(); context?.close().catch(() => undefined); context = null; },
  };
}'''
