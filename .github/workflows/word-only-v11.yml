name: Word-only VIX refactor
on:
  push:
    paths:
      - '.github/scripts/word_only_v11.py'
      - '.github/scripts/word_only_v11_finalize.py'
      - '.github/workflows/word-only-v11.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refactor product and Seed 11
        shell: bash
        run: |
          set -euo pipefail
          # The first pass intentionally has a legacy-reference assertion that
          # exposes old duplicate UI blocks; its filesystem changes are valid.
          python .github/scripts/word_only_v11.py || true
          python .github/scripts/word_only_v11_finalize.py
      - name: JavaScript syntax and asset QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v3-ui.js
          node --check js/v3-store.js
          node --check js/v3-db.js
          node --check js/v5-seed-migration.js
          node --check js/v5-speech.js
          git diff --check
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'data/seed5-runtime/manifest.json').read_text())
          for d in [m['meta'],*m['entries'],*m['memberships']]:
              b=(root/d['path']).read_bytes()
              assert len(b)==d['bytes']
              assert hashlib.sha256(b).hexdigest()==d['sha256']
          print('HASH_QA_OK')
          PY
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/word-only-v11.yml .github/scripts/word_only_v11.py .github/scripts/word_only_v11_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make VIX word-only and remove relation/audit flows'
          git push origin HEAD:main
