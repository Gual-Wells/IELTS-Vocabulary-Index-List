name: Word-only VIX refactor
on:
  push:
    paths:
      - '.github/workflows/word-only-v11.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refactor product and Seed 11
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re, datetime, os

          ROOT = Path('.')

          def read(path): return (ROOT/path).read_text(encoding='utf-8')
          def write(path, text): (ROOT/path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {n}')
              return text.replace(old, new, 1)
          def sub_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, got {n}')
              return out

          # ---------- Speech: Groq TTS key is independent from query key; iOS/browser TTS is fallback ----------
          speech = r'''const SPEECH_KEY_STORAGE = 'gualVocabulary.groqSpeechApiKey';
          const SPEECH_MODEL = 'canopylabs/orpheus-v1-english';
          const SPEECH_VOICE = 'hannah';
          const SPEECH_ENDPOINT = 'https://api.groq.com/openai/v1/audio/speech';
          const MODELS_ENDPOINT = 'https://api.groq.com/openai/v1/models';

          export function getGroqSpeechApiKey() {
            return localStorage.getItem(SPEECH_KEY_STORAGE) || '';
          }

          export function saveGroqSpeechApiKey(value) {
            const key = String(value || '').trim();
            if (!key) throw new Error('语音 API Key 不能为空');
            localStorage.setItem(SPEECH_KEY_STORAGE, key);
          }

          export function deleteGroqSpeechApiKey() {
            localStorage.removeItem(SPEECH_KEY_STORAGE);
          }

          export async function validateGroqSpeechApiKey(value) {
            const key = String(value || '').trim();
            if (!key) throw new Error('语音 API Key 不能为空');
            const response = await fetch(MODELS_ENDPOINT, { headers: { Authorization: `Bearer ${key}` }, cache: 'no-store' });
            if (!response.ok) throw new Error(`语音 API Key 无效（HTTP ${response.status}）`);
            const payload = await response.json();
            const models = Array.isArray(payload?.data) ? payload.data.map((item) => item?.id).filter(Boolean) : [];
            if (!models.includes(SPEECH_MODEL)) throw new Error('当前 Groq 账户未返回 Orpheus English TTS 模型');
            return { ok: true, model: SPEECH_MODEL };
          }

          export async function requestGroqSpeech(text, { signal } = {}) {
            const key = getGroqSpeechApiKey();
            if (!key) throw Object.assign(new Error('未配置 Groq 语音 API Key'), { code: 'speech-unconfigured' });
            const input = String(text || '').trim().slice(0, 200);
            if (!input) throw new Error('没有可朗读内容');
            const response = await fetch(SPEECH_ENDPOINT, {
              method: 'POST', signal,
              headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ model: SPEECH_MODEL, input, voice: SPEECH_VOICE, response_format: 'wav' }),
            });
            if (!response.ok) {
              let detail = '';
              try { detail = (await response.json())?.error?.message || ''; } catch {}
              throw new Error(detail || `Groq 语音生成失败（HTTP ${response.status}）`);
            }
            return response.arrayBuffer();
          }

          export function speakWithSystemTts(text, { signal } = {}) {
            return new Promise((resolve, reject) => {
              if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance !== 'function') {
                reject(new Error('当前浏览器不支持系统语音')); return;
              }
              const utterance = new SpeechSynthesisUtterance(String(text || ''));
              utterance.lang = 'en-US';
              utterance.rate = 0.92;
              const chooseVoice = () => {
                const voices = speechSynthesis.getVoices();
                utterance.voice = voices.find((voice) => /^en-US$/i.test(voice.lang) && /Siri|Samantha|Ava|Allison|Susan/i.test(voice.name))
                  || voices.find((voice) => /^en-US$/i.test(voice.lang))
                  || voices.find((voice) => /^en/i.test(voice.lang))
                  || null;
              };
              chooseVoice();
              utterance.onend = () => resolve();
              utterance.onerror = (event) => reject(new Error(event?.error === 'canceled' ? '语音已取消' : '系统语音播放失败'));
              const abort = () => { speechSynthesis.cancel(); reject(Object.assign(new Error('语音已取消'), { name: 'AbortError' })); };
              if (signal?.aborted) { abort(); return; }
              signal?.addEventListener('abort', abort, { once: true });
              speechSynthesis.cancel();
              speechSynthesis.speak(utterance);
            });
          }
          '''.replace('\n          ', '\n').lstrip()
          write(Path('js/v5-speech.js'), speech)

          # ---------- Seed 11: physical word-only runtime, no relations / audit annotations ----------
          runtime = ROOT/'data/seed5-runtime'
          manifest = json.loads((runtime/'manifest.json').read_text(encoding='utf-8'))
          meta = json.loads((runtime/'meta.json').read_text(encoding='utf-8'))
          def load_stream(descs):
              out=[]
              for d in descs:
                  out += json.loads((ROOT/d['path']).read_text(encoding='utf-8'))
              return out
          entries = load_stream(manifest['entries'])
          memberships = load_stream(manifest['memberships'])
          original_entries = len(entries)
          entries = [e for e in entries if e.get('kind') != 'phrase']
          if len(entries) >= original_entries:
              raise SystemExit('Seed 11: no phrases were removed')
          entry_ids = {e['id'] for e in entries}
          meta['collections'] = [c for c in meta.get('collections', []) if c.get('type') not in ('system-phrases','system-global-phrases') and not str(c.get('id','')).endswith('__phrases')]
          collection_ids = {c['id'] for c in meta['collections']}
          memberships = [m for m in memberships if m.get('entryId') in entry_ids and m.get('collectionId') in collection_ids]
          meta['pins'] = [p for p in meta.get('pins', []) if p.get('entryId') in entry_ids]
          meta['studyStamps'] = [s for s in meta.get('studyStamps', []) if s.get('entryId') in entry_ids]
          meta['annotations'] = []
          for d in meta.get('domains', []):
              d['relationExcluded'] = False
          settings = meta.setdefault('settings', {})
          settings.pop('closeLowLevelRelations', None)
          settings['builtInSeedRevision'] = 11
          settings['migrationComplete'] = True
          settings['migrationSource'] = 'seed11-word-only-no-relations'
          settings['migrationNoticePending'] = False
          settings['contentSources'] = [s for s in settings.get('contentSources', []) if 'phrase' not in (str(s.get('key',''))+' '+str(s.get('title',''))).lower()]
          meta['exportedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')

          def compact(obj): return json.dumps(obj, ensure_ascii=False, separators=(',',':'))
          def descriptor(path, count):
              data=(ROOT/path).read_bytes()
              return {'path':str(path).replace('\\','/'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'count':count}
          def write_chunks(prefix, items, target=4_180_000):
              for p in runtime.glob(prefix+'-*.json'): p.unlink()
              chunks=[]; current=[]; size=2
              for item in items:
                  encoded=compact(item).encode('utf-8')
                  extra=len(encoded)+(1 if current else 0)
                  if current and size+extra>target:
                      chunks.append(current); current=[]; size=2
                  current.append(item); size += len(encoded)+(1 if len(current)>1 else 0)
              if current or not chunks: chunks.append(current)
              desc=[]
              for i, chunk in enumerate(chunks):
                  path=runtime/f'{prefix}-{i:03d}.json'
                  path.write_text(compact(chunk)+'\n', encoding='utf-8')
                  desc.append(descriptor(path, len(chunk)))
              return desc

          (runtime/'meta.json').write_text(compact(meta)+'\n', encoding='utf-8')
          entry_desc = write_chunks('entries', entries)
          membership_desc = write_chunks('memberships', memberships)
          for p in runtime.glob('relations-*.json'): p.unlink()
          if (ROOT/'data/relation-low-level-lexemes.json').exists(): (ROOT/'data/relation-low-level-lexemes.json').unlink()
          manifest = {
              'protocol':'vix-seed-runtime/1','seedRevision':11,'appVersion':manifest.get('appVersion','5.0.0-alpha.14'),
              'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
              'maxChunkBytes':4194304,
              'meta': descriptor(Path('data/seed5-runtime/meta.json'), len(meta)),
              'entries':entry_desc,'memberships':membership_desc,'relationComponents':[],
              'counts':{'entries':len(entries),'memberships':len(memberships),'relationComponents':0},
          }
          # meta descriptor historically has no count
          manifest['meta'].pop('count', None)
          (runtime/'manifest.json').write_text(compact(manifest)+'\n', encoding='utf-8')
          print('SEED11', manifest['counts'], 'removed phrases', original_entries-len(entries))

          # ---------- Database / migration hard gates ----------
          p=Path('js/v3-db.js'); text=read(p)
          text=replace_once(text, 'export const BUILTIN_SEED_REVISION = 10;', 'export const BUILTIN_SEED_REVISION = 11;', 'seed revision')
          write(p,text)

          p=Path('js/v5-seed-migration.js'); text=read(p)
          text=replace_once(text,
              "const HARD_RETIRED_DOMAIN_IDS = new Set(['domain_computer_terms', 'domain_general_collocations']);",
              "const HARD_RETIRED_DOMAIN_IDS = new Set(['domain_computer_terms', 'domain_general_collocations']);\nconst HARD_RETIRED_ENTRY_KINDS = new Set(['phrase']);\nconst HARD_RETIRED_COLLECTION_TYPES = new Set(['system-phrases', 'system-global-phrases']);",
              'migration hard gates')
          text=replace_once(text,
              ".filter((item) => domainIds.has(item.domainId));\n  const collectionIds = new Set(collections.map((item) => item.id));",
              ".filter((item) => domainIds.has(item.domainId) && !HARD_RETIRED_COLLECTION_TYPES.has(item.type) && !String(item.id || '').endsWith('__phrases'));\n  const collectionIds = new Set(collections.map((item) => item.id));",
              'migration collections phrase filter')
          text=replace_once(text,
              ".filter((item) => domainIds.has(item.domainId));\n  const entryIds = new Set(entries.map((item) => item.id));",
              ".filter((item) => domainIds.has(item.domainId) && !HARD_RETIRED_ENTRY_KINDS.has(item.kind));\n  const entryIds = new Set(entries.map((item) => item.id));",
              'migration entries phrase filter')
          text=replace_once(text,
              "  const annotations = current.annotations.filter((item) => finalEntryIds.has(item.entryId));",
              "  const annotations = [];",
              'migration clear annotations')
          text=replace_once(text,
              "  validateBackup(reconciled);",
              "  reconciled.relationComponents = [];\n  reconciled.annotations = [];\n  delete reconciled.settings.closeLowLevelRelations;\n  validateBackup(reconciled);",
              'migration clear relations')
          write(p,text)

          # ---------- Store is word-only even for imported/restored user snapshots ----------
          p=Path('js/v3-store.js'); text=read(p)
          anchor="  const backup = canonicalizeBackup({ schemaVersion: 6, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), ...snapshot });"
          replacement=anchor+"\n  backup.collections = backup.collections.filter((item) => item.type !== 'system-phrases' && item.type !== 'system-global-phrases' && !String(item.id || '').endsWith('__phrases'));\n  backup.entries = backup.entries.filter((item) => item.kind !== 'phrase');\n  const wordOnlyEntryIds = new Set(backup.entries.map((item) => item.id));\n  const wordOnlyCollectionIds = new Set(backup.collections.map((item) => item.id));\n  backup.memberships = backup.memberships.filter((item) => wordOnlyEntryIds.has(item.entryId) && wordOnlyCollectionIds.has(item.collectionId));\n  backup.relationComponents = [];\n  backup.annotations = [];"
          text=replace_once(text, anchor, replacement, 'store word-only gate')
          text=text.replace("  await ensureLowLevelLexemes();\n", "")
          text=replace_once(text,
              "export function getRelatedEntries(entryId, { raw = false } = {}) {\n  return (raw ? state.rawRelationsByEntry : state.relatedEntriesByEntry).get(entryId) || [];\n}",
              "export function getRelatedEntries(_entryId, _options = {}) { return []; }",
              'store related entries off')
          text=replace_once(text,
              "export function getRelationComponents(entryId) {\n  return state.relationComponentsByEntry.get(entryId) || [];\n}",
              "export function getRelationComponents(_entryId) { return []; }",
              'store relation components off')
          # Remove virtual global phrase collection.
          text=re.sub(r"\n\s*collectionById\.set\(SYSTEM_GLOBAL_PHRASES_ID, \{[^\n]+\}\);", "", text, count=1)
          write(p,text)

          # ---------- Main UI ----------
          p=Path('js/v3-ui.js'); text=read(p)
          # Remove Google TTS bridge imports and add speech module.
          for token in ['deleteTtsSecret, ', 'requestSpeech, ', 'saveTtsSecret, ', 'validateTtsSecret,']:
              text=text.replace(token,'')
          bridge_end="} from './v5-bridge.js';"
          text=replace_once(text, bridge_end, bridge_end+"\nimport { deleteGroqSpeechApiKey, requestGroqSpeech, saveGroqSpeechApiKey, speakWithSystemTts, validateGroqSpeechApiKey } from './v5-speech.js';", 'speech import')

          # No phrase collection on home.
          text=text.replace("[state.collectionById.get(systemDomainWordsCollectionId(domain.id)), state.collectionById.get(systemPhraseCollectionId(domain.id))]", "[state.collectionById.get(systemDomainWordsCollectionId(domain.id))]")
          text=text.replace("domain.relationExcluded ? el('span', { className: 'scope-state-note', text: '关联已关闭' }) : null", "null")

          # Query icon is now direct Groq, no provider chooser.
          old="""  const query = iconButton('query', 'entry-query', '选择查询方式', (event) => openQueryMenu(entry, collection, event.currentTarget));\n  query.setAttribute('aria-haspopup', 'menu');\n  query.setAttribute('aria-expanded', 'false');"""
          new="""  const query = iconButton('query', 'entry-query', '查询', () => startProviderQuery('Groq', entry, collection).catch(displayError));"""
          text=replace_once(text, old, new, 'entry direct groq')

          # Provider presentation no longer prints provider brand text.
          text=text.replace("      el('p', { className: 'provider-result-provider', text: provider }),\n", "")
          text=text.replace("'aria-label': 'Groq 查询用途'", "'aria-label': '查询用途'")
          text=text.replace("openActionDialog({ title: provider + ' 查询', body: providerResultBody(provider, entry) })", "openActionDialog({ title: '查询', body: providerResultBody(provider, entry) })")

          # Relation slot in entry row becomes direct Oxford icon, relation panels removed.
          text=re.sub(r"\n  const expanded = expandedRelations\.has\(relationExpansionKey\(collection\.id, entry\.id\)\);\n  const relations = expanded \? relationItemsForEntry\(entry\) : null;\n  const hasRelations = expanded \? Boolean\(relations\?\.length\) : hasRelationsForEntry\(entry\);", "", text, count=1)
          text=text.replace("${expanded ? ' relations-open' : ''}", "")
          text=text.replace("${hasRelations ? ' has-relations' : ''}", "")
          relation_actions=re.compile(r"  const actionItems = \[\];\n  if \(hasRelations\) \{.*?\n  \}\n  actionItems\.push\(actions\.refresh, actions\.pin, actions\.query, actions\.more\);", re.S)
          repl="""  const actionItems = [];
  const oxford = iconButton('dictionary', 'entry-relations', '词典查询', () => openOxfordLookup(entry));
  actionItems.push(oxford, actions.refresh, actions.pin, actions.query, actions.more);"""
          text,n=relation_actions.subn(repl,text,count=1)
          if n!=1: raise SystemExit(f'entry Oxford migration: got {n}')
          relation_slot=re.compile(r"\n  const relationSlot = el\('div', \{\n    className: 'entry-relation-slot',.*?\n  row\.append\(shell, relationSlot\);", re.S)
          text,n=relation_slot.subn("\n  row.append(shell);",text,count=1)
          if n!=1: raise SystemExit(f'relation slot removal: got {n}')

          # Entry action menu: no phrase creation, no audit action.
          text=re.sub(r"\n\s*entry\.kind === 'word' \? button\('添加短语'.*?: null,", "", text, count=1)
          text=re.sub(r"\n\s*annotation \? button\('核查标注'.*?: null,", "", text, count=1)

          # Collection action menu: remove AI audit group and undo/redo controls.
          ai_group=re.compile(r"\n  actions\.push\(el\('div', \{ className: 'action-group' \}, \[\n    el\('p', \{ className: 'action-group-title', text: 'AI' \}\),\n    el\('div', \{ className: 'action-list' \}, \[\n      button\('AI 核查'.*?\n    \]\.filter\(Boolean\)\),\n  \]\)\);", re.S)
          text,n=ai_group.subn('',text,count=1)
          if n!=1: raise SystemExit(f'AI action group removal: got {n}')
          text=re.sub(r"\n\s*button\('撤销', '', async \(\) => \{ closeActionDialog\(\); await performUndo\(\); \}\),", "", text, count=1)
          text=re.sub(r"\n\s*button\('重做', '', async \(\) => \{ closeActionDialog\(\); await performRedo\(\); \}\),", "", text, count=1)

          # Collection top settings now always opens the same global settings as home.
          old="""  elements['settings-button'].addEventListener('click', () => {
    if (currentCollectionId) openCollectionActions(currentCollectionId);
    else openSettingsDialog();
  });"""
          text=replace_once(text, old, "  elements['settings-button'].addEventListener('click', openSettingsDialog);", 'global settings button')

          # Bottom former word/phrase switch keeps its current icon but becomes expand/collapse all.
          old="""  const switchButton = elements['bottom-view-switch'];
  const domain = collection.domainId ? getState().domainById.get(collection.domainId) : null;
  const canSwitch = collection.type === 'normal' && domain?.contentMode !== 'nonStructured';
  const nextKind = section === 'word' ? 'phrase' : 'word';
  switchButton.replaceChildren(svgIcon(section === 'content' ? 'phrase' : (nextKind === 'phrase' ? 'phrase' : 'word')));
  switchButton.disabled = !canSwitch;
  switchButton.title = canSwitch ? `切换到${nextKind === 'phrase' ? '短语' : '词汇'}视图` : (section === 'content' ? '非结构内容不按词汇或短语分页' : '系统总表已按内容类型固定');
  switchButton.setAttribute('aria-label', switchButton.title);
  switchButton.onclick = canSwitch ? () => switchCollectionView(collection).catch(displayError) : null;"""
          new="""  const switchButton = elements['bottom-view-switch'];
  const sectionContext = collectionRenderContext?.sections?.get(section);
  const expansionSet = expandedLettersFor(collection.id, section);
  const sectionKeys = collectionRenderContext?.mode === 'date'
    ? [...(sectionContext?.dateGroups?.keys?.() || [])]
    : [...(sectionContext?.grouped?.keys?.() || [])];
  const allExpanded = sectionKeys.length > 0 && sectionKeys.every((key) => expansionSet.has(collectionRenderContext?.mode === 'date' ? dateExpansionKey(key) : key));
  switchButton.replaceChildren(svgIcon('phrase'));
  switchButton.disabled = !sectionKeys.length;
  switchButton.title = allExpanded ? '全部收起' : '全部展开';
  switchButton.setAttribute('aria-label', switchButton.title);
  switchButton.onclick = sectionKeys.length ? () => toggleAllCollectionSections(collection, section) : null;"""
          text=replace_once(text, old, new, 'bottom expand collapse')

          # Insert expand/collapse implementation before renderBottomToolbar.
          marker="function renderBottomToolbar(collection, section = currentViewKind) {"
          helper="""function toggleAllCollectionSections(collection, section = currentViewKind) {
  const context = collectionRenderContext;
  const sectionContext = context?.sections?.get(section);
  if (!context || context.collection.id !== collection.id || !sectionContext) return;
  const expanded = expandedLettersFor(collection.id, section);
  if (context.mode === 'date') {
    const keys = [...sectionContext.dateGroups.keys()];
    const openAll = keys.some((key) => !expanded.has(dateExpansionKey(key)));
    for (const key of keys) setDateSectionOpen(section, key, openAll, { persist: false });
  } else {
    const keys = [...sectionContext.grouped.keys()];
    const openAll = keys.some((key) => !expanded.has(key));
    for (const key of keys) setLetterSectionOpen(section, key, openAll, { persist: false });
  }
  persistCurrentHistorySnapshot();
  renderBottomToolbar(collection, section);
  refreshAlphabetSectionMetrics();
  updateBackToTopVisibility();
}

"""+marker
          text=replace_once(text,marker,helper,'insert toggle-all helper')

          # Fix initial alphabet rail: lock new rail at physical start until page motion begins.
          anchor="  letterTrackStates.set(track, trackState);"
          inject=anchor+"\n  track.scrollLeft = 0;\n  trackState.manualLocked = true;\n  trackState.manualLockScrollY = window.scrollY;\n  requestAnimationFrame(() => { if (track.isConnected && trackState.manualLocked) track.scrollLeft = 0; });"
          text=replace_once(text,anchor,inject,'alphabet initial A')

          # Domain settings: remove relation setting and phrase wording.
          text=text.replace("  const relationExcluded = el('input', { type: 'checkbox', checked: Boolean(domain.relationExcluded) });\n", "")
          text=text.replace("field('内容模式', el('input', { value: domain.contentMode === 'nonStructured' ? '非结构（内容）' : '结构化（词汇 / 短语）', readOnly: true })),", "field('内容模式', el('input', { value: domain.contentMode === 'nonStructured' ? '非结构（内容）' : '结构化（词汇）', readOnly: true })),")
          text=re.sub(r"\n\s*el\('label', \{ className: 'inline-field' \}, \[el\('span', \{ text: '不参与关联' \}\), relationExcluded\]\),\n\s*el\('p', \{ className: 'help-text', text: '“不参与关联”.*?\}\),", "", text, count=1)
          text=re.sub(r"\n\s*if \(relationExcluded\.checked !== Boolean\(domain\.relationExcluded\)\) await setDomainRelationExcluded\(domain\.id, relationExcluded\.checked\);", "", text, count=1)

          # Replace Bridge configuration dialog so query/speech Groq keys are distinct; remove Google TTS.
          def replace_function(src, name, replacement):
              needle=f'function {name}('
              start=src.find(needle)
              if start<0: raise SystemExit(f'function {name} not found')
              brace=src.find('{',start)
              i=brace; depth=0; quote=None; esc=False; line_comment=False; block_comment=False
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if line_comment:
                      if c=='\n': line_comment=False
                  elif block_comment:
                      if c=='*' and n=='/': block_comment=False; i+=1
                  elif quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c=='/' and n=='/': line_comment=True; i+=1
                      elif c=='/' and n=='*': block_comment=True; i+=1
                      elif c in ('\"', "'", '`'): quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              return src[:start]+replacement+src[i+1:]
                  i+=1
              raise SystemExit(f'unclosed function {name}')

          bridge_dialog=r'''function openBridgeDialog({ onConfigured = null } = {}) {
  const saved = getBridgeConfig();
  const url = el('input', { type: 'url', value: saved.url, placeholder: 'https://vix-bridge.example.workers.dev', autocomplete: 'url', spellcheck: false, autocorrect: 'off', autocapitalize: 'none' });
  const token = bindCredentialMask(el('input', { type: 'text', className: 'credential-input', value: saved.deviceToken, placeholder: 'Device Token', name: 'vix-opaque-credential', autocomplete: 'off', inputmode: 'text', enterkeyhint: 'done', spellcheck: false, autocorrect: 'off', autocapitalize: 'none', 'data-lpignore': 'true', 'data-1p-ignore': 'true', 'data-bwignore': 'true', 'data-form-type': 'other' }));
  const queryKey = bindCredentialMask(el('input', { type: 'text', className: 'credential-input', value: '', placeholder: 'Groq Query API Key', name: 'vix-provider-secret', autocomplete: 'off', inputmode: 'text', enterkeyhint: 'done', spellcheck: false, autocorrect: 'off', autocapitalize: 'none', 'data-lpignore': 'true', 'data-1p-ignore': 'true', 'data-bwignore': 'true', 'data-form-type': 'other' }));
