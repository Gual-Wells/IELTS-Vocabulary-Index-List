<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 增加 viewport-fit=cover 适配 iPhone 灵动岛和全面屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Web App 核心配置标签 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- 状态栏透明/沉浸式 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- 添加到桌面后的 App 名称 -->
    <meta name="apple-mobile-web-app-title" content="词汇管理">
    
    <!-- 添加到桌面后的 App 图标 (使用内联 SVG 免去外部图片依赖) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231abc9c%22 rx=%2222%22/><text y=%2254%22 x=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2250%22>📚</text></svg>">
    
    <title>Vocabulary Manager</title>
    <style>
        :root {
            --primary: #1abc9c;
            --primary-dark: #16a085;
            --bg-color: #f0f2f5;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --danger: #e74c3c;
            --danger-light: #fadbd8;
            --warning: #f1c40f;
            --border-color: #eee;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 15px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
        }
        /* 增加 iOS 的触控优化 */
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg-color); color: var(--text-main); overflow: hidden; overscroll-behavior-y: none; }
        .hidden { display: none !important; }
        
        /* 适配 iOS 上下安全区域 (Safe Area) */
        #home-view { 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            position: relative;
        }
        .columns-container { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            width: 100%; 
            max-width: 320px; 
        }
        .col-btn { 
            padding: 20px; 
            text-align: center; 
            background: #fff; 
            cursor: pointer; 
            border-radius: 16px; 
            box-shadow: var(--shadow-sm); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            border: 2px solid transparent; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .col-btn:hover, .col-btn:active { 
            transform: translateY(-3px); 
            box-shadow: var(--shadow-md); 
            border-color: var(--primary); 
        }
        .col-btn h2 { margin: 0; color: var(--text-main); font-size: 28px; }
        .col-btn p { margin: 0; font-size: 14px; color: var(--text-sub); }
        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: #f0fbf9;
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(26,188,156,0.18);
            white-space: nowrap;
        }
        .word-index {
            color: var(--text-sub);
            font-size: 13px;
            min-width: 42px;
            margin-right: 6px;
            padding-top: 3px;
            text-align: right;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }


        .api-key-btn {
            position: absolute;
            /* 避开 iOS 底部横条 */
            bottom: calc(30px + env(safe-area-inset-bottom));
            background: rgba(255,255,255,0.8);
            border: 1px solid #ddd;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        .api-key-btn:hover { background: #fff; color: var(--text-main); border-color: var(--primary); }

        #category-view { display: flex; height: 100vh; width: 100vw; background: #fff; position: relative; }
        
        /* 为了滑动顺畅，加入 -webkit-overflow-scrolling */
        .main-content { flex: 1; overflow-y: auto; padding: 0 20px calc(80px + env(safe-area-inset-bottom)) 20px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        
        /* 顶部栏避开灵动岛 */
        .top-bar { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--bg-color); padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px; position: sticky; top: 0; background: var(--glass-bg); z-index: 10; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .back-btn { background: transparent; color: var(--text-main); border: 1px solid #ddd; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-right: 20px; transition: all 0.2s; }
        .back-btn:hover { background: var(--bg-color); }
        
        /* 侧边栏上下安全区域适配 */
        .sidebar { 
            width: 76px; 
            background: #2c3e50; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: calc(20px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom)) 0; 
            gap: 15px; 
            box-shadow: -2px 0 10px rgba(0,0,0,0.1); 
            z-index: 20; 
            flex-shrink: 0; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            transition: width .28s cubic-bezier(.2,.8,.2,1);
            position: relative;
        }
        .sidebar.collapsed { width: 0; overflow: visible; }
        .sidebar .side-btn { transition: opacity .2s, transform .25s, background .2s; }
        .sidebar.collapsed .side-btn:not(.sidebar-toggle) { 
            opacity: 0; 
            pointer-events: none; 
            transform: translateX(25px);
        }
        .sidebar-toggle {
            position: absolute;
            left: -18px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 52px;
            border-radius: 14px 0 0 14px;
            background: #2c3e50;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: -3px 4px 12px rgba(0,0,0,.18);
            z-index: 30;
            font-size: 18px;
        }
        .sidebar.collapsed .sidebar-toggle { left: -36px; }

        .side-btn { width: 42px; height: 42px; border-radius: 50%; background: #34495e; border: 2px solid transparent; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 15px; font-weight: bold; transition: all 0.2s; flex-shrink: 0; }
        .side-btn:hover, .side-btn.active { background: var(--primary); transform: scale(1.05); box-shadow: 0 4px 10px rgba(26, 188, 156, 0.4); }
        .side-btn.danger-action { background: #c0392b; }
        .side-btn.ai-action { background: #8e44ad; }
        .side-btn.ai-action.active { background: #9b59b6; box-shadow: 0 0 15px rgba(155, 89, 182, 0.6); border-color: #fff; }

        details { margin-bottom: 12px; background: #fdfdfd; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; transition: all 0.3s; }
        summary { padding: 16px 20px; background: #f8f9fa; font-weight: bold; font-size: 18px; cursor: pointer; user-select: none; outline: none; display: flex; justify-content: space-between; align-items: center; }
        summary:active { background: #eef2f5; }
        .word-list { padding: 0 20px 10px 20px; }
        .word-item { padding: 12px 0; border-bottom: 1px solid var(--border-color); display: flex; align-items: flex-start; font-size: 16px; transition: background 0.3s; line-height: 1.4; position: relative; }
        .word-item:last-child { border-bottom: none; }
        
        .word-content { flex: 1; display: flex; flex-direction: column; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
        .word-content:active { background: var(--bg-color); }
        .word-w { font-weight: 600; color: var(--primary-dark); font-size: 17px; margin-bottom: 2px; display: inline-block; }
        .word-d { color: var(--text-sub); font-size: 14px; }
        
        .word-item.ai-error .word-w { color: var(--danger); }
        .word-item.ai-error .word-d { color: #c0392b; }
        .word-item.ai-error { background: var(--danger-light); border-radius: 6px; padding: 12px 10px; margin: 4px 0; border-bottom: none; }

        .action-icon { margin-right: 15px; margin-top: 4px; cursor: pointer; font-size: 18px; opacity: 0.8; transition: opacity 0.2s; padding: 4px; }
        .action-icon:active { opacity: 1; transform: scale(1.1); }
        .add-btn { margin-top: 15px; width: 100%; padding: 12px; background: #f0fbf9; border: 1px dashed var(--primary); color: var(--primary-dark); font-weight: bold; border-radius: 8px; cursor: pointer; }
        .add-btn:active { background: #e0f7f2; }
        .jump-radio { margin-right: 15px; margin-top: 8px; transform: scale(1.4); cursor: pointer; accent-color: var(--primary); }

        #top-jump-nav { position: absolute; top: calc(15px + env(safe-area-inset-top)); right: 96px; background: var(--text-main); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: var(--shadow-md); z-index: 50; transition: all 0.3s; opacity: 0; pointer-events: none; transform: translateY(-10px); }
        #top-jump-nav.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        #ai-check-nav { position: absolute; bottom: calc(25px + env(safe-area-inset-bottom)); right: 96px; background: rgba(142, 68, 173, 0.95); color: white; padding: 10px 15px; border-radius: 25px; display: flex; align-items: center; gap: 15px; box-shadow: var(--shadow-lg); z-index: 50; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); transition: all 0.3s; opacity: 0; pointer-events: none; transform: translateY(20px); }
        #ai-check-nav.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .ai-nav-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .ai-nav-btn:active { background: rgba(255,255,255,0.2); }

        /* 搜索容器适配底部 */
        #search-container { position: absolute; bottom: 0; left: 0; right: 76px; background: #fff; border-top: 1px solid var(--border-color); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
        #search-container.active { transform: translateY(0); }
        #search-results { max-height: 40vh; overflow-y: auto; background: #fafafa; width: 100%; -webkit-overflow-scrolling: touch; }
        .search-item { padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; }
        .search-item:active { background: var(--bg-color); }
        .search-bar { padding: 12px 15px; display: flex; gap: 10px; background: #fff; align-items: center; }
        .search-bar input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; background: var(--bg-color); -webkit-appearance: none; }
        .search-bar input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 2px rgba(26,188,156,0.2); }
        .close-search { background: var(--text-sub); color: white; border: none; padding: 0 15px; height: 44px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        #custom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
        #custom-modal.show { opacity: 1; pointer-events: auto; }
        .modal-card { background: #fff; width: 90%; max-width: 350px; border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; transform: scale(0.95); transition: transform 0.2s; }
        #custom-modal.show .modal-card { transform: scale(1); }
        .modal-header { padding: 20px 20px 10px 20px; font-size: 18px; font-weight: bold; color: var(--text-main); text-align: center; }
        .modal-body { padding: 10px 20px 20px 20px; color: var(--text-sub); font-size: 15px; text-align: center; }
        .modal-inputs { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .modal-inputs input, .modal-inputs select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; -webkit-appearance: none; }
        .modal-inputs input:focus, .modal-inputs select:focus { border-color: var(--primary); }
        .modal-footer { display: flex; border-top: 1px solid var(--border-color); }
        .modal-btn { flex: 1; padding: 15px; background: transparent; border: none; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .modal-btn:active { background: var(--bg-color); }
        .modal-btn.cancel { color: var(--text-sub); border-right: 1px solid var(--border-color); }
        .modal-btn.confirm { color: var(--primary); font-weight: bold; }
        .modal-btn.confirm.danger { color: var(--danger); }

        /* Toast 避开底部白条 */
        #toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(44, 62, 80, 0.95); color: white; padding: 12px 24px; border-radius: 30px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 10000; font-size: 14px; box-shadow: var(--shadow-md); white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="columns-container">
            <div class="col-btn" onclick="openCategory('A1')"><h2>A1</h2><p>词表</p><span class="count-badge" id="count-A1">0 词</span></div>
            <div class="col-btn" onclick="openCategory('A2')"><h2>A2</h2><p>词表</p><span class="count-badge" id="count-A2">0 词</span></div>
            <div class="col-btn" onclick="openCategory('B1')"><h2>B1</h2><p>词表</p><span class="count-badge" id="count-B1">0 词</span></div>
            <div class="col-btn" onclick="openCategory('B2')"><h2>B2</h2><p>词表</p><span class="count-badge" id="count-B2">0 词</span></div>
            <div class="col-btn" onclick="openCategory('C1')"><h2>C1</h2><p>词表</p><span class="count-badge" id="count-C1">0 词</span></div>
        </div>
        <div class="api-key-btn" onclick="openGroqSettings()">⚙️ 设置 AI Key</div>
    </div>

    <div id="category-view" class="hidden">
        <div class="main-content" id="scroll-area">
            <div class="top-bar">
                <button class="back-btn" onclick="goHome()">◀ 返回</button>
                <h2 id="cat-title" style="margin: 0; color: var(--text-main); font-size: 22px;">Oxford</h2>
            </div>
            <div id="list-container">
                <!-- 动态渲染词汇列表 -->
            </div>
        </div>

        <div id="top-jump-nav" onclick="executeJump()">
            跳至选中目标 📍
        </div>

        <div id="ai-check-nav">
            <button class="ai-nav-btn" onclick="navigateAiError(-1)">◀</button>
            <span id="ai-nav-text" style="font-size: 14px; min-width: 45px; text-align: center;">0 / 0</span>
            <button class="ai-nav-btn" onclick="navigateAiError(1)">▶</button>
        </div>

        <div id="search-container">
            <div id="search-results"></div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="输入搜索..." autocomplete="off">
                <button class="close-search" onclick="closeSearch()">收起</button>
            </div>
        </div>

        <div class="sidebar" id="sidebar">
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="收起/展开侧边栏">›</button>
            <button class="side-btn" id="btn-edit" onclick="toggleEditMode()" title="编辑模式">编</button>
            <button class="side-btn" id="btn-expand" onclick="toggleExpand()" title="全部展开/收缩">展</button>
            <button class="side-btn" id="btn-jump" onclick="toggleJumpMode()" title="设置默认跳转位置">定</button>
            <button class="side-btn" onclick="openSearch('en')" title="英文搜索">英</button>
            <button class="side-btn" onclick="openSearch('zh')" title="中文翻译搜索">中</button>
            <button class="side-btn" id="btn-number-mode" onclick="toggleNumberMode()" title="切换词汇序号显示">序</button>
            <button class="side-btn ai-action" id="btn-ai-check" onclick="toggleAiCheck()" title="AI核查拼写与词性">查</button>
            <button class="side-btn" style="background: #e67e22;" onclick="undo()" title="撤销">撤</button>
            <input type="file" id="file-import" accept=".txt,.md,.csv" class="hidden" onchange="handleFileImport(event)">
            <button class="side-btn" style="background: #27ae60;" onclick="document.getElementById('file-import').click()" title="从文件导入数据">入</button>
        </div>
    </div>

    <div id="custom-modal">
        <div class="modal-card">
            <div class="modal-header" id="modal-title">标题</div>
            <div class="modal-body" id="modal-content">内容</div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modal-btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn confirm" id="modal-btn-confirm">确定</button>
            </div>
        </div>
    </div>

    <div id="toast">提示信息</div>

    <script>
        // === 核心数据结构与状态 ===
        let appData = JSON.parse(localStorage.getItem('vocabDataV2')) || null;
        if (!appData) {
            appData = { "A1": {}, "A2": {}, "B1": {}, "B2": {}, "C1": {} };
        }
        
        let currentCategory = '';
        let isEditMode = false;
        let isJumpMode = false;
        let isExpanded = false;
        // 小标题展开状态独立保存，不受序号/搜索/编辑等功能影响
        let expandedSections = new Set();
        let isAiCheckMode = false;
        let numberMode = Number(localStorage.getItem('numberMode') || 0); // 0无序号 1分组序号 2全局序号
        let historyStack = [];
        let searchMode = '';
        let searchDebounceTimer = null;
        let isSidebarCollapsed = localStorage.getItem('sidebarCollapsed') === '1';

        // AI 核查状态与防污染隔离会话
        let aiErrorIndices = []; 
        let currentAiErrorIndex = -1;
        let currentAiSession = 0; 

        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
        const GROQ_MODELS = ['llama-3.1-8b-instant', 'llama-3.3-70b-versatile', 'mixtral-8x7b-32768'];

        // === 工具函数：防御注入与转义 ===
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function getCategoryWordCount(cat) {
            let total = 0;
            if (appData[cat]) {
                Object.values(appData[cat]).forEach(arr => total += arr.length);
            }
            return total;
        }

        function updateHomeCounts() {
            ['A1','A2','B1','B2','C1'].forEach(cat => {
                let el = document.getElementById('count-' + cat);
                if (el) el.innerText = getCategoryWordCount(cat) + ' 词';
            });
        }

        function toggleNumberMode() {
            numberMode = (numberMode + 1) % 3;
            localStorage.setItem('numberMode', numberMode);
            let labels = ['无序号','分组序号','全局序号'];
            showToast('序号模式：' + labels[numberMode]);
            document.getElementById('btn-number-mode').classList.toggle('active', numberMode !== 0);
            renderList();
        }

        function saveData() {
            localStorage.setItem('vocabDataV2', JSON.stringify(appData));
        }

        function saveStateToHistory() {
            let catClone = JSON.parse(JSON.stringify(appData[currentCategory]));
            historyStack.push(catClone);
            if(historyStack.length > 30) historyStack.shift(); 
        }

        function undo() {
            if(historyStack.length > 0) {
                appData[currentCategory] = historyStack.pop();
                saveData();
                renderList();
                showToast("已撤销上一步操作");
            } else {
                showToast("无可撤销的历史记录");
            }
        }

        let modalConfirmCallback = null;
        function showModal({ title, text, htmlContent, isDanger, confirmText = '确定', onConfirm }) {
            document.getElementById('modal-title').innerText = title;
            const contentEl = document.getElementById('modal-content');
            if (htmlContent) {
                contentEl.innerHTML = htmlContent;
            } else {
                contentEl.innerText = text;
            }
            
            const confirmBtn = document.getElementById('modal-btn-confirm');
            confirmBtn.innerText = confirmText;
            confirmBtn.className = isDanger ? 'modal-btn confirm danger' : 'modal-btn confirm';
            
            modalConfirmCallback = () => {
                if(onConfirm) onConfirm();
                closeModal();
            };
            confirmBtn.onclick = modalConfirmCallback;
            
            document.getElementById('custom-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('show');
            setTimeout(() => { document.getElementById('modal-content').innerHTML = ''; }, 200);
        }

        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                processImportText(evt.target.result);
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function processImportText(text) {
            if(!text.trim()) { showToast("文件内容为空"); return; }
            let lines = text.split('\n');
            let cat = null;
            let letter = null;
            let importedCount = 0;

            for(let line of lines) {
                line = line.trim();
                if(line.startsWith('# ')) {
                    let match = line.match(/(A1|A2|B1|B2|C1)/i);
                    if(match) {
                        cat = match[0].toUpperCase();
                        if(!appData[cat]) appData[cat] = {};
                    }
                } else if(line.startsWith('## ')) {
                    letter = line.replace('##', '').trim().toUpperCase();
                    if(!/^[A-Z]$/.test(letter)) letter = '#';
                    if(cat && !appData[cat][letter]) appData[cat][letter] = [];
                } else if(line.length > 0) {
                    if(cat && letter) {
                        if(!appData[cat][letter]) appData[cat][letter] = [];
                        let parsed = parseWordLine(line);
                        let exists = appData[cat][letter].some(item => item.w === parsed.w);
                        if (!exists) {
                            appData[cat][letter].push(parsed);
                            importedCount++;
                        }
                    }
                }
            }
            saveData();
            updateHomeCounts();
            if(currentCategory) renderList();
            showToast(`成功导入并解析 ${importedCount} 个新词汇！`);
        }

        function parseWordLine(line) {
            let spaceIdx = line.search(/\s+(v\.|n\.|adj\.|adv\.|prep\.|pron\.|conj\.|det\.|art\.|num\.|int\.|indefinite|modal|auxiliary|definite|number|infinitive)/i);
            if(spaceIdx !== -1) {
                return { w: line.substring(0, spaceIdx).trim(), d: line.substring(spaceIdx).trim() };
            }
            let match = line.match(/^([\w\-\',\(\)]+)\s+(.+)$/);
            if (match) {
                return { w: match[1].trim(), d: match[2].trim() };
            }
            return { w: line, d: "" }; 
        }

        function goHome() {
            updateHomeCounts();
            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            closeSearch();
            exitAiCheckMode(); 
        }

        function openCategory(cat) {
            currentCategory = cat;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('category-view').classList.remove('hidden');
            document.getElementById('cat-title').innerText = 'Oxford ' + cat;
            
            isEditMode = false;
            isJumpMode = false;
            exitAiCheckMode();
            document.getElementById('btn-edit').classList.remove('active');
            document.getElementById('btn-jump').classList.remove('active');
            document.getElementById('top-jump-nav').classList.remove('show');
            historyStack = [];
            
            renderList();

            let jumpTarget = localStorage.getItem('jump_' + cat);
            if(jumpTarget) {
                setTimeout(() => jumpToWord(jumpTarget, true), 200);
            } else {
                document.getElementById('scroll-area').scrollTop = 0;
            }
        }

        function renderList() {
            let catData = appData[currentCategory] || {};

            // 保存当前小标题展开状态，避免任何重新渲染功能改变折叠状态
            document.querySelectorAll('#list-container details').forEach(d => {
                if (d.open) expandedSections.add(d.dataset.letter);
                else expandedSections.delete(d.dataset.letter);
            });

            let html = '';
            let savedJump = localStorage.getItem('jump_' + currentCategory);
            let globalIndex = 0;

            for(let letter of LETTERS) {
                let items = catData[letter] || [];
                if(items.length === 0 && !isEditMode) continue;

                let openAttr = expandedSections.has(letter) ? 'open' : '';
                html += `<details id="sec-${letter}" data-letter="${letter}" ${openAttr}>`;
                html += `<summary>${letter} <span style="font-weight:normal;color:var(--text-sub);font-size:14px;">(${items.length})</span></summary>`;
                html += `<div class="word-list">`;
                
                items.forEach((item, index) => {
                    globalIndex++;
                    let safeW = escapeHTML(item.w);
                    let safeD = escapeHTML(item.d);
                    
                    let isTarget = (savedJump === item.w);
                    let checkedAttr = (isTarget && isJumpMode) ? 'checked' : '';
                    let domId = `word-${letter}-${index}`;
                    
                    html += `<div class="word-item" id="${domId}" data-w="${safeW}">`;
                    
                    if (isJumpMode) {
                        html += `<input type="radio" class="jump-radio" name="jumpTarget" ${checkedAttr} onclick="setJumpTarget(this); event.stopPropagation();">`;
                    }
                    if (isEditMode) {
                        html += `<span class="action-icon" onclick="deleteWord('${letter}', ${index}); event.stopPropagation();">🗑️</span>`;
                        html += `<span class="action-icon" onclick="editWord('${letter}', ${index}); event.stopPropagation();">✏️</span>`;
                    }
                    
                    let displayIndex = '';
                    if (numberMode === 1) displayIndex = index + 1;
                    if (numberMode === 2) displayIndex = globalIndex;
                    html += `<div class="word-index">${displayIndex ? displayIndex + '.' : ''}</div><div class="word-content" onclick="handleWordClick(this)">
                                <span class="word-w">${safeW}</span>
                                ${safeD ? `<span class="word-d">${safeD}</span>` : ''}
                             </div>`;
                    html += `</div>`;
                });

                if (isEditMode) {
                    html += `<button class="add-btn" onclick="addWord('${letter}')">+ 在 ${letter} 下添加词汇</button>`;
                }
                html += `</div></details>`;
            }
            document.getElementById('list-container').innerHTML = html;

            if (isJumpMode && savedJump) {
                document.getElementById('top-jump-nav').classList.add('show');
            } else {
                document.getElementById('top-jump-nav').classList.remove('show');
            }
        }

        function handleWordClick(el) {
            if(isEditMode || isJumpMode || isAiCheckMode) return;
            let word = el.closest('.word-item').dataset.w;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(word).then(() => {
                    showToast('已复制单词: ' + word);
                });
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = word;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制: ' + word);
                } catch (err) {
                    showToast('复制失败');
                }
                document.body.removeChild(textArea);
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            let btn = document.getElementById('btn-edit');
            if(isEditMode) {
                btn.classList.add('active');
                if(isJumpMode) toggleJumpMode(); 
                exitAiCheckMode(); 
                isExpanded = true; 
            } else {
                btn.classList.remove('active');
            }
            renderList();
        }

        function toggleExpand() {
            isExpanded = !isExpanded;
            let details = document.querySelectorAll('#list-container details');
            details.forEach(d => {
                if(isExpanded) {
                    d.setAttribute('open', '');
                    expandedSections.add(d.dataset.letter);
                } else {
                    d.removeAttribute('open');
                    expandedSections.delete(d.dataset.letter);
                }
            });
            document.getElementById('btn-expand').classList.toggle('active', isExpanded);
        }

        function toggleJumpMode() {
            isJumpMode = !isJumpMode;
            let btn = document.getElementById('btn-jump');
            if(isJumpMode) {
                btn.classList.add('active');
                if(isEditMode) toggleEditMode();
                exitAiCheckMode();
            } else {
                btn.classList.remove('active');
                document.getElementById('top-jump-nav').classList.remove('show');
            }
            renderList();
        }

        function setJumpTarget(el) {
            let word = el.closest('.word-item').dataset.w;
            localStorage.setItem('jump_' + currentCategory, word);
            document.getElementById('top-jump-nav').classList.add('show');
        }

        function executeJump() {
            let target = localStorage.getItem('jump_' + currentCategory);
            if(target) jumpToWord(target, true);
        }

        function jumpToWord(word, smooth) {
            let items = document.querySelectorAll('.word-item');
            for (let el of items) {
                if (el.dataset.w === word) {
                    let details = el.closest('details');
                    if(details && !details.hasAttribute('open')) {
                        details.setAttribute('open', '');
                    }
                    el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
                    el.style.backgroundColor = 'var(--warning)';
                    setTimeout(() => el.style.backgroundColor = '', 1500);
                    return;
                }
            }
        }

        function addWord(letter) {
            showModal({
                title: '添加新词汇',
                htmlContent: `<div class="modal-inputs">
                                <input type="text" id="inp-w" placeholder="单词 (必须)">
                                <input type="text" id="inp-d" placeholder="词性与解释 (如 n.)">
                              </div>`,
                onConfirm: () => {
                    let w = document.getElementById('inp-w').value.trim();
                    let d = document.getElementById('inp-d').value.trim();
                    if(!w) { showToast('单词不能为空'); return; }
                    
                    saveStateToHistory();
                    if(!appData[currentCategory][letter]) appData[currentCategory][letter] = [];
                    appData[currentCategory][letter].push({w, d});
                    appData[currentCategory][letter].sort((a, b) => a.w.toLowerCase().localeCompare(b.w.toLowerCase()));
                    saveData();
                    renderList();
                    showToast('添加成功');
                }
            });
        }

        function deleteWord(letter, index) {
            let word = appData[currentCategory][letter][index].w;
            showModal({
                title: '确认删除',
                text: `确定要删除单词 "${word}" 吗？`,
                isDanger: true,
                confirmText: '删除',
                onConfirm: () => {
                    saveStateToHistory();
                    appData[currentCategory][letter].splice(index, 1);
                    saveData();
                    renderList();
                    showToast('已删除');
                }
            });
        }

        function editWord(letter, index) {
            let item = appData[currentCategory][letter][index];
            showModal({
                title: '编辑词汇',
                htmlContent: `<div class="modal-inputs">
                                <input type="text" id="inp-w" value="${escapeHTML(item.w)}" placeholder="单词 (必须)">
                                <input type="text" id="inp-d" value="${escapeHTML(item.d)}" placeholder="词性与解释">
                              </div>`,
                onConfirm: () => {
                    let w = document.getElementById('inp-w').value.trim();
                    let d = document.getElementById('inp-d').value.trim();
                    if(!w) { showToast('单词不能为空'); return; }
                    
                    saveStateToHistory();
                    appData[currentCategory][letter][index] = {w, d};
                    appData[currentCategory][letter].sort((a, b) => a.w.toLowerCase().localeCompare(b.w.toLowerCase()));
                    saveData();
                    renderList();
                    showToast('已保存');
                }
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarCollapsed = !isSidebarCollapsed;
            sidebar.classList.toggle('collapsed', isSidebarCollapsed);
            localStorage.setItem('sidebarCollapsed', isSidebarCollapsed ? '1' : '0');
            const btn = sidebar.querySelector('.sidebar-toggle');
            btn.innerText = isSidebarCollapsed ? '‹' : '›';
        }

        function initSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            sidebar.classList.toggle('collapsed', isSidebarCollapsed);
            sidebar.querySelector('.sidebar-toggle').innerText = isSidebarCollapsed ? '‹' : '›';
        }

        function openSearch(mode) {
            searchMode = mode;
            document.getElementById('search-container').classList.add('active');
            let input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('search-results').innerHTML = '';
            input.focus();
            
            if (mode === 'en') {
                input.placeholder = '输入英文单词进行过滤...';
                input.onkeydown = null;
                input.oninput = () => {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(performSearch, 300);
                };
            } else {
                input.placeholder = '输入中文概念，按回车让 AI 关联匹配...';
                input.oninput = null; 
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        // 收起 iOS 软键盘以留出屏幕空间显示结果
                        input.blur();
                        performAiSemanticSearch(input.value.trim());
                    }
                };
            }
        }

        function closeSearch() {
            document.getElementById('search-container').classList.remove('active');
        }

        function performSearch() {
            let q = document.getElementById('search-input').value.trim().toLowerCase();
            if(!q) { document.getElementById('search-results').innerHTML = ''; return; }
            
            let results = [];
            for(let cat in appData) {
                for(let letter in appData[cat]) {
                    for(let item of appData[cat][letter]) {
                        if(searchMode === 'en' && item.w.toLowerCase().includes(q)) {
                            results.push({cat, item});
                        }
                    }
                }
            }
            renderSearchResults(results.slice(0, 50)); 
        }

        async function performAiSemanticSearch(query) {
            if (!query) return;
            let apiKey = localStorage.getItem('groqApiKey');
            if (!apiKey) {
                showToast("请先在首页设置中配置 Groq API Key");
                return;
            }

            let resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '<div class="search-item" style="text-align:center; color:var(--text-sub);">🧠 AI 正在思考相关英文概念...</div>';

            try {
                let prompt = `You are a semantic search assistant for an English vocabulary app.
The user searched for the Chinese concept: "${query}".
Brainstorm 15 to 25 related core English words (base forms only, e.g. "apple", "vehicle").
Return ONLY a valid JSON array of strings. Do NOT output any markdown, markdown code blocks, or extra text. Example format: ["word1", "word2"]`;

                let response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: localStorage.getItem('groqModel') || GROQ_MODELS[0],
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.3
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                let data = await response.json();
                let content = data.choices[0].message.content.trim();
                content = content.replace(/```json/gi, '').replace(/```/g, '').trim();
                
                let conceptWords = [];
                try {
                    conceptWords = JSON.parse(content);
                    if (!Array.isArray(conceptWords)) throw new Error("JSON is not an array");
                } catch(e) {
                    let match = content.match(/\[.*\]/s);
                    if (match) conceptWords = JSON.parse(match[0]);
                    else throw new Error("Invalid JSON format from AI");
                }
                
                conceptWords = conceptWords.map(w => w.toLowerCase());
                let results = [];
                
                for(let cat in appData) {
                    for(let letter in appData[cat]) {
                        for(let item of appData[cat][letter]) {
                            let wLower = item.w.toLowerCase();
                            if(conceptWords.includes(wLower) || conceptWords.some(cw => wLower.includes(cw) || cw.includes(wLower))) {
                                results.push({cat, item});
                            }
                        }
                    }
                }
                
                if (results.length === 0) {
                    resultsContainer.innerHTML = `<div class="search-item" style="text-align:center; color:var(--text-sub);">AI 联想了 [${conceptWords.slice(0,3).join(', ')}...] 等概念，但本地词库未收录。</div>`;
                } else {
                    renderSearchResults(results.slice(0, 50));
                    showToast(`AI 关联成功！找到了 ${results.length} 个本地词汇`);
                }
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = '<div class="search-item" style="text-align:center; color:var(--danger);">❌ AI 检索失败，请检查网络或配置</div>';
                showToast("搜索出错");
            }
        }

        function renderSearchResults(results) {
            let html = '';
            if(results.length === 0) {
                html = '<div class="search-item" style="color:var(--text-sub); text-align:center;">无匹配结果</div>';
            } else {
                results.forEach(res => {
                    html += `<div class="search-item" onclick="jumpFromSearch('${res.cat}', '${escapeHTML(res.item.w)}')">
                                <div style="font-weight:bold; color:var(--primary-dark);">${escapeHTML(res.item.w)} <span style="font-size:12px; background:var(--bg-color); padding:2px 6px; border-radius:10px; color:var(--text-sub); margin-left:8px;">${res.cat}</span></div>
                                <div style="font-size:14px; color:var(--text-sub); margin-top:4px;">${escapeHTML(res.item.d)}</div>
                             </div>`;
                });
            }
            document.getElementById('search-results').innerHTML = html;
        }

        function jumpFromSearch(cat, word) {
            if(currentCategory !== cat) openCategory(cat);
            closeSearch();
            setTimeout(() => jumpToWord(word, true), 300);
        }

        function openGroqSettings() {
            let key = localStorage.getItem('groqApiKey') || '';
            let currentModel = localStorage.getItem('groqModel') || GROQ_MODELS[0];
            let modelOptions = GROQ_MODELS.map(m => `<option value="${m}" ${m===currentModel?'selected':''}>${m}</option>`).join('');

            showModal({
                title: '⚙️ AI 服务设置',
                htmlContent: `<div class="modal-inputs" style="text-align:left;">
                                <label style="font-size:13px; color:var(--text-sub); font-weight:bold;">Groq API Key:</label>
                                <input type="password" id="inp-key" value="${key}" placeholder="gsk_...">
                                <label style="font-size:13px; color:var(--text-sub); font-weight:bold; margin-top:10px;">选择模型:</label>
                                <select id="inp-model" style="padding:10px; border-radius:8px; border:1px solid #ddd; outline:none; font-size:15px; background-color:#fff;">
                                    ${modelOptions}
                                </select>
                              </div>`,
                onConfirm: () => {
                    let newKey = document.getElementById('inp-key').value.trim();
                    let newModel = document.getElementById('inp-model').value;
                    localStorage.setItem('groqApiKey', newKey);
                    localStorage.setItem('groqModel', newModel);
                    showToast('AI 设置已保存');
                }
            });
        }

        function exitAiCheckMode() {
            isAiCheckMode = false;
            document.getElementById('btn-ai-check').classList.remove('active');
            document.getElementById('ai-check-nav').classList.remove('show');
            document.querySelectorAll('.word-item.ai-error').forEach(el => el.classList.remove('ai-error'));
        }

        async function toggleAiCheck() {
            if (isAiCheckMode) {
                exitAiCheckMode();
                return;
            }
            
            let apiKey = localStorage.getItem('groqApiKey');
            if (!apiKey) {
                showToast("请先在首页设置中配置 Groq API Key");
                setTimeout(goHome, 1500);
                return;
            }

            if(isEditMode) toggleEditMode();
            if(isJumpMode) toggleJumpMode();
            
            isAiCheckMode = true;
            document.getElementById('btn-ai-check').classList.add('active');
            aiErrorIndices = [];
            currentAiErrorIndex = -1;
            
            currentAiSession++; 
            let session = currentAiSession;
            
            showToast("AI 正在分块核查词汇，请稍候...");

            let catData = appData[currentCategory];
            let allWords = [];
            for (let l of LETTERS) {
                if (catData[l]) {
                    catData[l].forEach(item => {
                        allWords.push({ w: item.w, d: item.d });
                    });
                }
            }

            if (allWords.length === 0) {
                showToast("当前分类无词汇可查");
                exitAiCheckMode();
                return;
            }

            let batchSize = 30; 
            let errorList = [];

            try {
                for (let i = 0; i < allWords.length; i += batchSize) {
                    if (session !== currentAiSession || !isAiCheckMode) return;
                    
                    let batch = allWords.slice(i, i + batchSize);
                    let prompt = `You are an English teacher checking vocabulary lists.
Examine the following list of words and their parts of speech.
Identify ONLY the items where:
1. The English word is spelled incorrectly.
2. The part of speech is completely wrong for that word.

Return ONLY a JSON array of the problematic English words exactly as they appear in the list. Do not include markdown, explanations, or words that are correct. If all are correct, return [].

List to check:\n`;
                    batch.forEach(item => prompt += `${item.w} - ${item.d}\n`);

                    let response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: localStorage.getItem('groqModel') || GROQ_MODELS[0],
                            messages: [{ role: 'user', content: prompt }],
                            temperature: 0.1
                        })
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    let data = await response.json();
                    let content = data.choices[0].message.content.trim();
                    
                    let match = content.match(/\[.*\]/s);
                    if(match) {
                        let badWords = JSON.parse(match[0]);
                        if(Array.isArray(badWords)) {
                            errorList.push(...badWords);
                        }
                    }
                }

                if (session !== currentAiSession || !isAiCheckMode) return;
                
                let items = document.querySelectorAll('.word-item');
                items.forEach(el => {
                    if (errorList.includes(el.dataset.w)) {
                        el.classList.add('ai-error');
                        aiErrorIndices.push(el);
                        let details = el.closest('details');
                        if (details && !details.hasAttribute('open')) {
                            details.setAttribute('open', '');
                        }
                    }
                });

                if (aiErrorIndices.length > 0) {
                    currentAiErrorIndex = 0;
                    document.getElementById('ai-check-nav').classList.add('show');
                    updateAiNavUI();
                    navigateAiError(0);
                    showToast(`发现 ${aiErrorIndices.length} 处疑似错误，请审核`);
                } else {
                    showToast("太棒了！AI 认为所有拼写与词性均正确。");
                    setTimeout(exitAiCheckMode, 2000);
                }

            } catch (err) {
                console.error(err);
                if(session === currentAiSession) {
                    showToast("AI 核查失败");
                    exitAiCheckMode();
                }
            }
        }

        function updateAiNavUI() {
            let text = `${currentAiErrorIndex + 1} / ${aiErrorIndices.length}`;
            document.getElementById('ai-nav-text').innerText = text;
        }

        function navigateAiError(direction) {
            if(aiErrorIndices.length === 0) return;
            currentAiErrorIndex += direction;
            
            if(currentAiErrorIndex < 0) currentAiErrorIndex = aiErrorIndices.length - 1;
            if(currentAiErrorIndex >= aiErrorIndices.length) currentAiErrorIndex = 0;
            
            updateAiNavUI();
            
            let el = aiErrorIndices[currentAiErrorIndex];
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            el.style.transform = 'scale(1.02)';
            setTimeout(() => el.style.transform = '', 300);
        }
            initSidebar();
    document.addEventListener('DOMContentLoaded', updateHomeCounts);
    </script>
