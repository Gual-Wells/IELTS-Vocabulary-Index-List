<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="词汇索引">
  <meta name="application-version" content="3.0.0">
  <meta name="description" content="本地优先、按词域组织的英语词汇与短语索引">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.groq.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Vocabulary Index 3.0</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/v3.css">
</head>
<body>
  <div id="boot-screen" class="boot-screen" role="status">
    <div class="boot-mark">V</div>
    <p>正在打开本地词汇索引…</p>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="back-button" class="icon-button hidden" type="button" aria-label="返回首页">←</button>
      <div class="brand-block">
        <h1 id="page-title">词汇索引</h1>
        <p id="page-subtitle">Vocabulary Index 3.0</p>
      </div>
      <div class="topbar-actions">
        <button id="undo-button" class="icon-button history-button hidden" type="button" aria-label="撤销" title="撤销">↶</button>
        <button id="redo-button" class="icon-button history-button hidden" type="button" aria-label="重做" title="重做">↷</button>
        <button id="search-button" class="icon-button" type="button" aria-label="搜索">⌕</button>
        <button id="settings-button" class="icon-button" type="button" aria-label="设置">⚙</button>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section id="home-view" class="view"></section>
      <section id="collection-view" class="view hidden" aria-labelledby="page-title">
        <div id="collection-toolbar" class="collection-toolbar"></div>
        <section id="pin-bar" class="pin-bar hidden" aria-label="PIN 导航"></section>
        <nav id="letter-nav" class="letter-nav hidden" aria-label="字母索引"></nav>
        <div id="entry-list" class="entry-list"></div>
      </section>
    </main>

    <nav id="mobile-action-bar" class="mobile-action-bar hidden" aria-label="当前词表操作">
      <button type="button" data-collection-action="search"><span aria-hidden="true">⌕</span><span>搜索</span></button>
      <button type="button" data-collection-action="add"><span aria-hidden="true">＋</span><span>新增</span></button>
      <button type="button" data-collection-action="ai-add"><span aria-hidden="true">✦</span><span>AI 新增</span></button>
      <button type="button" data-collection-action="ai-check"><span aria-hidden="true">✓</span><span>AI 核查</span></button>
      <button type="button" data-collection-action="more"><span aria-hidden="true">•••</span><span>更多</span></button>
    </nav>

    <div id="task-panel" class="task-panel hidden" aria-live="polite"></div>
    <div id="annotation-review-bar" class="review-bar hidden" aria-live="polite"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </div>

  <dialog id="app-dialog" class="app-dialog" data-mode="modal">
    <form id="dialog-form" method="dialog">
      <header class="dialog-header">
        <div>
          <h2 id="dialog-title"></h2>
          <p id="dialog-description" class="muted"></p>
        </div>
        <button id="dialog-close" class="icon-button" type="button" aria-label="关闭">×</button>
      </header>
      <div id="dialog-body" class="dialog-body"></div>
      <footer id="dialog-actions" class="dialog-actions"></footer>
    </form>
  </dialog>

  <input id="hidden-file-input" class="hidden" type="file" accept=".json,.csv,.txt,.md,text/plain,application/json,text/csv">
  <script type="module" src="./js/v3-app.js"></script>
</body>
</html>
