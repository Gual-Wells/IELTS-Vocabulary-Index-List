<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#fafafa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vocabulary Index">
  <meta name="application-version" content="5.0.0-alpha.7">
  <meta name="description" content="本地优先、按词域组织的英语词汇、短语与非结构内容索引">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.groq.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Vocabulary Index 5.0.0-alpha.7</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/vix-icon-180-v4.png">
  <link rel="icon" href="./assets/icons/vix-icon-192-v4.png" sizes="192x192">
  <script src="./js/v3-upgrade.js"></script>
  <link rel="stylesheet" href="./css/v3.css">
  <link rel="stylesheet" href="./css/v3.3.1.css">
  <link rel="stylesheet" href="./css/v3.4.0.css">
  <link rel="stylesheet" href="./css/v4.0.0.css">
  <link rel="stylesheet" href="./css/v4.0.1.css">
  <link rel="stylesheet" href="./css/v4.0.2.css">
  <link rel="stylesheet" href="./css/v4.1.0.css">
  <link rel="stylesheet" href="./css/v4.2.0.css">
  <link rel="stylesheet" href="./css/v4.3.0.css">
  <link rel="stylesheet" href="./css/v4.4.0.css">
  <link rel="stylesheet" href="./css/v4.5.0.css">
  <link rel="stylesheet" href="./css/v4.6.0.css">
  <link rel="stylesheet" href="./css/v4.7.0.css">
  <link rel="stylesheet" href="./css/v4.7.1.css">
  <link rel="stylesheet" href="./css/v4.7.2.css">
  <link rel="stylesheet" href="./css/v4.7.3.css">
  <link rel="stylesheet" href="./css/provider-runtime.css">
  <link rel="stylesheet" href="./css/v5.0.0.css">
</head>
<body>
  <noscript>此工具需要 JavaScript 才能运行。</noscript>


  <div id="boot-screen" class="boot-screen" role="status">
    <div class="boot-mark">V</div>
    <progress id="boot-progress" class="boot-progress" max="100" value="0" aria-label="初始化进度"></progress>
    <p>正在打开本地词汇索引…</p>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-navigation" aria-label="页面导航">
        <button id="back-button" class="icon-button hidden" type="button" aria-label="返回上一页"></button>
        <button id="home-button" class="icon-button hidden" type="button" aria-label="返回首页并清空页面历史"></button>
      </div>
      <div class="brand-block">
        <h1 id="page-title">Vocabulary Index</h1>
        <p id="page-subtitle">5.0.0-alpha.7</p>
      </div>
      <div class="topbar-actions">
        <button id="search-button" class="icon-button" type="button" aria-label="搜索"></button>
        <button id="settings-button" class="icon-button" type="button" aria-label="设置"></button>
      </div>
    </header>

    <div id="update-banner" class="update-banner hidden" role="status">
      <span>新版本已准备好。</span>
      <button id="update-now-button" class="compact-button" type="button">立即更新</button>
      <button id="update-later-button" class="icon-button compact" type="button" aria-label="稍后更新"></button>
    </div>

    <aside id="home-annotation-banner" class="home-annotation-banner hidden" aria-live="polite">
      <div class="annotation-warning-copy">
        <span id="home-annotation-icon" class="annotation-warning-icon" aria-hidden="true"></span>
        <span id="home-annotation-text"></span>
      </div>
      <button id="clear-all-annotations" class="annotation-clear-button" type="button">全部撤销</button>
    </aside>

    <aside id="mirror-status-banner" class="mirror-status-banner hidden" aria-live="polite">
      <span id="mirror-status-text"></span>
      <button id="mirror-status-action" class="mirror-status-action" type="button">管理</button>
    </aside>

    <main id="main-content" tabindex="-1">
      <header id="large-title" class="large-title" aria-labelledby="large-title-heading">
        <p id="large-title-eyebrow" class="large-title-eyebrow"></p>
        <h2 id="large-title-heading"></h2>
        <p id="large-title-subtitle" class="large-title-subtitle"></p>
      </header>
      <section id="home-view" class="view" aria-label="词表首页"></section>
      <section id="collection-view" class="view hidden" aria-labelledby="page-title">
        <div id="collection-toolbar" class="collection-toolbar"></div>
        <section id="pin-bar" class="context-bar pin-bar" aria-label="PIN 导航"></section>
        <section id="annotation-review-bar" class="context-bar review-bar" aria-live="polite"></section>
        <nav id="letter-nav" class="letter-nav hidden" aria-label="字母索引"></nav>
        <div id="entry-list" class="entry-list"></div>
      </section>
    </main>

    <nav id="bottom-toolbar" class="bottom-toolbar hidden" aria-label="词表工具栏">
      <button id="bottom-last-position" type="button" aria-label="继续上次浏览位置"></button>
      <button id="back-to-top" type="button" aria-label="返回顶部"></button>
      <button id="bottom-mode" type="button" aria-label="切换排序模式"></button>
      <button id="bottom-view-switch" type="button" aria-label="切换词汇或短语视图"></button>
      <button id="bottom-search" type="button" aria-label="搜索"></button>
    </nav>

    <button id="task-capsule" class="task-capsule hidden" type="button" aria-label="打开 AI 核查任务"></button>
    <div id="task-panel" class="task-panel hidden" aria-live="polite"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="query-menu" class="query-menu hidden" role="menu" aria-label="选择查询方式"></div>
    <div id="relation-target-menu" class="relation-target-menu hidden" role="menu" aria-label="选择跳转目标"></div>
  </div>

  <div id="app-dialog" class="modal-host hidden" aria-hidden="true"></div>


  <input id="hidden-file-input" class="hidden" type="file" accept=".json,.csv,.txt,.md,text/plain,application/json,text/csv">
  <script type="module" src="./js/v3-app.js"></script>
</body>
</html>
